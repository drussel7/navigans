independent financially as possiblo. In our own case however, expenditure at the moment is at a high level end it is therefore all the more imperative that subscriptions and other Section dues are paid promptly by all Section members. Please send your cash/ cheque to the Treasurer, Room 422, Marconi House, who undertakes in return to forward a current membership card. He XK KH KH HH HH F,W.150, the late property of Club Champion Eyic Cottam has been acquirec by Mrs. Harris of Service Division and her husband. We are pleased to hear that they intend to take part in the racing programme 1958. XX RK HK HH HK \"WHY IS A YACHT REFERRED TO AS 'SHB'?\" Because there's always a bustle abcut her; there's usually a gang of men around; she has a waist and stays; it takes a lot of paint to keep her good-locking; it's not the initial expense that breaks you, but the up- keep; she's all decked out; it takes a good man to handle her right: she shows her top-sides, hides her bottom and when entering port, always heads for the buoys. B.ASP. HMR RH HHH THE DEVELOPMENT OF THE CATAMARAN TYPE t Ey request of the R.Y.A. council, many succesful catamaran races tock place during Cowes Week of 1957. In the opinion of the council, ceutamsrans have come to stay. It may well be that we know little of their atialivies at present, so the council hopes that ciubs will be able to ye fac tate and encourage development. With this in mind it has seemes worthwhile to attract the attention of clubs to certain catamaran charact= ecistics which may involve the followings- Le Handicapping between different types of catamarans is difficult, and between catamarans and other boats is perhaps impossible on account of very high catamaran speeds. The catamaran speed of approach with other craft is very high indeed, especially in fresh conditions. Therefore catamarans should be raced where there is ample room, and courses which might involve their crossing or converging with other boats should be avoided. Catamarans should be started early in the programme, on a long starting line, and given a course of not less then 12 miles. (This can be shortened in light winds) The salvage of a capsized catamaran is a complex problem and should never be tackled in a state of urgency. It may often be best for the catamaran to take its own time to drift into shallow water, sails should then be lowered and centre plates and rudders removed or raised before attempting to right the craft.","(2) as Clubs are asked to consider a requirement in the sailing instructions to the effect that life jackets shall be worn by catamaran crews, as the catamaran can sail on a long way after her crew has left her. 5, Most catemarans can be kept on moorings if parking space is limited. 6. Many catammrans heve been towed hundreds of miles on trailers behind road vehicles in a horizontal position, but drivers should make them- selves quite familiar with the Motor Vehicles (Sonstruction and Use) Regulations 1955, obtainable from H.M. Stationery Office, Kingsway, London, W.C, 2, price 1s. 9d. Finally, we have much to learn, and it is hoped that clubs will pass their knowledge to the R.Y.A. in order that it may be disseminated to other’ clubs. Only by this means will the catamaran. type develop on sound lines, as has done the racing dinghy under the R.Y.A. guidance over the past 25 years. If you have any problem with catamarans, please be sure to write to the R.Y.A. and we might know the answer. RY Ae, 171 Victoria Street, lw 28.11.57 London, S.W.1. XH KR KX HHH KX % * FOR SALE Y.W. Hornet No. 60, lying at Burnham-on-Crouch. Built in 1952 as an open poat, fully decked and curved sliding seat fitted in 1956. 1 suit of CRANFIELD CARTER sails, cotton mainsail and jib, nylon spinaker. Prices £100 o.n.o. Apply:- R. Jesty, Research Labs. Gt. Baddow. 12ft, pram sailing dinghy with oars and all gear. In good condition. Prices- £25. 0.n.o. Applys- L.W. Whitaker, Ext. 38, Gt. Baddow. \"Shamrock\" 18f+. = decked Bermudian Sloop. : Apply:- C. Clarke, Room 54, Gt. Baddow. Ext. 244, G.P.0O, Ext. 42. MOK ee a ak obs SUMMER CRUISE Cne or two berths vacant for local Summer cruise, Aug. lst. to 10th., also another week, date undecided. No sailing experience needed but ability to cook an asset, Berths also available at week-ends, including cruiser races. Please contacts- J.A. Scarlett, Gt. Baddow, Ext. 20. Use of 10? Lugsail Dinghy at Maldon (when not required by owner) offered to anyone prepared to repaint and share expenses. Contact J.A. Scarlett, Gt. Baddow, Ext, 20. KERR RHR RK KKK CHANGE OF CLUB PREMISES The Club's new Headquarters \"Mamgu\" will shortly be moved to Heybridge. The old Clubhouse must be vacated at the end of May. Members are therefore warned to make arrangements for the removal of boats and any other personal property. Dinghies and tenders will be accommadated on the deck of \"Mamgu\" which will provide limited accommodation for sails and small gear below."]},{"year":1958,"month":5,"no":"5","vol":2,"when":"May 1958","span":null,"contents":"Mamgu, Terry Hallam unwell, Chelmer and Blackwater, sailing notes and rules, Avril","note":null,"file":"MSC-NL-1958-05.pdf","imgs":["1958-05-1.jpg","1958-05-2.jpg","1958-05-3.jpg","1958-05-4.jpg"],"pages":["» 4 § Nag 3 'NAVIGANS\" ' , — Monthly Bulletin of the Sailing Section M.A.S.C. Editors- W.J. Hodge (Hon.Sec.) Vol.2 Issue 5 May, 1958 \"“Mamgu\", the barge-yacht which is to be the future headquarters of our Club and which has been a familiar sight moored to Maldon Town Quay for many years, is no longer there and the Quay is looking very bare in consequence. On Sunday, April 20th. she was towed by Cecil Stebbens, the River Bailiff, in his motor boat, to her new moorings at Heybridge and, favoured by fine weather and the assistance from many members and there friends, the manoeuvre was carried out without mishap. It was really quite spectacular to see the moorings from the Town Quay being cast off and final preparations made for the voyage. Dinghy races both from the Maldon Yacht Club and the Maldon Little Ship Club were in progress at the time making a very animated scene and to add to the excitement, quite a large Dutch steamer was coming up the river as the promenade was passed. The new and final moorings which had previously been most carefully planned and laid were successfully picked up by willing assistance from members! sons who were sculling round in their dinghies in readiness off the old Clubhouse at Heybridge and those in charge of the manoeuvre heaved a sigh of relief as the last mooring chain was hauled on board and made fast to the bollards, knowing full well the consequences which may have arisen had there been any mishap at such a critical moment. When viewed from the shore, the barge-yacht presents quite a pleas— ing appearance and in spite of her size, seems to fit in quite well with her surroundings, so that there is not likely to be any criticism on aesthetic grounds. In fact, by the time the new mast has been erected and rigged, and the top-sides have had a few coats of paint, she should enhance the neighbour-— hood and eventually be a credit to the Club. Ay FIRST PARTY ON BOARD \"MAMGU\" Within two weeks of the arrival of our new floating clubhouse at Heybridge it was our tuen to be hosts to the Maldon Little Ship Club for the return team race and a quick decision had to be made as to whether we should entertain our guests and their friends in the old Clubhouse ashore or attempt to make the floating Clubhouse habitable in time. By a really stupendous effort on the part of those members concerned, which involved them in working late into the night of the previous day in order to erect a gangway and clean up the accommodation below generally, it was possible to © have the party on board and by this tremendous spurt, the opening of the Clubhouse has been considerably advanced. The party was a great success and favoured by brilliant weather and a successful race, was really an unforgetable sight to see the rather drab and as yet, unpainted \"Mamgu\" surrounded by the dinghies tied up along- side, with their sails flapping in the breeze, while their crews of both sexes clambered aboard and were soon directed below where food, drinks and other creature comforts awaited them. Apart from the helmsmen and their crews, we were favoured with the presence of Mr. Lenderyou, the Commodore of the M.L.S.C., whilst among those who sailed were Mr. Primmer, their Rear-Commodore who is also President of the Fleetwind Association, together with Messrs. Lavington and Young, Treasurer and Secretary respectively of that Association.","Great credit is due to those members who worked so hard to prepare the Clubhouse for the occasion and also to the wives of members who toiled so modestly and unassumingly behind the scenes to prepare the sandwiches and brew the tea, which was so much appreciated by all after their strenuous race. Another milestone in the history of the Club has been passed!! BoAePo TERRY HALLAM - VICE-COMMODORE Members will be grieved to learn that our exuberant,.ropular and enthusiastic Vice-Commodore is ill and at present in the London Road Hospital, Chelmsford. We are sure that all will join is sending him good wishes for a speedy recovery. It must be very gratifying to him to find that his daughter Celia has risen so nobly to the occasion and is crewing for Tony Durham in their joint dinghy \"Nutsy May\" and that the dinghy has not missed a single race so far. Our best wishes go to Terry for his early recovery and we hope that he will spend at least part of his convalescence in the sunshine on the poop deck of \"Mamgu\" in contemplation of the good work he has done towards the founding of the Club and in bringing the scheme of our new Clubhouse to fruition. BoAoPe PRESS NOTICE By arrangement with the Inland Waterways Association, the Chelmer and Blackwater Navigation Company is permitting pleasure traffic on its waterways. This scenically attractive waterway runs through pleasant pastural countryside for 13 miles from Chelmsford to Heybridge Basin. It is noymally used by commercial barge traffic. Smaller < types of pleasure craft, such as canoes, rowing boats and powered boats ed are permitted to use it under licence which may be obtained through the Chelmsford Boating Club. The conditions under which the craft are allowed on the waterway are similar to those which apply on other water- ways and are designed to ensure that no interference is caused to commer— cial interests, to other water commitments or to the amenities of this attractive area. If necessary, in times of drought there will be some restrictions on the use of the locks. The cost of the licences will be based on the length of the boat. Licences will be issued only to persons who can operate the locks proporly and the Chelmsford Boating Club is undertaking to satisfy the Navigation Company about this. Permanent or temprary membership of the Chelmsford Boating Club is, from the Navigation Company's point of view, desirable. The officials of this Club will instruct boat owmers in the operation of the locks. The existing licence scheme for rowing boats and canoes not using locks is unaffected. Before this scheme started, apart from commercial traffic, only boats not requiring the use of locks were able to use the waterway, i.e. canoes and very light craft. It may be very convenient for members of the Marconi Sailing Club to avail themselves of this facility and lay their boats up at Chelmsford next Winter. AcKe","This year, the Chelmsford Boating Club will be holding the Chelmer Canoe Race on Sunday June 15th. This race has now been established as one of the most popular of all long distance canoe races and canoeists from all over Imgland take part. The race starts at noon at Barnes Mill, Chelmsford and ends at Heybridge Basin, a total distance of 128 miles. The race is run on a handicap basis according to the speed of the canoe. Any persons willing to act as stewards will be welcome. Please contact the Race Secretary at the Clubhouse, Moulsham Mill Lane, Baddow Road, Chelmsford. For the convenience of club members exploring the waterway, the club maintains a pontoon with a built-in cabin, suitabke for camping aboard. This year, the pontoon is to be moored at Paper Mills Lock, about half way along the canal. AK. KRKEKKKKKKE SATLING NOTES At the last Committee Meeting it was agreed that the Club would adopt the following rules:— ali All races will be sailed under the I.Y.R.U. and R.Y.A. rules except as provided for by the following club rules. 26 SAILING COMMITTEE - The general club committee shall constitute the Sailing Committee, three members making a quorum. Be OFFICER OF THE DAY Any member of the club may be Officer of the Day. The Sailing Secretary shall prepare a list of Officers of the Day before the season starts. The Officer of the Day will work in conjunction with the Sailing Secretary is seeing that the racing arrangements are carried out. He should attend the Clubhouse about one hour before the time of the start of the first race to take entries, decide courses, organise starting, shortening of courses, enter results in the club race book and to receive protests. y 4. ENTRIES Hach helmsman shall hand his name and the name of the boat in which he will be racing to the Officer of the Day not less than fifteen minutes before the starting gun for the race in which he is intending to participate. 5. CAPSIZES An entrant will retire if (i) his boat capsizes or (ii) he or his crew go ashore. Helmsmen not retiring voluntarily will be disqualified. 66 TIME LIMIT The time limit for finishing all inshore races shall be one and a half hours after high tide, es given by the Officer of the Day. If no boats finish within this time limit, the race will be abandoned. ; 7. HANDICAPS The handicaps used will be those agreed by the Black-— water Joint Racing Committee. Be CLASS BOATS will be raced in accordanc er. 10. All members, when sailing under the Club Burgee shall abide with the Sailing Rules made by the Sailing Commitce. (Cont'd at foot of page 1)"]},{"year":1958,"month":7,"no":"7","vol":2,"when":"July 1958","span":null,"contents":"Ladies' Cup first mention, Blackwater & Colne Dinghy Championships at Stone, Terylene sails","note":null,"file":"MSC-NL-1958-07.pdf","imgs":["1958-07-1.jpg","1958-07-2.jpg"],"pages":["\"NAVIGANS\" “ Monthly Bulletin of the Sailing Section, MAS. Editor:=- Wed. Hodge (Hon. Sec.) Vol.2 Issue 7 JULY, 1958 COMMITTEE NOTES Over the past seven months or so, your Committee has been actively engaged in the negotiation, purchase and fitting out of the new Clubhouse promises, and all this in addition to the usual day-to-day organisation of the Clube One sad factor of the monthly meeting is the lack of material for this Bulletin. The original idea of a monthly news=sheet with all members subscribing seems to have failed, all past issues having been almost entirely devoted to Committee effortse This is a great pity, for it means that our News=sheet is not, in effect, fully representative of Section activities. So, once again, your editor urges all possible support to future issues. Another sad feature of our club is the apparent nonchalance .of members towards the payment of Section dues, It is noted that, whilst members are prompt in the payment of initial subscriptions, subsequent payments are invariably forgotten or delayed until the last possible moment to ensure continued membership. With Section expenditure at the present high level, it is essential that all members lend full financial support and pay their dues promptly. Wed ole teehee tet Congratulations to our Vice-Commodore, Terry Hallam, now we notice, sufficiently restcred in health to permit some sailing activity. WeJeH e o+te teehee tet SAILING NOTES RACING RESULTS \"Iadies' Cup\" In ideal weather for the occasion. Mrs. Sonya Harris became the first winner of the \"Hallam\" Cup. Miss V. Hallam and Mrs. K. Bagley were 2nd. and 3rd. \"President's Cup\" We are now half-way through this season's Fleetwind series of races. At present, Tony Durham is leading with 128 points, closely followed by Stan Adamson with 105 points. The results of the last three races were as follows:- 4th, Fleetwind Tony Durham first, Stan Adamson seconde 5th. Fleetwind ALL entries retired 6th. Fleetwind Tony Durham first, Ken Bagley second. BLACKWATER AND COLNE DINGHY CHAMPIONSHIPS AT STONE At the last Committee Meeting of the joint clubs, it was decided that Sprites should be used for the championship race this year - Fleetwinds may be used next year. Guns will be used for starting with the aid of deflectors loaned by us to lessen the noise for the neighbourhood, by Klaxons for finishing. It was further decided to have two limit buoys on the line, between the yellow buoy and the shore to be the starting line, and between the outer red buoy and the yellow buoy to be the finishing line and that craft should not be allowed to cross the starting line after the start of their race. The club was represented by the Commodore, Mr. E.H. Cottam and the Sailing Sesretary. A Social evening at Colne Yacht Club followed the meeting. WeDeRe","a: The following is published as being of general interest to members:- FOR SALE Wildcat class racing dinghy, 0.L. 16ft. mast 24ft. R70. OoNeOe Apply: L. Glover, 5, Lowshoe Lane, Romrord, Essex. SUMMER CRUISE One or two berths vacant for local cruise during August; no sailing experience needed but ability to cook an asset. Apply: J.A. Scarlett, Gt. Baddow, Extension 20 FOR SALE Pair of motor car wheels with new tyres, axle and brakes — suitable for yacht trailer. . Apply: S.A.W. Jolliffe, Writtle. Street, S.W.1 The World Sport and Travel Service, (Lairdways Ltd.) of 198/9 Sloane Bodies amounce that booking are available for members of British Governing of Sports and their Clubs, in connection with the XVII OLYMPIAD. Anyone interested should apply to the Editor of this Bulletin, who will be pleased to supply the leaflet giving full details of the proposed arrangements. A Barbecue is to be held at Boyton Hall Farm, Roxwell, Essex, by kind permission of Boyton Hall Farms Ltd. on Friday, July 18th. 1958. It is organised by the Essex Regional Committee of the Sailing Barge Preservat ion Society and will run from (*p.m. tO 27e.m, Application has been made for a licence. Tickets at 17/6a. — (Single) and 30/- (Double), including Supper, may be obatined from the following? W.F. Sherrington, J. McKinlay, Hsq., S.E. Poulton, Esq., S. Cook, Esq. Doe Bros, Motors Ltd., Hillcrest, Barge Yacht, Rose Cottage 1, Spital Road, Baddow Road, Black Hagle, Purleigh, Maldon, Essex. Chelmsford, Essex. Maldon, Essex. Essex. Tels Maldon 535/6 Tels Gt. Baddow 22 Tels Maldon 614 Tel. ne ou HK HK XK The following are extracts from \"Boats & Equipment\" and relate to the advantages of TERYLENE. TERYLENE SAILS because: Though more expensive, they are smoother and give higher performance than cotton. They are strong, and keep their strength when wet. No stretchin g out of shape, unless a light sail is pressed hard in heavy weather. They can thus be cut nearer to their marks, giving more sail area. They absorb less moisture so less weight is carried aloft. When wet, they remain light, flexible and easy to handle. They dry quickly and take up less room when stowed. But thay sometimes mildew if put away wet. However they are not weakened by mildew, bacteria or sunlight. TERYLENE CORDAGE becauses Stronger than manilla or hemp, it keeps strength when wet. It takes a load without excessive stretching,an advantage for sheets. It does not shrink when wet, an advantage for halyards, lanyards and outhauls. Wet or dry, it is easy to handle. Its high coefficient of friction gives it a good grip on winch barrels. It is not rotted by sunlight, mildew or sea slime. HOW DO I STRETCH NEW TERYLENE SAILS? The same general principles apply as for cotton sails. Set new Tepylene sails with care, so that the seams settle down evenly. ~ Pull the foot of your sail well out until the wrinkles disappear and do not sheet it in for the first hour or so. Haul up on your halyard and out on your clew outhaul an inch or so at a time, to keep pace with the stretching of the luff rope and the foot rope. Two or three hours sailing in a gentle breeze should get the sail near its marks. Make sure that your gooseneck fitting is not too high. The tack cringle must be in line with the foot of the sail. HOW MUCH DO TERYLENE SAILS COST? Usually about a third as much again as cotton. One well known sailmaker quotes the following prices for Terylene mainsail and fore- sail, complete with plastic battens, sail number, piston hanks and sailbag. Enterprise (Racing) £26.15s., Enterprise (Cruising) £23.10s., Heron £17.17.6d., Cadet £16.58. An extract entitled \"How to look after your Terylene Sails\" will be published in the August issue of this Bulletin."]},{"year":1958,"month":8,"no":"8","vol":2,"when":"August 1958","span":null,"contents":"Flattie, Gooseberry Pie social","note":null,"file":"MSC-NL-1958-08.pdf","imgs":["1958-08-1.jpg","1958-08-2.jpg","1958-08-3.jpg","1958-08-4.jpg"],"pages":["(we NAVIGANS\" Monthly Bulletin of the Sailing Section M.A.S.C. Editors- W.J. Hodge (Hon. Sec. ) Vol.2 Issue 8 August, 1958 SOCIAL EVENT The Maylandsea Bay Yacht Club's annual race from their Clubhouse to Heybridge was held on Sunday, July 20th., the finishing linc being our Club Barge. Those first over the finishing line included a Flying Dutchman and a 505 which arrived in a heavy rain squall and were followed by other dinghies with Ron Brittain, M.B.Y.C's popular Commodore in an Enterprise with his son John as crew. In all, nine boats arrived and tied up alongside the barge while their crews were entertained in the saloon by the Commodore and Sailing os Secretary with sandwiches and drinks. The crews did their best to dry them- _selves out before setting sail for their return journey to Maylandsea. By this time the sun was shining brightly and it was a grans sight to see the boats getting under way, the manoeuvrability of the F.D.s and the 505s being particularly worthy of note. A message from their Commodore was subsequently received, thanking our members for their hospitality and assistance. CLUB DINGHY The Club \"flattie' has now been overhauled and will be available for use at the week-end. Members are earnestly requested to take care of it and not leave it at their moorings but to return it to the beach, seeing that it is securely moored both fore and aft so that it does not settle on uneven ground or rub against other boats. The practice of borrowing other people's dinghies in the absence of their owners should be discontinued and there should indeed be no necessity for this now that our own Club flattie is restored to service. INSURANCE Members are reminded that a scheme with Lloyds exists for the insurance of their yachts, entitling them to a discount. The scheme thereby offers a very competitive figure for premiums in addition to association with a first class Company. Particulars can be obtained from the Commodore or from Mr. 0. H. Oliver, Gt. Baddow, Ext. 306. E.A.P. HK He KH OK GOOSEBERRY PIE SOCTAL The Tollesbury Sailing Club held its usual annual social on Saturday July 12th. at the Parish Hall, our Club being represented by the Commodore and Mrs. Payne. This gooseberry pie affair seems to be a revival of an ancient custom in Tollesbury of an annual event in which the wives of local fisherman vied with one another as to who could make the largest pie, this being largely dependent on the ability to procure the necessary earthenware dishes. At one stage, a competition was held in the village square while at a later date the ceremony was either banned or went out of favour. Ancient pictures in the district testify to the popularity of the event. After the pie had been cut,","2 distributed and enjoyed by all present, representatives of the neighbouring sailing clubs were entertained at the house of their popular Secretary, Mr. Farthing and his wife. PAINTING THE CLUBHOUSE A large quantity of paint has now been delivered on board and volunteers are urgently needed to assist with the decoration of the new Clubhouse premises. Now that the main work of clearing up and scraping is well advanced the painting should prove to be comparatively easy and members willing to assist should consult Fred Garrett who is in charge of this operation, or, in his absence, to watch for instructions on the Notice Board, in order to ensure co-ordination of effort. B.A.P. XX HK HR KKEKKKRK \"MANGU\" In the near future we are making a gangway to give access to the barge. The success of this operation will depend largely of the labour available. Please volunteer your help and contact any officer or Committee member. ~w S.A. a ee FOR_SALE Fleetwind No. 271, complete with all sailing gear, buoyancy bags and trailer-cum—launching trolley. Prices ~&f5 Apply: €.M.C. Branson, Garden Cottage, Idehill, Kent. Pair of Motor-car wheels with new tyres and axle, suitable for trailer. Price: 86. Apply: S.A.W. Jolliffe, Writtle. . re ee = WARNING Members are strongly advised to wear shoes, both when on the beach and in the Clubhouse, = there is a good deal of broken glass concealed in the mud and projecting nails and other sharp objects on the decks and below in the barge. H.AeP. RK H HHH KKH HK HK A considerable quantity of ballast salvaged from the new Clubhouse premises is available on sale to Club members. Those interested are invited to apply to Mr. C. Clarke, Gt. Baddow for full particulars, W.J.H. RK KH H ERK RH KK ® Details of recent sailing events will be included in the next issue of Navigans, together with an interesting article on \"pointing\" by Arthur Adam. W.J.H. KX HK HK KR A KK HK K","SAILING NEWS Blackwater & Colne Dinghy Championships Four Fleetwinds from our Club were racing - Peter Harris in \"Muggs\" won the Fleetwind Race and as a result, came home with a silver cup and barometer. Well done Peter and Michael!! In the Champion Helmsman of the Year Race, Eric Cottam's new Sprite \"Gin and It\" distinguished herself in winning. Helmsman: C, Stevens, M.BeY.Ce Maylandsea Bay Week-end. In the Challenge Cup, Peter Harris came a few seconds behind the winner on corrected time. In the Regatta, the following day, Peter came first in the Fleetwind Race and hence'came home with an extra thermos. Tony Durham was doing very well in the race until his tiller snapped just before the finish. Four Fleetwinds from our Club were racing. Forthcoming Events - Mona's Cup - an all-in race for Dinghies, Cruisers - to start from Heybridge at 5.30 on Sept. 7th. Team Race - against Maylandsea Bay Y.C. Will all Fleetwind owners please make every effort to race on Saturday 13th. Sept. at 11 a.m. and 1 p.m. Open Day - Saturday 20th. September ~ All are cordially invited. Would boat owners please try to take visitors for a sail. W.D.R. RRR ER HH HER AROUND THE YARDS IN SUMMER bys W.D. Roberts At the Woodstock yard of Messrs. Wardell and Son, \"White Rose\" is being fitted out and should be ready for the water next season. Employees of Messrs. Brewster and Mayo are now on the dole, having completed their last order \"Lollipop\" in three weeks. Ron Tyler Ltd. have just launched \"Winkle\" Enterprise No. 1527. There seems to be some coicidence between Job No. 1527 at Messrs. Marconi's Wireless Telegraph Company and \"Winkle\"!! Y.W. Solo No. 66 has just been started at the Army and Navy Yard of Roberts & Co. She should be ready for next season and hence will probably be the first Solo to sail on the Blackwater, Work has been proceeding apace on the yachts at Messrs. Adam and Danes - three of them may be sailing by next season!! Our Vice-Commodore's smack \"Karolin\" has just been fitted out and is now moored in Heybridge Basin. Messrs. Phil Goulden and Bods have just completed a new G.P.14 \"Norwin\" No. 1829 - she now lies at Heybridge (in the mud!!). N.B. This magazine could provide the means of contact for people interested in sharing boat-building. The Editor would be pleased to publish letters to this end. W.D.R. X HEX HHEHHH HHH PERSONAL In respect of our Clubhouse, Fred Garrett has undertaken the job of Ship's \"Husband\", One of the Founder-Membcrs of the Section, his time has been rather restricted in the past but he is now able to devote more time to the Section activities. It will be appreciated that, in undertaking this task, he will seck the co-operation of all members in maintaining the tidyness and cleanliness of \"Mamgu\". As she is a wooden vessel, particular stress is placed on fire-risk. At the moment, painting is in progress and it is hoped ta make a presentable appearance on our Open Day. Plans are in hand, and =a work should start shortly on a permanent access gangway. i. e"]},{"year":1958,"month":9,"no":"9","vol":2,"when":"September 1958","span":null,"contents":"Mona's Cup first mention, looking after Terylene sails, 'How High Will She Point' log, A. Adam","note":null,"file":"MSC-NL-1958-09.pdf","imgs":["1958-09-1.jpg","1958-09-2.jpg"],"pages":["C7 ~ 'NAVIGANsS\" _ Yd Monthly Bulletin of the Sailing Section, M.A.8.0.-*\"* Editors- W.J. Hodge (Hon. Sec.) Vol.2 Issue 9 September 1958 COMMITTEE NOTES Arrangements are now in hand for the Laying-up Supper, which will be held on Friday 3lst. October 1958. The success attending last year's function has prompted your Committee to consider an evening along identical lines. Last year however, the Supper was organised at a substantial loss to the Section and in order that we may this year make minimum demands upon the M.A.S.C. resources, we feel that a slight increase in the price of tickets would not prejudice the patronage of Section members in making the function a record success. Nothing apa:t from the date has been fixed so far, but future issues of this bulletin will publish full details as they become available. t+eteeet There are still many members who have not paid their annual subscriptions in spite of the frequent reminders which have appeared in this bulletin. Once again, the Treasurer urges these members to fulfil this obligation without further delay or, in the case of resignation from the Club, to inform the Secretary of such intention. i i i i i i i SAILING NOTES RACING RESULTS In the Blackwater S.C. Regatta, Phil Goulden, racing his G.P.14 \"Norwin\" for the first time, got 3rd. prize, a set of screwdrivers. In the Club's Fleetwind races, Peter Harris is now in the lead with 166 points. Tony Durham is second with 156. There are three more races yet to complete the season's series. FORTHCOMING EVENTS 7th. September eee Mona's Cup — 5.30 p.m. 13th. September Soe Team races v M.B.Y.C. ~ 11 a.m. 20th. September 5 sys Open Day i i i i i i i a a XVII OLYMPIAD - ROME A brochure, issued by \"World Sport and Travel Service\" has been received by the Secretary and may be seen by any member upon application. The pamphlet offers the services of Lairdways Ltd. in the matter of organising tours during the Olympiad Events of 1960. *¥ Re ReN KH KR HK KX KH HOW TO LOOK AFTER TERYLENE SAILS Terylene sails may be given a normal washing and a soap or soda solution may be used. With standard laundering techniques, it is suggested that the washing liquor be warm but not boiling in order to avoid permanent creasing of the fabric. For more persistent stains, a light scrubbing with the above is recommended. If necessary, the sails should be soaked in a cold 10 per cent solution of sodium metasilicate overnight and then washed in the normal manner.","a 2 Oil stains can be removed by spotting with solvents or with a synthetic detergent. These treatments should not be employed with coloured sails. Only experienced finishers should clean coloured sails when they become oil stained. Wherever possible, Terylene should be stored in a clean dry condition. Although damp conditions will not affect the strength of Terylene sailcloth, they may encourage the growth of mildew. HH HH HH He Fe ee HOW HIGH WILL SHE POINT? bys A.M. Adam Sailing to windward is the subject of more \"theories\" than any other point of sailing; probably because it is obviously possible to sail downwind, so ngbody bothers to ask exactly how it is done. Serious scientists can work it out properly by vectors - confirmed non-scientists can read \"The (ornage-) pip theory\" in a yachting journal. Qld sailors don't bother how; just do it better than anyone else. I do not intend to offer any theories on how it is done, only to make suggestions on how it is done fastest. How high should you point? If you point high, the boat loses speed. This begins to happen well before the sails flap or even tremble. But if you point low, your speed has little windward component. If you sail at 90 to the true wind, you will never get to windward at all unless the tide happens to help you. If you are only watching the burgee you may not realise how far off the wind you are because it is recording relative wind, which will be further ahead than the true wind. In very fast boats it is as well to keep one eye on the waves and try to judge the bearing of the true wind from them. If you sail at speed V at an angle © to the true wind, your speed component to windward is V cos @. The best course to windward is a balance between keeping a good value of V and a good value of cos 9, as one is rising while the other falls. It would be easy - tosveasy - if V wae¢d@ stable function of G3 but it isn't!! It varies, evén on one boat, with conditions; so that the best angle 9 also varies. In light weather the speed of the boat can be a high percentage of the wind speed - it takes very little power to drive a boat at 2 knots. A well- sailed boat may be considered as making nearly half its own wind by its ow speed (it's the relative wind that blows into the sails!). But this is a deli- cate process: if the boat slows down, the relative wind decreases, the driving force drops and she sloww down still more. Besides, the high relative speed of the boat means that the relative wind is drawn further ahead than in other conditions. So in light weather it pays to sail a little on the full side. In moderate winds, but still on smooth water, she will sail efficient-~ ly rather closer to the wind. Her relative speed is not quite so high, so the relative wind is not so close at a given value of 6, and the advantage of sail- ing fast to “make your own wind\" is less. “In heavier weather things may get worse. The hull resistance goes up becsuse it has to smash through the waves. Very likely the sails have to be reefed, but you can't reef the windage of the mast and shrouds. It pays to sail a little freer agains; maybe even to ease the shcets a little. The main secret of sailing fast to windward is to know your boat and to do the right thing by \"feel\" rather than by logic. Like all \"compromise\" curves, the one relating windward component.ef speed to the angle off the wind has a moderately flat top, and five degrees more or less makes so little difference that it probably doesn't lose any races. What does win them is a general knowledbe of what to do, sufficiently accuratedyto do it at once within five degrees or so. Even this is too complicated to do theoretically; which explains why the old sailors sail to windward better than the theorists. TIE IE IG IE HEE WF EEE)"]},{"year":1958,"month":10,"no":"10","vol":2,"when":"October 1958","span":null,"contents":"Mamgu, sea wall defences, folders for Navigans, open day, racing results, committee nominations","note":null,"file":"MSC-NL-1958-10.pdf","imgs":["1958-10-1.jpg","1958-10-2.jpg","1958-10-3.jpg","1958-10-4.jpg"],"pages":["\"NT AVIGAWNS\" Monthly Bulletin of the Sailing Section, M.A.S.C. Editors- W.J. Hodge (Hon. Sec. ) Vol.2 Issue 10 October 1958 COMMITTEE NOTES Several members have apparently complained to Committee members that bills covering Section dues are not issued by the Treasurer and that in conse- quence those members are totally unaware of such debts. Arrangements are now in hand for statements of account to be sent out to all unpaid members in the near future. W.J.E XeKE LAYING-UP DINNER All arrangements for the Laying-up Dinner and Dance have now been settled. The date, Friday October 31st. has already been published. Last year's very successful pattern has been adopted and the whole evening has been designed to interest both sailing and non-sailing types. Tickets at 10/6d. single or £1 double can be obtained from any member of the Committee, a list of which appears in another place in this bulletin. The value is excellent, the food is good and the company is of the best!! Wed He XX EH HK X ANNUAL GENERAL MEETING The Annual General Meeting for the year 1957/8 will be held at 7.30 p.m. in the Palm Court of the Marconi luncheon Club on Thursday 20th. November 1958. The agenda will follow the usual pattern and nominations for election to office are invited. A form for this purpose appears at the end of this bulletin. To assist you in the matter of choice, a list of the present officers and Committee is published in this bulletin and you will notice that all are willing to accept re-election. Commodore Mr. E.A. Payne — Baddow Committee Vice-Commodore Mr. T.W. Hallam - Baddow Mr, E.H. Cottam Baddow Rear-Commodore Mr. M.J. Greatrex - Baddow Mr. C. Clarke Baddow Secretary and Mr. G. Wardell Baddow Treasurer Mr. W.Jd. Hodge - New Street Mr. A. Cushing Baddow Sailing Secretary Mr. W.D. Roberts - Baddow Mr, F, Garrett Baddow Social Secretary Mr. A.M. Adam - Baddow lir. S. Adamson New St. Mr, F. Collins New St. XXX KERR JH. We W H “MAMGU\" Members are reminded that the lock from the old clubhouse premises has now been put into use on \"Mamgu' so that keys already in possession of members will admit to the new premises. The attention of ell members using \"Mamgu\" is directed he Club. E.A.P. xX XH HH ® OPEN DAY - Saturday 20th. Sept. On a pleasant Saturday in September, it was noticed that rather more elegantly dressed figures than usual were on the sea wall at Heybridge, looking disdainfully towards the rather unkempt-looking barge \"Mamgu\" lying off-shore in the mud. As they were ferried aboard, they quickly realised “» that only the outside was neglected (and we can blame Maldon Council regul- ations for that), and that the Marconi Sailing Club really exists as a live, active organisation. \"Avril\" was fully loaded for several \"trips around the bay\" and those wanting more excitement could crew in two Fleetwinds: during which one of our newer members was seen to be smoking a pipe with an aplomb unequalled since Dick Pavitt capsized a catamaran and surfaced still puffing away!! But it was another guest who was capsized and rescued by dinghy to keep his feet dry. An almost new Sprite was available on the \"drive+yourself\" principle ~- we think the owner wanted to collect the insurance money and buy himself a new one next year, but he was out of luck; she was returned undamaged. We were glad to see the Chairman of the M.A.S.C. Finanae Committee enjoying himself - a gocd sign for friendly relations in the future. And down below, two ladies were busily serving tea to the thirsty before the friendly warmth of the saloon stove. A success, definitely; but we must get the ladies to bring their parasols next time. A.M.A. LAYING-UP SUPPER We are doong our best to make this even better than last year, but costs are high and we need your full support. ‘We have tickets available ONE WHOLE PAY-PERIOD IN ADVANCE and if you will state your requirements early we shall know better how far we can \"haul the boat up\" !! A.lM.A. XR KKH RRR","SATLING NEWS - W.D.R. RACING RESULTS Team Races v Maylandsea Bay Y.C. The weather was grand but oh! the results were disappointing - MB.Y.C, 56 to M.S.C.'s 41 points, However, the cecasiion was much enjoyed by all VIGANsS\" GL, cones Monthly Bulletin of the Sailing Section, M.A.S,.C. : Editor:- W.J. Hodge 5\" (Hon. Sec. ) Vol.2 Issue 12 December, 1958 ANNUAL GENERAL MEETING Thirty members attended the Annual General Meeting held in the Palm Court of the Canteen on Thursday 20th. November. They heard reports from the retiring Commodore, Secretary and Sailing Secretary. For the benefit of those members who were nnable to be present at the meeting, these reports are published in this issue of the Bulletin. The election of officers for the year 1958/9 resulted in the follow- ’ ing Committee:- : Commodore EeA. Payne Baddow Vice~Commodore E.H. Cottam Baddow Rear-Commodore T.W. Hallam Baddow Secretary and Treasurer WJ. Hodge New Street Assistant to the Secretary PR. Berkeley New Street Sailing Secretary W.oD. Roberts Baddow Social Secretary Ge Mayo Marconi College ( BF. Garrett Baddow ( Fo Collins New Street om eee | MJ. Greatrex ( AM, Adam A. Durham New Street Baddow Baddow S. Adamson New Street 2 The outstanding event of the season has undoubtedly been the acquis- ition of our floating clubhouse and it should be a source of gratification to us all to recall that the M.A.S.C. had sufficient confidence in the progress and stability of our Section to make this purchase on our behalf without question or reservation. Possession of the barge however, has entailed a great deal of hard work on the part of members and considerable credit is due to those who gave so freely of their time and energy to the job, particularly to the heavy initial tasks of lifting out the ballast and digging the new moorings. Our tenancy of the old Club shed premises was terminated at the end of May and the evacuation and cleaning up were commendably completed on time, the shed being restored to its original condition and all articles of value transferred to the barge. The re~arranging, cleaning and painting of \"Mamgu\" have proceeded steadily during the season and the new premises have already provided facilities as a clubhouse and we were able to entertain members of the M.L.S.C. on board after the team race as early as May 4th! Later on, members of the M.B.Y.C. were twice entertained and an Opeh Day was held on September 20th. which was well patronised and enjoyed by all, Lack of a proper access gangway during the season proved a great embarrassment and although Mr. Stebbens has now been requested to make one semi- professionally, it would have been much better of this decision had been taken earlier, During last Winter, a series of lectures was held and well attended","by members and their friends, Classes on seamanship and splicing were held at fortnightly intervals and proved very instructive and enjoyable and the Club is indebted to those members who were responsible. The Sailing programme was very ably planned and the events carried out strictly in accordance therewith. Our Fleetwinds performed creditably in events with other Clubs, particularly in the Blackwater and Colne Dinghy Championship, the Stone Challenge Cup and the M.3B.Y.C. races, but I would be trespassing on the province of our Sailing Secretary if I attempted to give details. Although my own cruiser did not achieve any very brilliant successes this season, it was not for the want of trying, for I entered for most of the cruiser events and at least have shown the flag, During my Summer cruise, I visited several Clubs on the Colne and Blackwater and received great hospitality. At Heybridge, some of our members: have very generously taken as crew, those who do not own boats, thus pro- viding valuable instruction and encouraging them to become owners and furthering the interests of the Club generally. The number of new members enrolled was a record but unfortunately the payment of subscriptions for current and previous years remains insoluble as a problem, The advisability of reducing the amount of the subscription might well be considered. The issue of our Club News-sheet, \"Navigans\" by our Secretary is very greatly appreciated andwe are indebted to him for his efforts in producing this publication, in addition to his arduous duties as Treasurer. The Club boat \"Avril\" has been fairly well booked throughout the season but unfortunately, we were confronted with rather a large bill from Mrs. Hiscock. This expense however was, we hope, due to unusual and non-recurring items, and it should not be forgotten that the boat was stored in the Clubhouse last Winter and the painting and fitting out done by members, otherwise the bill in previous years would have been higher. The number of larger yachts at moorings in the vicinity of the Club is now considerable andpresents quite an imposing fleet to which a catamaran has recently been added, Yachts constructed by members this season include an Enterprise, two G.P.-lh4s, two five-ton cruisers anda Y.W. Solo, It should not be forgotten that most of our Fleetwinds were constructed by members and that our starting guns were also made by meinbers. : The new Sailing Rules introduced during the Season proved controversial and a considerable amount of time was spent in discussing them without coming to any final conclusion, It is possible that some amendments will have to be made, As storage space on the barge is no longer adequate, arrangements are now in hand for a dinghy park on the shore, end as the Yone=shore is-harder in front of the proposed site, it is hoped that eventually it will be possible for members to carry dinghies to the water's edge for sailing at any state of the tide wy eat one relations with otherC libs continue to be cordial and their SocialWe except perhaps, at low-water springs. functions have been attended by my wife and myself as your representatives. have found all these functions most enjoyable. Our second forral Laying-up Dinner was held on October 31st, and proved to be a great success, the attendance being more than double that of last year and our fine commodious accommodation being greatly admired by all guests. In conclusion, I would like to thank the officers, Committee and all. Club members for their support and help during the past very difficult year. tt bte ete tttst SECRETARY'S REPORT Since the last Annual General Meeting, your Club has made vast strides towards becoming a useful section of the M,A,S.C, and also one of the more popular Sailing Clubs in the Blackwater area. — . The Committee has worked very hard indeed to secure the mximum facilities available and to give members the best possible value for their money. 4 The purchase and fitting out of \"Mamgu\" as clubhouse premises was a major contributiom and repre- sents many hours of leisure freely given by the Committee and a few other members — time freely given but nevertheless a sacrifice, The Commodore will no doubt, have more detailed comment on this matter when the time comes for him to make his report ~ my aim here is merely to stress to all members the importanee on maintaining every confidence in the ehkected Committee and in supporting their every effort to the","‘fullest possible extent. By and large, the response of members to Club activities was good and the Club boat \"A vril\" was fully booked throughout the season, If only the financial response were half as good, we would indeed be in clover, but I'm sad to say that, following upon the initial year of membership, subscriptions invariably fall off, so that our annual funds are restricted to the proceeds of new recruitment. In this connection, I do strongly feel that in cases where the non-payment of Section dues arises out of resignation from thé Club, those mebers should obey the custom- ary courtesy of notifying the Secretary or some other officer of this intention, for only by the fullest co-operation from all members are we able to acquaint our- selves of the true state of membership, Thirty new members have joined us over the past twelve months, On the other hand, some members have resigned for varying reasons. In an effort to combat this, your Committee has decided to adopt all possible means of attractine outside intexest and the new Committee should find the solution an easy matter, There is a feeling among members that the season's sailing activities have indicated the desizability of a crew training pool, as advocatcd by Mr. S, Adamson in his remarks on recruitment at a Committee meeting early in the year, The social functiors were yell patronised and the now established pattern for the Annual Iaying-Up Supper appears to command general support. I would recommend to all members the Winter Meetings which are arranged at the expense of considerable trouble and leisure by the Social Secretary and which are designed for their material value both to accomplished and inexperienced sailors. The fee benefited during the year from gifts from varicus members and associates. ss Clarke of the \"Jolly Sailor\" donated a trophy for amnval al, compet— ition and —eTne. the wife of our Vice-Commodore for the year 1957/8 gave a Cup for Ladies! Racing, Commander Rantzen gave us the min mast now reised in replace- ment of the original one on \"Mamgu\" and Mr, J. Garland presented the Club with megaphones and other useful ecuipment, Our thanks go out to these good people for the kindness and interest sh in such a practical manner, The Club News-Sheet \"Naviigans\" could be of far more use than exists at present if onl: members would contribute tio its contents, The Committee does its best each month, but how very much better it would be if all members took an active part!!! Items of sailing interest and. experience, aneddotes etc, would always be most welcome to the editor in his aim to keep the Section fully informed of all activities, so I exhort you all to help him all you can, I must amounce that ofter two years of office, I feel the need for a rest from the combined duties of Editor, Secretary and Trcasurer, and I have intimated that I can only accept re-election for the coming year with the appointment of an assistant. Mr. Berkeley has agreed, subject to ratification by the Club, to act in this capacity as and when required and I take this opportunity of thanking him eincerely for his kind offer, My thanks go out also to the present and past omnodores under whom I have served and in particular to Mr. Payne who has survived a@ singularly strenuous and difficult year of office and who has endured patiently the fluctuating temper of an exacting and rather turbulent Secretary. I'm quite sure that on reflection he must, as I do, have some wry thoughts on the true inteant- ions of his nominator and seconder when electing him to office, for ostensibly, his nomination was intended as an honour marking his many years of active service to the Club! I make special mention too of your very able Social Secretary, Mr, Adam, without whose very considerable assistance, my own job would have been untenable, Finally, I wish to thank the members of the Committees on which I have been privileged to serve. I have enjoyed the full support of everyone and I shall be quite willing to accept office for the Blackwater and Colne Championship Year 196041, which I understand is to be sponsored by the Marconi Sailing Club, and when the services of an experienced Secretary-cum-Treasurer-cum-Editor may be desizable, cS SAILING SECRETARY'S REPORT Racing this year has been disappointing, with on the average, only 3 boats per race in the Fleetwind Series, and all four team races lost!! . The all-in races however, have been fairly popular with eight boats per race. In consequence, I propose that next year, we have twelve all-in dinghy races, using Portsmouth Harbour handicaps and a single-handed race once per month, Meany of the years' races have not been conducted in a propoer manner, due partly to Officers of the Day not knowing their duties and partly to members not","dy z ~ knowing R.Y.A. Rules, All the Clubs on the River have agreed to enforce R,Y.A.* Rules in Club races, with the hope that when members sail in open races, they will be familiar with B.Y,A, Rules. Regarding Officers of the Day, I propose that we should make a rule that every member of the Club must be an Officer of the Day at least once per year, if required, ; _I hope that before next season starts we will have (i) a starting line formed by the Main and Mizzen msts of \"Mamgu\", (ii) a dinghy park with launching ramps to enable launching at almost any state of the tide and (iii) a gongway on to \" Mamgu\", There are other refinements which would make life more pleasant such as fresh water in \"Mamgu's\" tank, electricity for cups of tea and lighting, and \"Mamgu\" tidied up. With the above improvements, let us hope that next year will be a more successful one that 1958, ee PERSONAL The Committee this year is poorer by the retirement of Cliff Clark and Geoff Wardell, both of whom feel that other more important and domestic responsibilities should command their leisure hous. \"Clark and Wardell Limited\" has been a long established firm, ever ready to provide a rcliable source of assistance and valuable information whenever required, The Club owes much to these gentlemen and will feel keenly the ioss of their support on the Committee. Perhaps, following 2 year's respite, we shall find the old firm resuscitated and the keen interest of past years revived. WeJoHe XMAS 1958 At this time of the year, the Commodore wishes to extend to all members his cordial greetings and unofficially gives the order \"Splice the Mainbrace\" WINTER MEETINGS The first Meeting of the Season will be at the Marconi College on Thursday, December 4th. commencing at 7.30 peme, when Mr. Roland Prout will lecture on \"Catamarans\". Please make every endeavour to make this meeting worth while by your attendance. we OU MOR Me tk ok ae"]},{"year":1959,"month":1,"no":"1","vol":3,"when":"January 1959","span":null,"contents":"MASC football pool, winter meetings, Dabchicks","note":null,"file":"MSC-NL-1959-01.pdf","imgs" letin and, as ) a Club, we are unique in having a monthly publication, ) It would be a sad thing indeed if we were forced to abandon this service to our members but without your full support this is inevitable, Unlike the response to the Football Fool, you are all very much aware of the existence of the Bulletin and since it does so much to further the interests of the Club, a matter dear to our hearts, I hope, there should be little trouble in finding potential authors, Most of you are capable of describing in the merest detail, situations which you have found either amusing or instructive, or both, and that is all #2 ask - the Editor will do the rest and credit the person initially responsible with the authorship. “Wed. EME OMe SAILING NOTES The 1959 Sailing Programme is now ready and will be issued to those members who have paid their subscriptions for the current year. W.D.Ro ) Sess Meo Se sk Se Se sh ck Shoe se sk sh ok oe te ok oe ose oe se ) WANTED 55 yards of fencing, /5ft. high ) 20 stakes, 6ft. high for the proposed new Dinghy Park. 2 gates, 6ft. x 4/5ft. E Anyone who has any bright ideas regarding possible purchase should contact the Sailing Secretary, Mr. WeD. Roberts, in the High Voltage Laboratory, Baddow. \"VAMGU\"* There could be a far better response to our appeal for voluntcers for work on \"Mamgu\" on the prescribed working days. The next will be Sunday, lst. March. So much remains to be done if we are going to have our Fitting-out Supper on board and any assistance will be welcomed, The plumbing is almost complete and the decoration of the Main Salon has been completed, i : Anyone with furnishings to spare, please contact Mr. F. Garrett, the Ship's Husband, who will be very grateful for any offers. Progress on the access gangway has been delayed by inclement weather conditions, but we hope for completion in the very near future. FeGe","2 LECTURE BY AUSTIN FARRAR An invitation to our Club members and their friends has been received from the Maldon Little Ship Club to attend a lecture by Austin Farrar on the new Racing Rules, to be given at the Club-house of the M.L.S.Ce on the Quay at Maldon on Saturday February 28th. commencing at 7.30 pem Transport arrangements will be available as follows:- Danbury and district +. eve Mr. HoA. Payne (Commodore) Great Baddow and district ese Mr. EeHe Cottam (Vice-Commodore) Chelmsford and district cee Mrs T.W. Hallam (Rear-Commodore) and Mr. WD. Roberts (Sailing Secretary) Members: wishing to avail themselves of these facilities should notify the particular driver in their district in good time before the date of the meetings It is hoped that as many members as possible will endeavour to attend what promises to be a very interesting evening. EoAePe NATIONAL BOAT SHOW - 1959 Once again, Olympia hears the cry of the gulls (recorded!), the time is given every half-hour by a ship's bell (amplified!) and at irregular inter- vals, all eardrums are damaged by a demonstxxtion blast from a foghorn (output certified to be in excess of 100 decibels!). The only reason that the National Boat Show is not\"bigger than ever\" is because it can't get any bigger without re-building Olympia! One or two well known firms «+. Camper and Nicholson, Hillyard ... are missing, but there is no more doubt that new names will appear than that Camper & Nicholson and Hillyard are still doing very brisk business in their own quieter way. Following the success of the Prout \"Shearwater\", a \"cat\" craze has swept the industry, There must be at least a dozen sailing catamarans, one or two trimarans, motor catamarans and a catamaran houseboat; but I do not see the mantle of t e \"Shearwater\" falling on any of them, unless it be the 14ft. Prout \"Swift\". No large or cruising \"cats\" were on view, though one or two are said to be building. I should like to see more of these ... a fast cruiser with a range of 200 miles in a week-end might have a more lasting attraction than a round-the-buoys racer whose main virtue is to get the crew wetter, quicker even than a Flectwind!! May IT recommend the Dell Buoy mooring buoy? It is invitingly barrel=shaped =~ a red one on the stand was fitted witha tap, and contained a famous liqmid supplied by Watney & Co. Truly, an snd0URséEment to return to moorings! ! AMA. Mahe Tstel ake, Se he Sec gte cats ate Sater eke ate BALANCE SHEET 1958 The Balance Sheet for the year just complete is attached to this Bulletins You will observe that there was an appalling slackness in the payment of subscriptions - we have a potential membership of 110!! You will also see that without the support given by the M,AeS.C., it would have been quite impossible to finance the Club throughout the year. Once again, I remind you, first, that payment of subscriptions is a duty incumbent upon us all and secondly, your support to the Marconi Football Pool will ensure better facilities and more comfortable surroundings in the Club premises. Wed ole","« e ° F 2 ° ooo e ° ° oovo0vo © oOo ee ° e wane ° ° e ° ° ° ee > oe ce © a 2 ° ° ° oe © 2 3 own OVOOUNNOONNODODDOVOVDOVUDODNVVONNHNNAND Q ° @ ° ° @ o e e ° © 6 e ° 8 ° 2 ° G 9° © ° s ¢ Mn ag q ° o AUNNANNNNRNANHNNHNANNHNATIaAaH adm iva) ° e co Bs See eaeaSeaeaS s sists st si 6 o 3ry Sssisisisis 2 e % 3 ° ®°° = st $ a st by = =) = spoukey3ASTIT“qe 8°r*meO09)y°S“N09GELE|fS3nueiTa.Su0ou%ToaZSyTToosAdIgIdeUosxAi®d®LUdTegrzHHTnAosUseoqgLugyO((yyYseAAeetsTeLLyyqeJ—dgoBquuYtxnLsognUuoSeg0WWztsyosC}yuneeemun-sASogETgss3wGRquuTLe,su°°ejynnTyTyLpfpapyxqe~-doBuETidpq{°o))ntluU,eMMxo4ngmbTrotOequTsAO»SSo,WyTesdqs£U,IquusorsQu4uTatqty0oo—-e0oTps,SWgyney~9gNeYqryAuT—ggzsSertyrsqto3uuW3g7JsegdAoTpproTduMszeT*xdsrYEqseeyeoauyuqoOTpestequeosazeLysluocri0zt°rSaeoeetnTryTooR)9sygH,YTgy561T*tL~eAyOeLHdHWHSZONVIV\"DEpkequ(easy(dzoqyegarodzepr-eendcg*spn“yv9gqp/o9n9[d/yosn~3©-gS0©ou]0tS9e4))~sy9eTsqswooWiwghsodtir4iny¥ngngsguuqOoodttrp2oeo4oeTegsHy °°°209h)°““OTOLLS/ouTsPeteaAssyqoiwn,rAgueQe0idy9sTgaogoOuPoserA-5aL—IqtnpYNragesOnTtod9sai nwhile, independent permanent moorings by members must cease until individual moorings have been allocated. The response to our appeal for support of the working day on March was excellent and a considerable amount of decoration and other necessary work was completed. The next working day will be Sunday April 5th. when we hope that even more supporters will offer their services. Hoe ak a aR ae ae tk i few words to those contemplating acquiring their first yacht = Anon. Obviously, the type of boat will depend on the type of sailing one intends to do and the depth of one's pocket. The cheapest and most satisfying way of getting a good boat is to build it, either from a kit or from basic raw materials, but a surprising amount of time, space and patience are required, If any of these three is lacking, it will be much better to buy a boat, either new or second=hand, - Occasionally, a plywood racing dinghy comes on the second-hand market in good condition and at a reasonable price, but for those of limited means, a more solidly built type of boat will hold its value much pettere These days, the novice is confronted with a bewildering selection of designs, but many are barely worth considering. For the man who intends to trail a racing dinghy on holidays etc, the best buy to-day is the \"News Chronicle\" Enterprise which more and more clubs are adopting, with the G.P.1i. and Heron as second and third choice. . The man who intends to race at his home club will naturally choose the \"one-design\" sponsored by his club, but be sure that it is a well-established design and not a \"one=season wonder\". The mam who intends to take the family out for a picnic in addition to racing would be well advised to buy a slightly larger clinker built boat, such as the Sprite or Maylandsea Bay 0.D. as these boats are more capable of standing up to the abuse of family parties than the lighter plywood hulls. Also, as mentioned earlier, these boats are a better buy on the second-hand market and not only will they hold their value well, but even the oldest boat in a class can still be well up with the leaders at the end of a hard race. These boats are also a good investment for the man who is not interested in one design racing, but wishes to potter and enter the odd handicap race, If he also wishes to do odd wekkeend cruising and is prepared to sleep somewhat rough, he has a very good selection to choose from, Many of the i4ft. 0.D.'s can be used for short cruises and the various East Coast 18ft. one designs, such as the Brightlingsea are excellent for this type of sailing. Dinghies over i14ft. are at a prohibitive price new, but are casily obtained for a very reasonable price second-hand and they hold their value better than any other type of crafte (Continued on Page 2) Please complete, detach and return to:- Mr. G. Mayo, Marconi College. Please send secececeoe tickets for the Fitting-out Supper at 4/~ each, for which I enclose cheque/Pe0./Cash sscosece I vrequire/can provide seseee Seasts by car FLOM seccccccccccnccccsccesccceses NEMEC ccoccccccccsccecescocreccecceee Sede cccvcvcccvenecccccvevescccessevecce .","2 For the man of limited means who wants an owt and out cruiser, the \"Silhuoette\" and \"Ballerina\" are easily the best buys. They can be built at home or the hull only can be purchased and they are souns sea-worthy boats with a good second-hand market. Unfortunately, there are several very bad designs of small cruisers, with hulls that are barely seaworthy and badly laid-out accommodations On one design, there is no clear space even 6ft. long in which to sleep and another design offers stupidly narrow buoyancy chamber tops for bunks, and has no galley space at alle With a cruiser, one must decide whether to have a fin keel, centreboard, leeboards or twin bilge keels. All have their merits with w which I hope to be able to deal later. I hope I have said enough here to show that there is much more to be considered when buying a small cruiser than when buying a dinghys Finally Catse These are very fast (on certain points of sailing) and expensive. This Winter there seem to be more Shearwaters on the second-hand market than any other 0.D. and they are all fairly cheap, Even a one-season old boat managed to lose a quarter of its initial value, They do not scem a very good buye Whatever type of boat you decide to buy, don't hesitate to ask a more experienced sailor for advice, BUT make sure he does the type of sailing in which you are interested. Many cruiser sailors know a little about dinghies and few z dinghy sailors know a little about cruisers, but the man qualified to give advice ~ on any type of sailing is a great rarity. Mee Me ok oe ae ok ok ook ok ok SOCIAL About thirty members attended the film show in January when Messrs. R.C. Coates, WeE. Lenderyou and RoE. Ashdown showed some excellent films in colour of local sailing taken last season. The recent talk by Rolland Prout, designer of the Shearwater Catamaran was also well attended, Commencing with films, he then gave an introductory talk describing how his interest in Catamarans was aroused some years ago, after being overhauled in a destroyer by a Polynesian outrigger} Discussion of questions posed by members then followed and the meeting was formally closed by thanking Mr. Prout for a most interesting lecture, : The next meeting, to be held on March 19th. was to have been a lecture by Alan Buchanan, Unfortunately, Mr. Buchanam is now unable to attend, but it is hoped to arrange an alternative programme on this evening, details of which will be posted soOne We are very pleased to announce that on April 2nd, Vice Admiral Sir J oh” Eaton, KBE, CB, DSO, DSC, RN. (Rta) who has recently joined the Company has very kindly agreed to speak about his Naval career. In anticifiation of a most interesting evening, members are encouraged to make this a real social occasion by bringing wives and friends alonge ‘ FITTING-OUT SUPPER The Fitting-out Supper will
