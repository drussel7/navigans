the winter, To undertake the overhaul and refurbishing of a vessel of this size by amateur effort is a task of some magnitude, and thanks are due to those who have helped, not forgetting the ladies who have looked after our welfare, : Much still remains to be done, particularly in the stowage of members gear, and this is receiving attention. In respect of the electric supply, attention is again drawn to the fact that no unauthorized connection must be made to the supply, ‘he supply cable to the gangway must be disconnected and the cover replaced over the outlet socket at the end of the day, As this is not a switched socket, the member responsible for disconnection must switch ‘off! at the main distribution board in the galley before disconnecting. The practice of disconnecting with the light still switched 'on' in the ship for convenience is to be deprecated, this results in the burning of the plug pins, and in the event of possible leaks due to storms could cause a flash before the fuses had tine to operate. Sailing. Race entry forms have been instituted by the by the Sailing Secretary and members are asked to co-operate in signing up before entering a race, This assists the Officer of the day, and facilitates end of the season analysis, Members requiring moorings on the river should approach Mr.Stebbins, The Bailiff, who will arrange to lay, or indicate where such a mooring should be laid, A plan is being made of all club moorings. Organised picrics on Osea island are not advisable on cruisers, and alternatives will be detailed by the Sailing Secretary. ilembers are reminded of two points in connection with the Dinghy Park facilities, on which we have an obligation. ae The floodboards must be replaced at the end of the days sailing. Ze Other than when it may be awkward to manhandle a dinghy on its trailer to the 'park', initially cars must not be brought across the path from the road, We have no right of access as such other than the footpath. Social. Do not forget the Club Dance at the Odeon on the 22nd april. Your support for this venture is earnestly reyuested , never mind wether you can dance, few of us would aspire to be in the championship class. Come and enjoy yourself, Tickets 5/- from any committee member, or at the door, Gont'd Page 2.","News and Views. A further presentation of \"Finding your way by the stars\", (as reported in Februarys' issue) will be given at The London Planetarium, Marylebone Road, N.W.1. on Thursday April 28th at 8.00 pom. Tickets 4/=. This lecture gives simple rule of thumb methods of star spotting and direction finding, and is of special interest to yachtsman. \"Hornets\" have now been Yeorganised as a National Class by the R.Y.A. and the Sailing Secretary will arrange to display details on the notice board, More on this interesting vessel next month, Sale and Mart. Surplus Nylon Rope. 1 inch circuuference braided nylon rope. Very soft braid, comfortable to hold and runs freely over blocks, Clean and little worn, can be spliced if you are keen enough to tuck eight strands, Price 1. Ad per. fathom. Also 1 inch circ, three strand nylon rope, with anti-chafe covering (removable) of black monofilament nylon braid, This rope is new. A good rot-proof. anchor warp or buoy rope, light enough for a dinghy yet strong ©enough for a cruiser kedge warp. 1s.lld per. fathom. . Anyone interested in good quality surplus rope ( including wire rope), should contact Mr,Adam, Room 101, Baddow, who keeps a suppliers list, but has W” a stock of the two items detailed above,","ON LEARNING TO SAIL. BY \"BARNACLE\" There may be some new members who have joined the Club this season, hoping to learn to sail. ; Learning to sail is not easy. Like riding a bicycle, swimming or walking , it cannot really be taught, but can be learnt only by experience, efter the first few basic principles have been mastered. I do not like naming specific books for people to read, but for once I am going to make an exception and recommend all who wish to learn to sail to buy, read and learn Peter Heaton's book \"Sailing\". Having read the book, a perso of reasonable intelligence should be able to handle a docile type of boat on a reasonable day, with a competent person aboard to sort out any mistakes before anything serious happens. The finest place to take the first few voyages is the Norfolk Broads. You will probably do some very stupid things, that on a tidal estuary would have serious consequences, without coming to any real harm, and at the end of a week you should have a fair idea of how to handle a boat. If you cannot manage a holiday on the Broads, the next best thing is to find a boat owner who will take you out once or twice, letting you do as much as possible of the handling of the boat. It is not reasonable to expect the owner to let you take the boat away from or pick up a mooring surrounded by other boats, but you can take a couple of empty cans and sinker down to the Doubles and practise picking up moorings to your hearts content. Once you can get a boat on and off its mooring, can sail it on a run without gybing every five minutes, and have a reasonable idea of when a reef is needed, get out on your own, or with another learner, then you will have to make your own decisions. If the boat is of a reasonable type, and you do not go too far from Heybridge at first, you should not come to any great harm, and you will rapidly gain confidence, which is what really counts in sailing. Whilst you are learning, keep away fvom other boats, particularly racing boats, as much as possible, until you know what you are up to, and keep away from moorings. When you are certain you are master of your boat, try racing it. You will probably find that you are sailing very badly indeed, and racing,you will have a real incentive to improve your sailing, whereas you could spend years pottering round the creeks without even realising how badly you are sailing. Be wary of peoole who offer to teach you to sail, particularly if they expect you to pay for tuition. They will not teach you any more of the theory of sailing than you could get from Heaton's book, in fact they will probably teach you less; and in any sailing club there cought to be at least a few members who will go out with you for your first few sails until you are competent to take a boat out on your own. Experience is the only real teacher, and her charges are sometimes fairly severe in the way of soakings and damaged boats, but you will find that there is often a difference between the theory and practise of getting a boat off a lee shore, or righting a capsized dinghy. The cheapest way to really learn to sail is to join a club and mix with those who sail. Not only will ycu be able to find veople willing to go out with you; you will also be able to profit by the experiences of others. If you see a boat in difficulties, work out for yourself what mistake they have made, and what remedy they should adopt; then if you ever find yourself in similar circun- stances you will lnow the correct action to take. \"Barnacle!","IC ‘Ts des i]"]},{"year":1960,"month":5,"no":"5","vol":4,"when":"May 1960","span":null,"contents":"Tuning-up race, starting sequence, officer of the day, Dabchicks visit, Australia's America's Cup challenge accepted, 'What Rig?'","note":null,"file":"MSC-NL-1960-05.pdf","imgs":["1960-05-1.jpg","1960-05-2.jpg","1960-05-3.jpg","1960-05-4.jpg","1960-05-5.jpg","1960-05-6.jpg"],"pages":["W HAVIGANS \" Monthly Bulletin of the Marconi Sailing Club. M.A.S.C. EDITOR. F.W. Garrett. ( Yon. Secretary.) Vol.4 Hod. ____ Hay, 1960_ The sailing season is now well under way, and it seems aporopriate to devote nost of this issue to matters purely sailing. It is necessary at times to draw the attention of members to certain obligations in respect of the club. This is chiefly due to the fact that while to the members, the club is a recreational facility, to the outside world we are a prey to business and legal liabilities. There are two points this month to which the attention of members is drawn: (1) Do not leave unconsumed food food of any description laying about on the club premises, vermin have direct access, and once on the premises are difficult to eradicate. (2) The club \"flattie' has been completely overhauled by. Mr.Stebvins., This has cost the club £8. Treat it with respect, don't knock 'hell' out of it, and when mooring her, tie to the rope mooring line clear of the rocks, and with a hitch that will not ride wo the mooring line. The first race of the season was held on Easter Monday under ideal weather conditions, with results as follows:- ist Rainbow E.A. Payne and Lion x. Bazeley 3rd. Maggs P. Harris Ath Kool Kat B. Partridge Those members participating, are to be congratulated on the Herculean effort they made in fitting out, to be ready in time to participate in this race. The Commodore's yacht Rainbow, for instance, was launched at Maldon on a very inadequate tide, and it took the combined efforts of most members in the ship- yard to get her afloat through the mud!. Members who lent trailers for road transport are thanked for their contribution in helping to make the race so well patronised. On Sunday 24th April The Marconi Sailing Club held the first race in their Handicap points series. The race was sailed in moderate Worth-Vesterly {4 breeze over a course of about fiveand a half miles. Six boats came to the starting line but during the race there wes one capsize, and one retirement due to rigging failure. Results were as follows:~ rris in Magss and 3. Partridge in “ool Kat Sra. wi A Lagoda th J. Hewson in iutty May s to Helmsman. Starting. (a) Warning - Ten minutes before the start of the race. The breaking out of the flag or signal denoting the class or race. (b) Preparatory. - Five minutes before the start of the race. The breaking ovt of the \"P! flag or display of a distinctive signal (c) Start - At the expiration of five minutes ‘exactly\" both warning and preparatory signals lowered. ech visual signal will be accompanied by gun, whistle, or other sound signal. Helmsmen will be well advised to watch for the puff of smoke from the gun, especially if the starting line is a long one. But note:- in the event of a failure of either aural or visual signal, the time shall be taken from that which is effective. & race starts from the starting signal, but a yacht shall observe the racing rules from the preparatory for her class until she either finishes the race or retires. A starter is a yacht which has been entered and which manoeuvres in the vicinity of the starting line after the preparatory sigial. 4 yacht starts when after the starting signal any »art of her hull \" or equipment\" first crosses the starting line in the direction of the first mark. BeWeP.","PAGE 2. Sailing cont'd. The Officer of the day. ( Wis offic e and duties whet is the Officer of the Day? This club, in common with most other sailing clubs, keeps a duty roster of members to take charge of the dey's racing. This is done because members who are keen enough to serve in this capacity will also generally be active sailing members; it would be unreasonable, even if any one were so public-spirited, to keep him out of racing for a whole season. Active racing members, especially, should be prevared to take their turn of duty, rather than just hope for someone else to do it for them. \"Officer of the Day meansjust what it says: he is, for the day, the executive officer of the Sailing Committee, responsible for all matters requiring immediate decision. ile may be an ordinary member of the club, and the whole hierarchy of flag-officers may be racing, but to-day he is in charge. He may ask or accept advice from whomsoever he wishes, but he makes the actual decisions of what course to set, whether to shorten it because of a change in conditions, er even if conditions are too rough for racing at all..If there are exceptions circumstances he may postpone the start from its advertised time; for example, if a competitor is unable to reach the line on time for reasons beyond his control~ but all this is subject to his discretion and no one else's, But note the word \"discretion; should he wield his great powers in a tyrannical manner, competing helmsmen may (later) protest to the Sailing Committee; who will, w however, suynort him in all reasonable cases. Duties of the Officer of the Day. The Officer of the Day should be at the Clubhouse an hour before the advertised time of starting the first race Preparatory. He must decide the course to be sailed. The start should be to windward whenever possible; helmsmen may be consulted if desired about which course is suitable for the conditions, and how rany times it shovld be sailed. He must take the cennons, cartridges, flags, megaphone, course boards and Race Book from the Sailing Secretary's office and set them up on deck in readiness. He must take the entries from competing helmsmen, on the forms provided. Race fees ( 2/0d. per entry ) should be paid when the entry is made, except for those helmsmen ( listed in the Race Book ) who have made a block payment for the season. He may refuse to accept further entries from 15 minutes before the advertised starting time of the race. He should verify that all helmsmen and crew have personal buoyancy with them. and if he considers the conditions make = this advisable, should fly the red flag requiring it to be worn. Starting. Ten minutes before the start, the \"warning\" gun is fired, and simultaneously the'iClass Flag\" is broken out (the 0.0.D. should enlist assistance for this). At present, flag Q@ (yellow) is used; later it will be reserved for Fleetwinds, other flagsbeing allocated for Enterprises and handicap class. Exectly five minutes later, the \"preparatery\" gun is fired, and simultaneously the \"Blue Peter’ is broken out. ( The Blue Peter\" (flag P) is blue with a white centre). txactly five minutes later still, the \"starting\" gun is fired, and simultaneously both class flag and Blue Peter are lowered. If any boat is (wholly or partly) over the starting line, a second (recall) gun is fired. Recall numbers will not generally be used; in case of doubt which boat(s) is recalled, the megaphone will be used. The megaphone will also be used to advise a recalled boat when she has returned correctly. If the gun should misfire (other than the \"warning\" gun) and it is impoosilbe to fire the other within a second or so, proceed by the flag signals, but advise the competitors by megaphone. Postponment of the start should be announced by meganhone; it is not usual to postpone after the ten minute gun has been fired. Time Limit. If no boat has comsleted the course by 2% hours after high water ( as given in the Racing:Programme) the race is null and void. If at least one boxt has finished by this time, the race is valid for all competitors. Cont'd Yage 3.","Page 3. Shortening course. The course may be shortened at any time, if conditions make this desirable . Flag S ( white with blue centre) is hoisted, and competitors! attention is draw by firing two guns, or by megaphone. When the course is shortened, the race will end when the leading boat, continuing round the course, next crosses the finishing line (not necessarily having completed a whole number of rounds). (NOTE: this is not the basic R.Y.A. rule). Finishing. A gun is fired when each of the first two boats finish the course. A boat finishes when any part of her crosses the line; she need not cross it completely. 411 boats should be timed in; bear in mind that in a handicap race, the last boat home might be the winner. The elapsed times should be entered in the Race Book, or ( when these are available) cn the forms provided for the purpose. The Sailing Secretary will work out handicap results. The 0.0.D. should ensure that all starters are accounted for before leaving duty. This is particularly important if a downstream course has been set, or in heavy weather. It might be necessary to send out a recovery boat. Helmsmen will not generally be required to sign a declaration after ordinary club races, but may be so required in open meetings. Protests. If a competitor wishes to make a protest, he lodges it with the 0.0.D. at the end of the race. (He should also have notified the boat protested against, at the time, and have been flying a \"protest flag'' - any flag or piece of material, @e8- a handkerchief, not smalier than the boat's racing flag). A protest fee of 5/0d. should accompany the protest; this will be returned later if the protest committee are satisfied that the protest was reasonable, even if they do not allow it: its pursose is to discourage frivolous protests. The protest must be in writing, in the form prescribed by the 2.¥.A.; but in some cases a preliminary, less complete form, will be accepted after the race, with the full detailed form following within twenty four hours. Rear-Commodore. News. and Views. Dabchicks visit. We were pleased to welcome a party from the Dabchicks Sailing Club who visited us in a sailing smack from West Mersea on Easter Sunday. Great amusement and no little consternation was caused by the fact that the party abandoned their siiack some distance downstream owing to insufficient water and came ashore in their dinghy, leaving wind and tide to bring their craft tofind its ow way entirely unattended, to a yoint on the mud nearer to Momgu later on. Marconi Athletic and Social Clubs' 4.G.i. At the 4nnual General meeting of the M.4.5.C, held at the Victoria Road Club= house on Friday April 22nd our Commodore E.A. Payne, was elected Vice-President of the Club. Challenge by Australia Accepted. AMERICA'S OUP. Reproduced from an article by Ian.Procter. A challenge for the America's Cup from the Royal Sydney Yacht Squadron has been accepted by the New York Yacht Club. The races will be sailed off Brenton Reef Lightship, near Newport, Rhode Island, in 1962. The acceptance of the Australian challenge for the America's Oup comes as no suprise. The Australian fachting Association discussed this possibility soon after the last series of races in 1958. Golumbia then successfully defended the Cup against the challenge made by Sceptre, from the Royal Yacht Squadron. Australien yacistsmen, who made it lnown that they were convemplating a future challenge, watchéd Scentre!s defeat. The American 12-metre Vim, which put up a very: competent and nearly successful struggle for the honour of defending the cup last time, arrived in Sydney Harbour in January, on charter to an Australian syndictae, which announced plans to use her as a model and sparring partner for a potential America's Cup challenger. Cont'd Page 4","Practical Method. Vin was designed by Olin Stephens, who also designed the successful Columbia. Although it may be a somewhat blatant approach to the task of producing a new 12-metre yacht to racesuccessfully with Columbie, there is probably none more practical then heving Vim as a model. Although 21 years old, she is certainly very capable of giving any existing 12-metrve a good run for her money, including Columbia. Australien sources have not disguised the probability that their challenger would be develoved directly from Vim, whose hull shape could, of course, be reproduced with minor modifications, so that it comnlied with the ruling that a challenging yacht must be designed in the country from which the challenge emanates. There are four schemes for potential British challenges now being worked upon, two of them in a fairly advanced state. The acceptance of the Australian challenge obviously complicates the future of these schemes for producing a British Challenger. A suggestion that all the Commonwealth countries should co-operate to produce a challenger sent out by Prince Philip was received by the Royal Sydney Yacht Squadron just after its challenge had been made. To make it possible for this suggestion for a Commonwealth effort to be mounted, the New York Yacht Club, holders of the America's Cun, have amounced that the stipulation that the challenger must be named ten months before the races take place will not be insisted upon. This would give an opportunity for eliminating races to be sailed between Common- wealth yachts to chose the best. Presumably, the Royal Sydney Yacht Squadron challenge having been accepted, whichever yacht might be chosen after eliminating races would sail as representative of that Australian club. Whether the Royal Yacht Squadron will now adoot the suggestion of eliminating races between Comnon— wealth yachts to select the challenging yacht remains to be seen. It has been intimated that British yachts would only be able to take part if these eliminating races were held in British waters. Social. We shovld like to remind members that there is now a regular catering service on board \"iiamgu' on all days when there are club events taking place. This is run entirely by the voluntary help of a few of our lady members who would be delighted to recruit volunteers to help them. We hope as time goes on to expand the scope and variety of our catering but this cen only be done with the active co-oneration of members who create a demand. So far we san provide a menu of Sandwiches, cakes, snacks, bisouits, fruit (sometimes) and tea coffee and milk. We could do a lot more but only with your sunport!! “~ P.S. If any members have some spare galley equinment lying around we should very glad to take it off your hands. RFSm. Sale and Mart. Wanted= 13 foot open or decked clinker-built boat. Mr.BDeckett, Baddow Drawing Office. The Harlow Sailing Club ( Maylandsea ) have forwarded their programme for the 1960 season, and extend an invitation to all members when sailing in their area.","NAVIGANS May 1960. WHAT RIG?. BY \"BARNACLE\", On rigging a boat, one if confronted with two main alternatives, Gaff or BDermudan? ‘There are of course, also the alternatives of sloop, cutter, ketch, yawl, or schooner, but the points I em going to mention here apply equally to all these. There are also the the alternatives of lug and Gunter rig for small boats and much less widely used, wishbone rigs. fifty years ago, Dermudan rig had many snags and very few people would use it on a cruiser, but nowadays it is far more reliable proposition. Hollow masts, scientifically and lightly stayed, with a well designed track and a halliard winch enable one man to deal with a large cruisers mainsail in a manner which would astound the Victorian yachtsman. Aerodynemically, the Bermudan sail, with its long, tight luff and high aspect ratio is much more efficient proposition on the wind than a gaff sail, but off the wind its efficiency falls off, although with a well stayed mast, a wonderful assortment of headsails of large area can be used. Nowadays, the windage of a Bermudan mast is less that of a gaff mast for a boat of comparable size, as it has only the sail to support, and no heavy gaff, If the gaffer has a fidded topmast and not a pole mast, its windage will be even more increased. The centre of gravity of a gaff mast is usually a little lower than that of a Bermudan, but the mast itself is heavier and gives a greater overturning moment when the boat heels. With sail set and topsail up, the centre of gravity of the gaff rig is considerably higher then that of a comparable Bermudan Rig. sven today, there are a surprisingly large number of people who maintain that a Sermuden mainsail can Le hoisted and lowered only when the boat is head to the wind. This is the most utter piffle. If the mast track and slides are in good order and well greased, the sail can be raised or lowered on ANY point of sailing, though on a run care must be taken to avoid getting the headboard under the shrouds. I should hate to try hoisting a fifteen tonners gaff mainsail on a run, with a hundred pounds of gaff crashing from side to side as the boat rolls! Recent circumnavigators have shown up fairly clearly the fact that Dermudan vig is slowly but steadily ousting gaff from the position of the best rig for the long distance cruiser. Le Toumelin found that \"Kuruns\" gaff jaws chewed into his mast in an alarming manner, and he was forever putting up chafing pieces. Tom Worth and Eric Hiscock both chose Bermudan rig for the boats they had built for their circumavigations. uumphrey Berton proved thet two men, neither young, can sail a well designed sSermuden rigged boat direct from England to New York, and \"Samuel Pepys\" \"Cohoell and others have shown the speeds at which Bermudan rigged boats can be sailed over long distances, mainly downwind. ‘Base of handling\" is a comnon advantage claimed for gaff rig, but I fail to see how two halliards (usually rigged with different purchases) are easier than one, and what could be simpler for reefing than to ease away on one halliard and wind the sail round the boom with a worm gear = no fighting with maddened, sodden canvas ~ no reefing pennants to reeve; and above all, no reef points to forget to untie when letting out the reef. Anyway, it would seem that gaff rig is not all that easy to handle for very few people now go to the trouble of setting the topsail, which is indisputably the most efficient sail on a gaff cutter. On small boats, gunter rig is often a useful compromise, as it enables one to use short spars, which cam all be stowed inside the boat, as on the \"Heron'! whilst still having most of the features of Sermuden rig. Lug rig is easily stowed away and hoisted, but tends not to be quite so efficient as gunter rig, ‘vb one camot really make comparisons here as there are such a wide variety of different shaped lug sails in use today, some of which are very efficient indeed. In conclusion, it would seem that if one is after efficiency and ease of handling, Sermudan rig is a must, but fortunately, most of us sail for pleasure, and I hope it will be many years before gaff rig disappears, for what makes a finer sight than a full rigged cutter with jackyard toosail and a bowsyrit a third the Length of the hull. 'Barnacle\""]},{"year":1960,"month":6,"no":"6","vol":4,"when":"June 1960","span":null,"contents":"Avril, team races at MBYC, Solent Trophy, 'Conversions'","note":null,"file":"MSC-NL-1960-06.pdf","imgs":["1960-06-1.jpg","1960-06-2.jpg","1960-06-3.jpg","1960-06-4.jpg"],"pages":["NTAVIGANS\" io Monthly Bulletin of the Marconi Sailing Club. M.A S.C. Vole 4e No.6. June 1900. Editors Monthly comment. It was a pleasure to welcome the Chelmsford Boating Club on the occasion of their annual ational Canoe Championship on Sunday June 12th. Mrs, Payne our Comuodores Wife made the presentation of the Trophies. Sixty one Canoes completed the thirteen mile course from Chelusford to Heybridge Lock with plenty of thrills and some spills en route in the somewhat blustery conditions. The club \"flattie\" has been furnished with new oars and rowlocks. Look after them} ( They are normally keep in the office). Do not forget that the locking of the Dinghy Park floodboards is a must at all times at the conclusion of sailing, and do not leave it to the somebody else unspecified there may not be any such body. Sailing. A further picnic cruise has been arranged for July 3rd to Osea. Details from Jack Bigdon. \"Avril\" Members are reminded that a logbook is kept in \"Mamgu\" for reporting losses, demage etc. This is necessary for insurance claims, also for signing if taken out ws without previous booking. Fees should be paid if practicable at the time of booking to Mr.Darney Club Bosun, New Street, Ext. 83. \"Avril\" is not to be used by novices without an experienced instructor. Team races against li1.5.¥.C. were held at tiaylandsea on Sunday, Nay lst in dull cloudy weather with very little wind. Our team of Fleetwinds included? DR Eo ames in Wutusy May, crewed by J.Hewson. S.Adamson in Logodo, crewed by J.Mason. P.uorris in Muggs, crewed by M. Chaney. K.Bazely in Lion crewed by i.Dlaw. The results were as follows:- First race points 37025 23. Second race points ~o0e25 Pa Total w a 73.50 46 Great hospitality was afforded by the M.B.¥.C. and everyone had e most enjoyable day. Stan Adamson and Pete Harris are to be congratulated on having sailed their dinghies round from Heybridge Jasin for the event and Drian Partridge on having so efficiently organised the racing. BAP. Marconi Sailing Club. On oo the second of the dinghy handicap series provided rather puzzling conditions for helmsmen. The race started in a very light North Westerly breeze, but after a long windward leg against the tide, the wind freshened and veered to North Basterli. Four Enterprises and one Fleetwind came tothe starting line, and after the first few minutes three of the Enterorises were well ahead and fighting it out amongst themselves. Results on corrected times were: 1. Kool Kat (3.Partridge) Eni. 2. Kiora ( ee ) Ent. 3. Muggs ( P.Har ) FW 4. The Dook ( G.Ginnan ) Ent. ey ~ (DePercy ) Bat. B W D evlele ws end Views. Would you lile to own a small cruiser next year? If you are prepared to invest the cash on materials and work steadily in the coming months you can make this a reality. nember interested is requested Gont'd Page 2","to contact Mr.R.Baxter, Room 358, Baddow, and a meeting will be arranged to discuss a proposal for the construction of a number of twin bilge keel, hard chine, plywood vessels of the Nystoc, Caprice, Audicity, Debutante, Silhouette type of boat. Given a reasonable response a building programme for either home and, or joint construction, it is possible to provide a boat to sail next season. The requirements are the norwal carpentering skill with tools and the expenditure of approximately £150 to £180 maximun over the coming year. Facilities have been offered for joint construction near the tidal water, so reducing final transport to a simple launching process. liuch of these boats can be built as pre-fabricated units at home, or elsewhere, and erected on site. RB. Mrs, Viega Stocken has offered to take members on her 6s ton Cruiser lying at Burnham. Any party made up to avail themselves of this offer must include experienced members. PowWeG. National Enterprise Association. All owmers of \"Enterprises\" are reminded that the association which costs Uy 15/- per annum exists to protect your interests, arranges meetings and championships etc. These that do not belong to the association are advised to do so, and those that have not yet renewed their subscription should do so immediately in order that they may receive their copy of the year book, which goes into print shortly. Latest sail number issued was 5100. Members of the Association are also reminded that association ties are available from the Treasurer at 18/6 and lapel pins at 5/6éd. D.G.F. ‘Forgotten! Cup Oven To Contest. Solent Troohy. From an article by Ien Proctor. 4n impressive yachting trophy will be back in circulation this season after 40 years of comparative obscurity . At least 100 yachts are expected to compete for it during the Royal Southampton Regatta, which is the traditional curtain raiser to Cowes Week on July 30th. All the Royal Ocean Racing classes and the South Coast One-Design class will race together for the trophy which will go to the overall winner on handicap. Thiyge silver gilt trophy was presented’ in 1897 by Queen Victoria to the Royal Southampton Yacht Club and the only winner was W.lil.Johnstone's 165 ton yawl Latona. The Cup was lost sight of until 1937 when a member of the Royal Southampton Club noticed it by chance in the window of a silversmith in Cardiff. It was easily recognised, as it bore the arms of Southampton end was engraved with the title NQueen's Cup', It was bought and after being renovated was returned to a place of honour in the premises of the Yacht Club. Queen Elizabeth has now given permission for the trophy to retain its title of the Queen's Cup and no doubt the competition for it will rank high in the Solent racing programme.","TAVIGATS June. CONVERSIONS BYBARNACLE. Quite a lot of people convert boats these days, and maybe some of you are contemplating so doing. ‘hini: very carefully before you do, for you might waste a lot of time and money. Some types of conversion are worth doing and worth doing well, but most are not. One popular misconception is that a good cruiser can be easily and cheaply made from a ships lifeboat. A little thought will soon show the truth ~ here. A ships lifeboat is very carefully designed and built for one purpose and one purpose only - the saving of life. It is not intended to sail or motor fast, or indeed at all in any cirection other than downwind, and nothing you can do will make a good sailing boat out of a lifeboat. If you build up the tonsidas and make a motor cruiser, you will probably finish up with a dangerously unstable boat - A short walk round Heybridge Basin will reveal several glorious examples of this type of marine death trap. Also, ships!lifeboats come on the market only when they have reached the end of their useful life, or when the ship is rebuilt or scrapped. Reasonable conversions have been made from lifeboats at reasonable costs, but they are excsptional, and they have all required a lot of time and work, almost as much as building a new boet, and their final value is not high Host boats were originally designed and built for a specific purpose, and any attempt to convert them to any radically different use will usually end in failure. The three types of conversion which are worth tackling are the barge to to houseboat, smack to yacht, and ex-racer to cruiser. The first mentioned is very well worth while if you can find a sound barge at a fair price. Since Tonides day, many have been converted to excellent homes, and sailed regularly round the Thames Lstuary by their proud ommers, but the heyday of the sailing barge has now alas gone, and it would not be easy to find one in good enough condition te te worth spending a lot of money. Very good yachts can be made out of old fishing smacks, but give the hull a thorough survey before you start-Inshore fishing from small smacks is a dying industry, and the boats are dying with it - most are dead and few of those still in use have a great exnectation of life. (ood smacks can be found, and converted at quite a moderate cost into excellent cruisers. Pay no heed to those who say smacks are useless offshore ~ remember that, that green painted smack with the very faded sails that one sees around Maylandsea is Doctor Pye's \"Moonraker\", used for Summer holidays in the Pacific, or the Baltic - a boat that has probably sailed more miles than all the smart cruiser/racers that lay up in Cardnells! yerd, end is still good for many more. Other exemples such as Dixon's!'Dusmarie! also soving readily to mind. Also, if you want to race, remember that at least one old Maldon bawley races with the East Anglian Offshore fleet and does quite wel! Qld racing boats which have been outclassed can often be converted to very good cruisers indeed, as the G class prove. Few of us are likely to be interested practically in the excellent conversions than can be made from the larger metre boats, even a 6 being beyond the reach of most of us, but 5.5s and Dragons are within reach, Treated sensibly, these will give a very comfortable small cruiser, but care must be taken to keep down weight if performance is not to be lost. Monsoon, Josephine, Nency, Oyesha end Corrie are all well Imown locel cruisers converted from racing boats. in the smeller sizes, some of the larger dinghies and open day boats can be converted into fairly hendy week end cruisers, but make sure the boat is no longer suitable for its original purpose. Around the turn of the century many of the larger yachts carried 16 - 24 ft sailing boats as tenders, which were often used for evening races \" for fun\" after a big race. These can be converted into nice little cruisers, with reasonable accommodation and a very good turm of speed. In the small sizes, cabins can be built onto dinghies of 14 ft and over, but the accommodation so obtained is little better than can be got for a quarter the cost and work with a cenvas cover. It is worth making a permanent conversion if you intend to spend your holidays and most weekends afloat, and if you hope to sail the boat for four or five seasons, but even a very small and simple conversion will teke a lot of time and work, and it is not worth while if you intend to use the boat occasionally. Before you buy 2 boat for conversion, be absolutely certain of what you intend to do; make as close an estimate of the total cost as you can, and make sure the finished boat will be worth it. Also make sure you can afford the time. There are several boats around Maldon going rotten because their new owners hastily tore off decks and eoamings and then found they hadn't the time to complete the job. WDARNACLEN","te data ae © act 5 AGS we pheoes, ae 2ae Br, eh! Beak gebes is ee se = ed - + feiries OF) aieee4 a2-2 ween 7 6 es a SRG oa Food~ 8! eine ag} \"gc Pie Ged eae ee basSeisabane: rt toot 2 , af Pe a"]},{"year":1960,"month":7,"no":"7","vol":4,"when":"July 1960","span":null,"contents":"Dinghy park, Mamgu, Blackwater and Colne Dinghy Championships postponed, 'Decks'","note":null,"file":"MSC-NL-1960-07.pdf","imgs":["1960-07-1.jpg","1960-07-2.jpg","1960-07-3.jpg","1960-07-4.jpg"],"pages":["\"NAVIGANS\" Monthly Bullettin of the Marconi Sailing Club Editor: IF. W. Garrett. (Hon. Sec.) Vol. 4) Noe 7» July, 1960. Editor's toot Monthly Comment: members on leave this month, nevs is a trifle scarce. Despite our viable weether, sailing contimics in full spate. The weather, inciden oly, } gs outa point to note. Too many people are sailing without § sonal buoyancy in conditions that demand more discretion, Three capsizes g'3were noted one afternoon, and in no case was personal buoyancy in evidences The sea can be a hard mistress and does not suffer fools gladly; and, if you are out in a strong wind and tide, don't court trouble ~~ it take a little time to organise rescue facilities, In their own interests, all non-swinmers and all under eighteen should wear or carry aon buoyancy at all tines Regotiations are proceeding for a rescue leunch recently located, Dinghy Parks Negotiatior cve been satisfactorily concluded with the landowners. aes ark into shape, partievlarly in tine zon the Fleetwind sner'sTrophy on tne: 21ste/22nd. August. Gome on, you di owners? amet Mameu\" s Will nenbers younger fra nat we have 2p. no paid steward to clean “up after thea? This job rests on voluntary rt, 2@ a M.A.S.C. relies on us to maintein the premises in good order. So do the locel authorities} This evei bad weather, the event hed to be postponed until September 18th. As a lot of dinghies had errived for the occasion, and as the weath improved as the day wore on, it wee Gecided to hold an all-in handicap race. This provcc to be a great success, and it was a grand sight to sce nearly a hundred Gi Les 11; ing to keep upright in the fresh breeze; there were manh capsizes, but everyone seemed to have had a very enjoyable day, with vast quan es of food to ji > - to cancellation of the mein event) ARTEL S.C. (3B.B,C.) On July 3rd., a garty from our §lub visited the Ariel 5.0. at Teddington for the return tecm races. Although the weather was very fine, there was hardly any wind, and our teum was hopelessly outsailed by the B.3.0,. who knew all the dodges on their houie waters. paenl hospitality was afforded by our hosts and a very enjoyable t Was tae 6 y all, our Cormodore saying¢» few words of thanks to. the assemble: company. EAP. Zh. Dit ae Dus race was held on July 23rd. in fine, but rather overcast cble winds, and five boats caize to the starting line. Results wore 2s folloudte ). P, Harris in Muggs ( FW ws )» A. Pratt in Lollipop (FW-3,0)","BY \"BARNACLE\" One part of a cruiser which often receives much less consideration than it deserves is the deck, All too often one sees and hears of otherwise good boats getting a bad name due to an inadequate deck. A-cruisers deck must be much more than just a top to the hull. 14 mst be capable of withstanding severe shock loads from breaking waves and falling crew, it must kee» water out of the boat, and it must be capable of carrying quite a lot of the sailing stresses. 4lso it must be strong enough to hold fairleads, a lashed down dinghy, mooring cleats and other fittings, though all these items have special local strengthing the deck must still play its part in transmitting the loading to the remainder of the hull structure. Finally, it must be surfaced and leid out to make it safe to walk on, and easyto get about without fear of slipping or trigping. There are three main methods of decking a conventionally built cruiser, yiZ@e laid caulked planks, tongued and grooved planks canvassed over, end plywood sheets. All three methods need adequate deck beams to support them, and within reasonable limits, the more camber the better - a lot camber may make the deck seen awkward when the boat is on a mooring, and things left on deck may roll overboard, but when the boat is sailing heeled well over the camber is a distinct advantage. Also, the whole deck structure is better able to resist the impact of breaking seas. zt All three methods require good hanging lnees on as many of the beams as possible, laid or canvassed decks also require good lodging Imees, particularly in the way of the mast. A plywood deck does not require lodging knees, but it must be very well fastened to the deck beams and topsides. The tongued and grooved deck is the easiest end cheapest to fit, and with good non slip deck paint on the canvas should »rove quite adequate. The life of the cenvas is very limited, and once it begins to go, troubles start. Any water getting under the canvas will almost certainly run along between the wood and canvas and leak out yards away from where it entered, (usually over the middle of a bunk, or over the toilet), this makes the leaks hard to trace, and often signs of rot in the deck are the first indication that the water is seeping along it. Once a canvassed deck starts rotting, it will spread the rot to the hull and cabin sides very rapidly. A well kept laid teak deck is the envy of all who behold it, and should last the life of the boat. However, it must be given frequent attention, and washec over every day in hot weather if it is to remain tight. A laid deck, whether of teak or pine, shovld never be varnished ( unless you really want to slide overboard), and most paint finishes will get slippery when they are wet. The seams must be left well filled with marine glue, for once a laid deck startsaw leaking the water will run along the caulking like a wick, ond although a teak deck is not likely to rot, the beams on which it is laid can and will rot quickly once regular leaking starts. All »lanked decks work as the boat sails, and often leak as well, but dry up when the boat stoos sailing hard. A bit of lateral give in the deck is not altogether a bad thing, as it enables the boat to \"“wrigsle+ through and over reugh seas. A plywood deck should'be ‘almost leakproof, particularly if all the sheets forming it are scarpled together with a good resin glue, but such a deck is not so easily fitted to a boat with extreme shear as a planked deck, as the ply sheets object to the double curvature involved. One big disadvantage of a ply deck is that it can work only at the edzes. This sreatly reduces the possibility of leaks, but also greatly increases the strength recuired in securing the deck to the hull. It is not easy to achieve a good non slip finish on a ply deck without using a “loaded! paint. Of these, probably the best is enoxide resin loaded with sand - it is hard on hands and Imees if you do slip, but slipping is not likely. One of Britains leading offshore racing skippers has expressed the opinion that in a few years plywood will render planked decks as opsolete as the old \"plenked on edge! gaff cutters for ocean racing, and it certainly seems that a ply deck can offer many advantages. Plywood is really the only satisfactory","deck material for surfacing with fibreglass, as a planked deck will very soon work and split off the fibreglass. whatever type of construction used, the deck must be at least as strong as the tovsides of the boat, if not stronger, for when sailing it has.to do just about the same work, and it does not have the benefit of the extreme double curvature found in the hull to give it extra strength. Next month I hope to be able to mention some points to watch concerning deck layout. \"BARNACLE : the wrong buoy at Maldon, and P. Darney in Avril BeA.P. ter 8.0., thanking them for their help in rescuing our capsized 4 inghies curing the recent bad weather, In addi- tion, it is hoped that those s involved will take an early opportunity of thanking the club steward ; vsonally for his assistance.","fanehes te ins Letisger cose 6 freteit » tiles Sea iow mecca be ae rouirdaioe 2o evta sevegad- avegek: beret"]},{"year":1960,"month":8,"no":"8","vol":4,"when":"August 1960","span":null,"contents":"New rescue launch, Marconi Cruiser Cup, 'Barnacle'","note":null,"file":"MSC-NL-1960-08.pdf","imgs":["1960-08-1.jpg","1960-08-2.jpg","1960-08-3.jpg","1960-08-4.jpg"],"pages":["/ NAVIGANS. Monthly Bulletin of the Marconi Sailing Club, M.A.S.C, Editor F.W. Garrett. Hon. Secretary. Vole A. Nowesd. August 1960. Editors Comments. With the holiday season in full spate despite \"our usual summer weather\" news is still a trifle scarce apart from the attendant difficulties of producing this bulletin in reasonable time. There are however a few items to which it is necessary to draw repeated attention. One is the necessity to maintain: and practice elementary cleanliness,tidiness and hygiene on \"Mamgu!''.This is particularly so in respect of the toilets. These should only be used as a last resort and then only in a minor way. I leave members to judge the implications facilities exist ashore at the \"Jolly Sailor\". We do not wish to invite trouble with the local authorities. The same line is in respect of sleeping on board \"Mamgu\", This is definitly not permitted. The committee do not object to members getting their \"head down\" for a couple of hours to catch an early tide, but if members require to stay overnight they must make alternative arrangements. Finally some culprit removed the Dinghy Park floodboards early in the month on a Monday or Tuesday, and not only left them unlocked, but \"ditched\" the key. This was later found half way to the Blackwater Club in the grass and returned to the Secretary. In the meantime a new lock had to be purchased. A very serious view is taken of such incidents. If a loss or breakage occurs, report it to a cluo official, and then we can do something about it, don't leave it to be found out. Apart from the above, recent items include a broken lampholder and lamp in the mens changing room, rowlock plate missing on the ‘flattie\", and the barometer face ring found at the foot of the companionway with glass broken. Rescue Launch. A vessel is being acquired,the engine is under overhaul, and it is hoped to be in commission shortly. The responsibility for the vessel rests with Mir.Darney (Peter) the club \"Bosun'. The prime function of this boat is for rescue purposes and assisting members in difficulies. There may be other purooses for which it could be of use as the comaittee decides, but no unauthorised person will be permitted to use, or board this vessel at her mooring. Sailing. Marconi Cruiser Cup. The race for the Marconi Cruiser Cup was soiled on Sunday August 7th in a light S.E. breeze. Sam. Poulton in \"Escape\" took the lead on the beat out to Ford Creek against the last of the flood tide, but was steadily overhauled by Fred Garrett and Phil Luke in''Melody'! who had a late start, but took over the lead near ilities are available. One off demon- stration model Craft rigged ( varnished) is available for £65. Any members interested are advised to contact the above firm (opposite BE. E.B. SIEM : A report on. the above will be given in the os issue. : Floats. The floats moored alongside ‘Mamguil have been offered to the club at ¢est\" © by Mr.Hiscock, 2/6d-each from each member would procure these very acEeu items. What about it. Contributions to the Secretary. sale 8: end Mart. For sale. Fleetwind 133 'Nutsy May! with sails complete - £60 0.1.0. J.Hewson. Enqurics to the Secretery. 12 Sq. Meter Sharpie. . £70 (believed) Blackwater S.C. to $3 ‘Deck layouts vary enormously from boat to boat, even on recognised \"one designs! like the local Blackwater Sloops, which can be seen with full width cabins and low foredecks, full width cabins and raised foredecks with and without forehatches, and low decks with a narzow coach roofs. So far, I, have not seen one with fully raised topsides and reverse sheer, but one day perhaps one will be built. The performance of these boats is not greatly affected by the differances in deck layout, but the accommodation and ease of handling is most certainly wey affected, as(stupidily enough! ) is the handicap rating. Each type of deck layou\": has its own peculiar advantages and disadvantages, and when buying a boat a lot .of thought is needed to decide which are the’ most important factors. A full width cabin and raised foredeck give the best internal accommodation, make the cabin scom Sam mere specious than it really is, end*also pees the easiest deck to lay, the 1 ‘% likely to leak and the strongest. ainst this, picking up moorings is not quite so easy (unless a spar type. buoy is used) and the windage is increased ( so slightly as not to matter). Also a flush deck of this type gives good space for sunbathing and carrying a small dinghy. Safety on deck is greatly increased by a liferail all around, and particularly by a pulpit. A full width cabin and lowered foredeck gives fairly good accommoda tion inside the hull, and so long as reasonable bulwarks are fitted, provides a safe little well for anchor and handsail work. On a boat of reasonable freeboard, a pulpit is a desireable feature. The greatest disadvantage of this type of deck Layout is its tendency to leak at the break of the cabin front. When sailing hard in rough water the nearly vertical flat surface of the cabtn front is hit hard and often by fairly+solid lumps of water, and it will not be long before some annoying leaks develop, particularly if the bulwarks are faired up to cabin top level in a szooth curve. No matter how large a scupper is cut in the bulwerk, water will still be trapped in the corner, thus agravating the leaks (which are almost certain to appear over the bunks). Snags with both the above types of deck layout are the height from cockpit floor to cabin top and the difficulty of finding a really good position for jib sheet cleats and winches. If they are on the cabin top they are liable to get horribly in the way, and if they are on the bulkhead, they are quite likely to catch in your trouser leg as you step down into the cockpit. Then it is a question of which is the stronger, the cleat or your trousers! Either way you will most likely finish uo head downwards in the cockpit Cont'd Page 3","or if the boat is sailing hard, overboard. A low deck with raised cabin set inboard looks very nice, and without liferails, provides the safest deck for working on, but it ruins the accommodation on a small boat and is liable to be a prolific source of leaks end eventually rot. It is the most difficult type of deck to lay, and also the weakest. The longer the coachroof, the less the transverse strength of the deck, ond if the coachroof is ext ed forward of the mast some really hefty xdec to take the sailing forces. acte strength, ease of laying and maximum accor sheer is the best type of deck, but it is advisable to fit a small the monotony of the otherwise bare deck and to keep water from runn the main hatch and into the cockoit. On the size cruiser considered her a flush decked normal sheer boct would be imoracticable as it would give no usuable space down below. If you went 2 really effective means of keeping the inside of the boet wet, and reducing the strength of the foredeck, then fit a forehetch . It will also help trio up the unvery when they go forward, but will serve no useful function on e smell cruiscr. Severcl designers clair. you can stand in the hatchway to decl with headsails, but if the foredeck is so unsafe that this is necessary, then the boat should not be at sea. A forehatch on al x boat does provide a quick means of disposing of redundant headsails, but on boats of under five tons it is just as quick to oush them through the main hatch. If the interior layout has been well plarned they can easily be stowed away from there. For maxiimum ease of handling the deck should be keot as clear as possible. Boxes or belaying »ins should be provided for halliard falls, and mooring cleats should be kept as close as possible to the edges of the deck. Jis shects should run either along the deck edges or along the cabin sides whenever possible. Fairleads right in the middle of the side deck are often nice for use with certain headsails, but are a nuisance when going forward in a hurry. Ventilctors should be fitted where they will not be trix.ed over, and where they will not foul sheets, or mooring warps - not always an easy job on a small cruiser. Unless the deck has a very good non skid surface and a generous camber it is a good idea to fit two teak strips along the foredeck to »srovide an angle in which to tread when the boat is heeled well over, but don't forget to break then at intervals so they can't tran water. BARNACLE,"]},{"year":1960,"month":9,"no":"9","vol":4,"when":"September 1960","span":null,"contents":"'Helmsmanship and Seamanship'","note":null,"file":"MSC-NL-1960-09.pdf","imgs":["1960-09-1.jpg","1960-09-2.jpg","1960-09-3.jpg","1960-09-4.jpg"],"pages":["\" NAVIGANS \" Monthly Bulletin of the Marconi Sailing Club. M.A.S.C. Editor F.W.Garrett. Hon Secretary. VOL.4. No.9. Sept.1960. Editors comments. With the season drawing to a close one can reflect a little on the performance of the \"elements\" this year. Mother nature has a very great effect on our pastime, and in some respects 1960 bore strong resemblance to 1958 in its antics. Those of us who viewed the synoptic charts daily with their long string of depressions while the proverbial Azores \"high\" struggled in vain, hopefully reminding ourselves that it couldn't last, but it did; the meteorological term \"depression\" has a truer ring about it at times than the originators could have anticipated. But to a more practical outlook, it behoves all of us who venture upon the water whether in a dinghy or a cruiser, to learn something about what is colloquially called \" the weather \", and to read and interpret the signs in the sky. Meteorology can be a facinating subject, one does not have to go in to the subject deeply, just enough to be useful for ovr purpose. We do not anticipate having to prepare \"teephi\" diagrams or worry about adiabatic lapse rates before we venture forth, these are for the professional meteorologist, but to under~ stand the behaviour of depression and anticyclones, to recognize a frontal system as it passes through, and a squall if it makes a beeline for you. There is an excellent pamphlet written by Lt.Com, Rantzen just for people like us. Although the writer like many other people has noted the climatic changes that have occurred over the years and now commented upon in the appropriate quarters, the main interest still is what is it going to be like tomorrow or \" what will it be like when I'm down the other end of the river‘, Sailing. The \"Fleetwind' race against Maylandsea Bay Y.C. took place in bright and sunny conditions with a light north wind prevailing. C.Hadfield M.B.Y.C. (Widgeon) lst T. Emerson M.U.Y.C. (Elvira) 2nd J.Bovis H.B.Y.C. (Leafly) 3rd _ P.Harris 1i.S.C. (Muggs) Ath B. Partridge M.S.C. (Hutsy May) 5th A. Adamson MeGeG: (Logodo) 6th Fleetwind Designers Trophy. The following letter has been received from Mr.Lavington, Hon. Secretary, Fleetwind Association. : Mr.Payne has replied on behalf of the Club. The Commodore, Marconi Sailing Club, 31st October 1960. Victoria Road, Chelmsford. Dear lir.Payne, On behalf of the fleetwind Association I should like to convey our thanks to you, the Race Committee, and all those who helped to make the Meeting such a success last weekend. Yours sincerely, E. Lavington. Cont'd Page 2.","PAGE 2. News and Views. Dates to Remember. Friday 14th Octoher, M.A.S.C. Victoria Road. 7.30 peme. Discussion on the forthcoming winter programme and preparation for the 1961 season. Friday 4th November. Laying- up Dinner and Dance. Friday 18th November. A.G.M. Victoria Road. 7.30 peme Contributions for the purchase of the \"floats\" is very slow in coming in, what about it, we all use them, 2/6d per head is literally one penny per week for the season. Helmsmanship and Seamanship. By Barnacle. The last few years has seen the rapid growth of an entirely new breed “TM of \"sailors\" - the \"dinghy boys\". Many dinghy sailors are absolutely first rate seaman, but, alas, there are many others who cannot be called seaman at all. Having learnt how to persuade their fragile little plywood box along at something approaching its maximum speed, and picked up a few of the racing rules (often far to few) off they go - a menace to themselves and to everybody else on the water. Having won a race or two they consider themselves fine helmsmen, as maybe they are, but, they also consider themselves seamen, and that they most certainly are not. One has only to stand on Maldon Quay for half an hour to observe them at their worst - having got their boats into the water, and sail up, off they go (if the wind is in the right direction!) If the wind is onto the Quay, then the fun starts (if you can call watching their boat damaging antics fun) they will try anything sooner than paddle well clear before hoisting sail, then after the race they frequently ram the quay hard rather than get their sails off and blow in under poles. Put them ashore on a nicely shelving lee shore, with a few moored boats about, and one is all set for a first class pantomime, These little tricks may be all’ right with their ultra light weight plywood boats in calm sheltered waters, but someday, having learnt their bad habits, they may try similar tricks with a cruiser weighing 20 tons, in rough breaking water. Then the Coroner's verdict will be \"Death by Misadventure\" and not \"Suicide\" as it should be, and the insurance company will have a heavy claim to settle. Their knowledge of boat maintenance is often as sketchy as their knowledge of boat handling. Rigging is something one buys from a yacht chandlers - lmots are something one might have to use on a big boat, and splicing is a magic art learnt only after a couple of hundred years at sea. Damage to the hull can be repaired only by the boatyard, or, a far more dangerous attitude, - \" Where's the hammer and the tin tacks - I'll soon patch that\". There are many other things about which these charming people Imow nothing. They know more or less what the weather is doing at the moment, but why, and what it is likely to doin the near future is a complete mystery to them. Many of them have never heard of the International Regulations for Preventing Collisions at Sea, let alone read them, then they wonder why the owner of the eleven ton yawl cursed them so heartily as they wriggled out from under his bowsprit. They do not realise that a boat of any size is very restricted in the upper reaches of the river, and they expect a large and heavy yacht to turn in an impossible distance or stop dead. Navigation, chart reading, signalling by morse or flag wagging, buoyage systems, and the wealth of maritime lore and tradition are all closed books to them. But worst of all, they are utterly lacking in common courtesy and good manners on the water. Not all these horrible undesirables sail dinghies. They are to be found Cont'd Page 3.","PAGE 3. in even greater numbers among the \"Marine Motorists\" particularly the owners of little outboard runabouts, and they are certainly to be found sailing larger racing cruisers. Now I have deliberately been sarcastic and painted a very black picture. I lmow of no dinghy owner who has all the faults listed, but there are many who have one or more of these faults, and it is up to all of us who race dinghies to see that our behaviour on the water cannot offend others, and to endeavour to broaden our knowledge of nautical matters. There is much more to sailing than just racing round a few buoys near the clubhouse, and much of it is easily learnt. To learn the other persons point of view, what could be better than to cadge a sail with him?. A day trawling dow river, or crewing on a cruiser racing from Mersea to Burnham will not only be instructional, it will be jolly good fun. I hope sincerely that no one reading this will take offence - I am commenting on a very noticeable and very regretable trend, not \" getting at \" anybody, and I hope that anybody who might think he is being \" got at \" will reread the article in the spirit in which it is written. \" BARNACLE \"","ifha"]},{"year":1960,"month":10,"no":"10","vol":4,"when":"October 1960","span":null,"contents":"Mamgu working days, Small Ship Construction Association, 'Laying Up'","note":null,"file":"MSC-NL-1960-10.pdf","imgs":["1960-10-1.jpg","1960-10-2.jpg"],"pages":["\"NAVIGANS\" Monthly Bulletin of the Marconi Sailing Club. M.A.S.C. EDITOR. F.W.Garrett. (Hon. Secretary.) Vol. 4. No.10. October 1960. Editors Monthly comments. With the end of the Season in sight the \"Laying-up Supper is upon us followed shortly afterwards by the A.G.M. The former on November the 4th in the \"Palm Court\", New Street. promises to be an enjoyable occasion as in previous years; and the latter on Friday November the 18th in the M.A.S.C. Main Hall, Victoria Road, promises to be a lively one. . The following do not seek re-election . Mr.E.A.Payne. Commodore. Mr.A. Adan. Rear Commodore. Mr.R.F.Sins. Social Secretary. \"Mamgutt. The following dates are suggested as working days for 1960. 30th October. (Already announced). _ 20th November. lith December. Liquid refreshment will be available, and we trust that members will give their full support. We have a heavy winter programme. embers are requested tc clear their personal effects from the changing rooms by mid-November to enable. work to proceed,and to give the ship a good clean-up. Social. The following social dates for the winter programme have been provisionally fixed. 24th November. Film Show. 8th December \" Blackwater Mud\" by Mr.Masefield. (We all remember Mr.Masefield's absorbing and interesting lecture last season dealing with the River Blackwater.) These lectures will be held at the Marconi College, Arbour Lane. 7.30 p.m. Xmas Party. December 17th on board \"Mamgu!! The Small Ship Construction Association. A group has been formed for the purpose of building or learning to build boats, tenders, dinghies and cruisers as economically as possible. Membership of this organization is open to members of the Marconi Sailing Club at an annual subscription of 5/= The Association hope to be able to provide tools, expert advice and tuition as well as materials at cost price . The premises on which the Association have at the moment an option to lease are at Margaretting with room enough to accommodate up to twelve boats. This will become the Headquarters. However no objection will be raised if anyone wants to build at home or at the other premises (one at Baddow and another just outside Maldon) the Association may obtain, Enquiries may be made to R.F.Sims, Room 267, Baddow. LAYING UP. BY BARNACLE. Unfortunately the end of another season is upon us, and most of us are thinking of laying up our boats. Judging by the sad and sorry sights one sees along the river every winter, it would pay a good many people to think a trifle harder about the business of laying up. No boat is improved by being left just Cont'd Page 2.","Page 2. as she was at the end of the last sail, with paint beginning to flake off, damp bilges, damp sails and odds and ends of gear scattered all over the place. If the hull is to be left afloat, it should be stripped as far as possible, and covered over so as to leave adequate ventilation without letting in the rain and snow. If it is impossible to arrange for an adequate cover, try and give the whole boat a coat of paint or varnish before leaving her, This will almost certainly be in a very poor state by the spring, but the paint underneath will not have suffered. Some owers haul out their boats in the Autumn and give them a coat of emulsion paint all over, then when they come down to fit out, their topsides are in really good condition. If you are laying up ashore, make certain the inside of the boat is dry before you put the cover on. It is not enough merely to pump and sponge out the bilges. The whole of the boat must be thoroughly washed with plenty of fresh water to remove all traces of salt. All floorboards and bunk boards should be taken up and scrubbed, and lockers should be emptied and left open. Floorboards should be left up for the winter, and all ports and ventilators fully opened so that the whole of the hull is well ventilated. Mechanical fittings such as pumps and winches should be well cleaned, again taking great care to remove all traces of salt, then they can be greased and left for the winter. On removing the mast it should be examined very carefully to see whether it needs any repairs, then after labelling and removing all the rigging the mast,boom, spreaders and any other spars should be given tu coat of varnish before being stored away in a dry shed. When stowing away the spars make certain they are well supported so they can't bend. All wire rigging should be examined for signs of trouble and carefully coiled and stowed away. If possible the rigging should be well oiled before it is put away, but if this cannot be done it shovld be taken out and oiled during the winter. A small boats rigging can be stored in a large biscuit tin, then if a spare tin is kept handy the rigging can be taken out and oiled one or two wires each night and then put in the second tin so you can be certain that each wire does get oiled. This process can advantageously be repeated two or three times during the winter. If a large enough diameter drum can be readily obtained, all the wires can be coiled down in it, a quart or so of linseed oil poured in and the lid sealed on. Then if the drum is rolled over every so often all the wires will get well oiled with no more trouble than kicking the drum round the store shed. Looked after this way ordinary galvanised wire will last indefinately, but if it has been neglected and allowed to rust, you won't get much life from it. Ropes should be well washed, and about the easiest way of doing this is to coil them all in a large tank, put a hose in and run fresh water through them for a day or two, after which they should be hung up to dry before being finally coiled, and stowed af wv for the winter. Sails deserve more care than your best clothes, for they are“Tar more expensive, and one day your life may depend on the condition of your sails. If you can't manage to wash, dry, repair and store your sails properly, then hand them in to the sailmaker, He won't charge much, and you can be certain your sails will be well cared for. All small parts like blocks, jamb cleats etc. should be taken off the boat and taken home for the winter. It is quite surprising how much work can be done at home at odd moments, then if you have laid up the hull, spars and rigging properly, your fitting out in the spring will take only two or three weekends, so their is no reason why even the larger cruisers should not be ready to sail by Easter. If, however, you have been lazy and = skimped the work at laying up time, you must expect to be faced with a lot of unnecessary hard work in the spring, and the replacement of gear that would otherwise have been good for several more seasons. Also, never forget that if you once let your boat really deteriorate you will never be able to get her back to good condition, and her resale value will fall."]},{"year":1960,"month":11,"no":"11","vol":4,"when":"November 1960","span":null,"contents":"AGM, club to host the 1961 Blackwater and Colne Dinghy Championships, 'A Note on Tidiness'","note":null,"file":"MSC-NL-1960-11.pdf","imgs":["1960-11-1.jpg","1960-11-2.jpg","1960-11-3.jpg","1960-11-4.jpg"],"pages":["Monthly Bulletin of the Marconi Sailing Club. M.A.S.C. Ecitor F.W.Garrett. Hon.Secretarry. The Annuel General Meeting took place e on Fridsy léth Wovember at the MASC clubroom, Victoria Rd, Chelmsfor a ag circulated. About 40 members were present with Mr.F.Collins in the chair. Peports were presented by the Commodore, Sailing Secretary, Social Secretary and the Generel Secretary/freasurer, followed by the election of club officers: and committee for 1961. The club hrs had a pusy and eventful year. Psaid-up membership is in the region of 150 and is on the increase. This includes 21 sssociate members. Much progress has been ede during the year on the renovation of 'Momeu' and the club facilities, and great credit is due to Mr.Bigden ana his co-workers in the giving of their leisure time to this end. To conplete the task and cater for future expansion much remains to be done and working days will be a feature of the winter programne. ‘he social activities have been an outstanding success due to the efforts of Mr.Sims and his 'Galley Slaves'. It is often not realised or appre- ciated just how much time and effort is given behind the scenes to make ANthings ‘tick’. — The sailing went off quite smoothly during the Season, and a launch —~ has been obtained for rescue and guard purposes. Mr.Darnay did his usual excellent performance on \"avril\" for which we owe him many thanks. It was unfortunate that our somewhat fickle climate played hzvoc occasionally with the sailing, but we hope for a better show in 1961 from 'Mother Nature’. Mr.&.A.Payne the resigning Commodore and Mr.F.Collins MASC Chair- men were offered the position of Vice Presidents for their excellent services to the club. Both gentlemen accepted and the proposal was passed unanimously. In the absence of any nomination for Fear Commo- dore, Mr.Hallam proposed that this office should be combined with and offered to the Sailing Secretary for 1961. This was agreed. The following gives a list of officers and committee elected with location. Commodore. ir.T.W. Hallam. Baddow(D/O) Vice-Commodore. Mr.A.Adam. Baddow(Datamation ) Rear Commodore and Sailing Secretary. Mr.B.%.Partridge. Baddow(Datameation) mSsocial Secretary. Mr.A.S.Bigden. New St.(Mechine Shop a Office) ~. Asst. to Social Secretary. Miss O.M.Marchent. Baddow(Admin.) Secretary/Treasurer. Mr.F.W.Garrett. Baddow(H/WV Bldg.) Committee Vr.S.Adamson. New St.(Central Div.) Mr.E.H.Cottam. Baddow. (M/W Physics) Mr.A.Pratt. New St.(Bldg.46) Mr.D.Rowland. New St.(Broadcasting Div.) Mr.R.F.Sims. Baddow(M.Physics) Mr.B.L.Tillotson. Associate menber. 359 Baddow Rad, Gt.Baddow. The club bosun is Mr.P.Darnay (New St. Inspection) Official Mbheasurer. Mr.D.Freemen (New St. Accounts) Your ssiling secretery is busy on the next Seesons programme which promises to be a very full one. We have unfortunately had to decline some events from outside clubs who wished to visit us. There just isn't enough weekends in the season, particularly in tidal weters to fit everything in much as we would like to welcome ouw friends from elsewhere. It is our turn in 1961 to be the host r everything and everything in its place? If not, why not? ,Om a boat it is essential that there should be a place for every item of equipment carried, otherwise chaos will result. A locker or cupboard under the aft deck is not enough - it will merely confine the chaos to a smaller area. One has only to look into a badly stowed food locker aboard a large cruiser after an inadvertant gybe to realise what an unholy mess can be caused by a few broken jars and upset packets. If the crew have 2: tendencies towards sea-siclmess, such a mess will most certainly be the last straw for them, and it can be avoided so easily. Once one item in a locker works loose it will bang about knocking all the other things out of their places, breaking whatever it can until finally the entire contents of the locker fling themseives against the door, break it open and land in the bilges. In the cool of the evening, can you readily lay your hands on 2 dry sweater, or is it stuck down the bottom of your kitbag under a load of useless junk? Usually when you want anything on @ boat you want it in a hurry: so as far as possible all stowage systems should be arranged so that nothing is covered by something else. ~~ Binoculars and camera should be kept ready to hand at all times, out should be kept dry and in a place where they are not likely to get IS damaged. Untidiness below on «.. a boat usually results in @ great deal of inconvenience and unpleasantness, but untidiness on deck can have serious, even fatal consequences. An improperly stowed anchor can very easily punch a hole in © boats plsnking, and a badly stowed warp will tend to foul everything, maybe even your legs, throwing you overboard and holding you there, head under water with your feet secured to the deck by & fine old tangle. Serve you jolly well right. Next time, if there is a next time, perhaps you'll stow your warps properly. There is only one way of stowing a warp so you can be certain that it will run out clearly whenever you need it, and that is the flat \"Flemish Flake\". The men on the grin barques rounding Cape Horn did'nt risk their lives in the scuppers flaking down the falls of sheets and braces merely to make the boat look tidy, they did it because their safety depended on the smooth running out of those falls. A snarled up main brace could mean the sails would be taken aback and the masts broken, and it was only by flaking down the ropes neatly that the men could @mouarantee that they would run out freely when needed. wel Boathook and fenders should be handy when manoeuvering in the vicinity of other boats, but they must be so placed that they cannot foul the jib sheets or the anchor warps. Often when kedging a boat against the tide, using a dinghy to lay out the anchor, one is tempted not to bother to coil the warp properly as you haul up to the ked¢ge, put the mess you can get into if a turn of the kedge warp catches a flake of the bower anchor, or if you merely drop the whole lot straight into the dinghy will soon make you wish you has'nt been so lazy. It may seem a waste of time spending five minutes on the foredeck in: . pouring rain coiling dovn a warp that is to be used again directly, put it is far less of a waste of time than spending half an hour in the dinghy trying tosort out a tangle. If you marge to sort out the tangle without letting go of the enchor or losing an oar or rowlock, only your temper will suffer, but there is a great risk of losing an oar whilst struggling with the wet, muddy rope, and then you are in a pickle. ven the most unlikely things can cause trouble. One offshore racer found herself in serious difficulties when a worn burgee halliard broke and the loose end wrapped around the mein healliard in a rising gale, preventing them from reef Accidents like this can occur so quickly, and the only possible of preventing them is to aim at absolute perfection throughout e vhole boat. If you race, the nearer you can get to perfection, the better will be your chances of winning. \"BARNACLE\"","WORKING PARTY BUN = 11TH"]},{"year":1960,"month":12,"no":"12","vol":4,"when":"December 1960","span":null,"contents":"Working days, winter lectures and films, Earls Court Boat Show January 1961, 'Odds and Ends'","note":null,"file":"MSC-NL-1960-12.pdf","imgs":["1960-12-1.jpg","1960-12-2.jpg","1960-12-3.jpg","1960-12-4.jpg"],"pages":["- a? q) Se Honthly Sulletin of the Merconi. S:iling Club. } ‘ Vol.4.No.12”” SeisS SFiWeGorrett. Hon.Sec. December 1960 Editors Comments. & Due to &@ number of circumst-nees this issue is 3 trifle .late in going to press for which =2nologies are expressed. It is trusted that all neni n enjoyable time during the festive season and the comnlimets of the New Year are con- vered to everyone. Sailing Working dys will still be 5 feature during the winter pro- gramme. Much remeins to be done on \"Mangu\". : It is noted that the protective cap is missing from the meins supply socket on the gangway, it has obviously been wrenched from the securing ch:in. P ng replacement the socket (vhich maybe alive) has been protected by a canves cover. Other than during normal weekend club times the vessel is never left connvcted to the shore supply. Members are reminded that. no interference with the ship's equipment, or muy unauthorised connection. to the mains supply is permitted... In the case of the electri¢ supply-a pro- tective trip system is installed ashore, and as we have no direct secess to this point, operation oi this trip could be very incon- venient at times. 5 Donations to the 'float' fund appesr to have virtuslly ‘dried up!. .We have collected and paid for one float to date, £7-10-0. A similar sum is needed to clear this trov SOOM et What about it! : Social Sunday 15th January Tonking Party \"WAMGU\". The following leéturcs and soci-1 evcnts.have been arranged. All lectures ae Marconi College, Arbour Lane. 7.30 P.M. Winter Lectures & Films. 1961. 12th Jan. ( nesiues. B/W él. on ‘Seamanship ‘& Dinghy Mainte-
