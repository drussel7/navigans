otal darkness. When you con “under these conditions, try % fishermen's bond! ) \"Barnacle\""]},{"year":1961,"month":1,"no":"1","vol":5,"when":"January 1961","span":null,"contents":"Mamgu working days, boat show summary, 'Stability'","note":null,"file":"MSC-NL-1961-01.pdf","imgs":["1961-01-1.jpg","1961-01-2.jpg"],"pages":["\\ NAVIGANS? Monthly News Sheet of the Marconi Sailing Club. M.A.5.C. Editor. F.W.Garrett. Hon. Sec. Vol. 5. No.l. January 1961. ' Editors Comments. \"Mamgu\" and working days. There appears to be many misconceptions about _ the true aspect of club working days during the off season. The main purpose is to put in order and maintain the club facilities at a mimimum cost without having to resort to expensive professional assistance. There will be certain items to which we will have neither the time, skill, or experience to cope, and this is when we would have to spend the money. Labour charges are the highest factor in shipyard work. Bearing in mind that our prime function is as a sailing club we can, nevertheless attend to our creative comforts as well. The club provides the material and the money,( on a very slender budget) and a disservice is done to those individuals who give of their time and skill in this work by taking it for granted , or that the job is someone else's 'pigeon', or we keep a permanent 'cinderella'. We do our best within our limited resources, it takes time, and cracks about \"dirty old barge\", or ropey dinghy park facilities do not help. Those who think this way should ask themselves the obvious question. Proposed dates for working are February 5th and 19th, March 5th and 19th, April 9th, May 7th. Proposals for a junior membership scheme by Mr.Adamson will be detailed next month. The Big Show. \"Its real water, Dad, Grandma's blowing bubbles\" said one of Giles! Awful Children. There were real yachts too, of a range to suit every man's taste and pocket, but perhaps not at the same time. All kinds of rigging, for crew as well as for ships, were on show. Was not the house of Gossard mentioned by the fashion commentator?. The first two yachts in the Single-handed Transatlantic Race were present. While \"Gipsy Moth TTI\" is quite conventional and one may feel that the captain is more remarkable than the ship, Col.Hasler's inventive genius in \"Jester\" is clear for all to see. & very important but little publicised event is the acceptance by Lloyd's of fibreglass boats ror full classification. Stebbings (Burnham) had two attractive examples. Among the dinghies the \"Wineglass\" is worth considering by those seeking a high performance yet \"family\" dinghy that never needs fitting out. Jack Holt's \"YW Keel Boat\" is a new approach to the \"Dragon replacement! problem. She can be regarded as a sealed-up \"Enterprise! but I doubt if she can find a comparable mass market . Sound second-hand \"Dragons\" are cheaper and better, and will last longer. The \"Audacity\" four berth cruiser was well tested last season, and David Giles shows no sign of strain from his three month cruise. Although her price has risen, she remains the best velue of the sound bilge cruisers. Those who can put up with hard-chine will like the three berth \"Leeward\" at about £450 (with Terylene sails). No - the model in the bikini is not included in the specification of that sumptuous motor yacht. You must provide your ow. AMA.","wd \"NAVIGANS} STASILITY. by Barnacle. miate is probably more muddled cuubine abouta boats' stability than about anything else concerning boats. It has been said that the twin drop keels, ( in one design of cruisers ) gave her double the stability, fortunately, it was not stated of what the stability was doubled. Also, many people consider that outside ballast gives more stability than inside. Both statements have some elements of truth, but both are such vague generalities as to be almost meaningless. There is one thing, and one thing only that determines. a boats stability, and that is the relationship between its centre of gravity and centre of ‘buoyancy. If this reletionship is the same for two boats of equal weight at equal angles of heel, then the boats are equally stable, whether they have one or twenty drop keels, whether the ballast is lead, iron, concrete or shingle and whether it is outside, in the bilges or half way up the mast. The stability of a boat can and does vary a great deal according to the - angle of heel. Many racing have very little stability at small angles of heel, ‘but once they begin to dip their deck edge their stability increases rapidily, whereas boats like dinghies have a high initial stability, but lose it as they heel until they finally become unstable and capsize. The various classes of catamarens provide some fine examples of this type of behaviour. ~~ On a cruiser, the stability of a given hull at any angle of heel up to that at which the deck touches the water can be increased only. by lowering the centre of gravity, which can be most easily achieved by replacing iron and inside ballast with lead hung below the keel. An equally stable hull of different form can be designed, with inside ballast, by changing the lines such that at a given angle of heel the centre of buoyancy is higher up the hull. The stability of a boat at a small angle of heel has a great effect on its performance in rough water, and it is not generally a good thing to aim for a high initial stabil-ty achieved by using a hull form where the position of the centre of buoyancy moves rapidily as the angle of heel changes, as such a boat ‘will roll with every passing wave, straining its mast and rigging, whereas a boat which relies on a low centre of gravity for its stability will remain fairly steady. At greater angles of heel stability can be readily increased by increasing the freeboard. Although this raises the centre of gravity slightly, it raises the position of the centre of buoyancy by greater amount, but when applying a high freeboard to achieve good ultimate stability, a very careful eye must be kept on. the effects at small angles of heel of raising the centre of gravity, as it is quite possible to achieve negative stability at angles of about twenty degrees. Once a boat heels over so far as to get. water’on deck, the position of “the centre of buoyshey may well be lowered with increasing angle of heel, so good freeboard will help greatly by increasing the angle to which a boat must heel before water comes on deck. On watching an ocean race, the two most noticeable features of the more modern boats are their higa freeboard and the simplicity of their rigging and deck pndaees Many people think that raising and lowering a boats. eoutreplate will have a great effect, but not much, as. will readily be appreciated when it is realised that even on a lightly built boat with a heavy plate its weight is rarely more than about a tenth of. the total all up weight, and:its centre of gravity moves through only about thirty to thirty three inches, so anes the centre of gravity of the whole boat is lowered by only a few inches.’ All calculations concerning. stability. can be rendered virtually meaningless by the effects of waves, and it is quite possible for an \"uncapsizeable boat to be turned upside down by unusual waves, as happened to Voss, Wray, Miles Smeaton and doubtless to many others. The only thing which can be stated is that should a theoretically uncapsizeable boat, i.e. one which has positive stability at all angles of heel, be upset by the seas, she will eventually turn right way up again, provided she has not sunk first. ="]},{"year":1961,"month":2,"no":"2 & 3","vol":5,"when":"February–March 1961","span":"February–March","contents":"Appeal for help with Navigans, social, junior membership proposals, 1961 ratings, 'Free Board', balance sheet","note":null,"file":"MSC-NL-1961-02.pdf","imgs":["1961-02-1.jpg","1961-02-2.jpg","1961-02-3.jpg","1961-02-4.jpg","1961-02-5.jpg","1961-02-6.jpg"],"pages":["\"NAVIGANS\" Monthly Bulletin of the MarconiSailingClub. M.A,25.Ce S. Editor. F.W.Garrett. Hon, Secretary. Vole 5 Nots 2&3. 00 February/March 1961. Editors Comment. Due to the recent indisposition of your Editor this issue covers two months. In order to lighten his duties your Secretary may have to be relieved of the responsibility for producing this bulletin. The task involves the collecting, editing, and psparing copy; arranging for stencilling, checking, and up to 200 copies, stapling and distribution. Any member who would be willing or feels that he or she can undertake this task, with assistance if necessary, please contact the Secretary. If figures are available in time from the M.A.S.C. the balance sheet for 19.0 will be attached. : The accounts show a very healthy position, and indicate the great strides being made by the club. Much remains to be done to make the future secure, and a solid attraction. Your officers use every artifice to provide more facilities and money for the club to meet future expansion. So don't shoot the band, they are doing their best! Subscriptions! We are nearing the.opening of the season , and a considerable number of subscriptions for 1961 are still outstanding. Some small accounts are still outstanding for 1960. In respect of the \"Float\" fund only approx. £1 has been subscribed so far to the second float. When agreeing to purchase these very useful items, it was considered that 120 members out of approx. 160 at 2/6d ver. head would clear the bill. As some members have given more than 2/6a I would appeal to those members who have not contributed to do so; we all make use of them. | An article by Stan Adamson on Junior membership is included in this issue. These are the authors views and do not necessarily represent the policy of the club. They however give food for thought, what do you think?. If you have any point you wish to bring forward for discussion, or comment to make, send them to the editor for publication. (Look out Barnacle!) \\* H e races will be started in this order at five minute intervals. The first starting at the ‘advertised time in programme. There will be no race if there are less than three starters so please join in the fun and support the races whenever possible. Those in the slow menagerie category may like to know that special short courses have been arrenged for then. The two One design classes will have twelve point races ( six to count)for trophies. . The menagerie classes will also have twelve races, a small prize will be given for each race.","FREE BOARD. BY NBARNACTEN Last month I dealt briefly with the effect of freeboard on stability, end this month I propose to consider a few more aspects of this controversial topic, A sailing boat of given size must displace a given amount of water, and her weight must equal that of the water displaced. Almost all conventionally built boats have to be ballasted down to their marks, and the lighter the hull can be incorporated in.the ballast, thus giving greater stability and driving power. One way of keeping hull weight down is to keen the hull as small as, possible for a given displacement, and since the length and breadth of the hull above water cannot be altered, this means keeping down the freeboard. This low freeboard gives an added bonus in that windage is also reduced, but it has very many snags. Accommodation below will be reduced, and at more than slight angles of heel the deck edge will be under water, and there will be the added drag of the rigging cutting through the water sléwing the boat down. Also any weight of water on deck is liable to find its way below. and designers of modern offshore racers are giving ample freeboard to keep their boats as dry as possible. The extre windage is of little account as it is still small compared with the sail area, and is often masked by the waves, The conventional sheerline owes its origin to two factors, the difficulties of building other shapes, and the uses to which the boats were put. Primitive man's hollow treetrunks and basket work coracles, had flat sheerlines, but as’ soon as boats began to be built with plenks, the conventional sheer resulted, since it is virtually impossible to get any worthwhile beam into a boat without finishing uo with a hollow sheer, for otherwise the planks yy would be impracticably broad in the centre and narrow at the ends. The when boats were used for commercial purposes, the hollow sheer had its uses. The high bow was needed to keep the seas off the deck, and a high stern to keep out following waves, but amidships the deck was low to facilitate .cargo handling, and to keep the weight of the guns as low as possible, Later, the fishing boats from which our present day yachts are descended had a high bow so they could lie safely to their gear during rough weather, and low freeboard amidships so the nets could be hauled over the bulwarks. The present day designer, able to build his hulls ofa single sheet of moulded plywood or fibreglass can readily produce any sheerline he wishes, and he has not got to worry about keeping guns low or the difficulties of hauling a ton of fish over the side, so he has a free hand to produce the sheerline of greatest benefit to the yachtsman. A first essential is to keep the seas orf the deck as much as possible, and since it is usually in the vicinity of the chain plates that the heaviest water comes aboard, due to the difficulty ‘of sailing a-boat any closer into true running seas, it is there that the greatest freeboard will be needed. The stem must be kept to a reasonable height, but the stern can be lower, as long experience has shown thata boat with bad lines aft will be lieble to be pooped in a following sea, and that to keen the water of the deck the stern would have to be impracticably high, so the current - trend is. to keep the stern small, to offer the least resistance to the impact of a following sea.These requirements have resulted in the \"yowder horn\" sheer of the MK.2 sillhoutte and the reverse sheer of the \"Debutante\"; both very practical sheerlines offering the best chances ofa dry deck, together with the worthwhile bonus of more room below. Another bonus is that the overfll strength of the hull is increased as the curve of the deck is in opposition to that of the keel, and the hull is better able to resist the sagging strains of heavy seas breaking on deck. Many people have some very peculiar ideas about reverse sheer, ond imagine that it makes a boat more liable to bary its bows. When sailing a Debutante heeled at over it certainly looks as if she is going to bury her bows, as the weather deck edge slopes down to the stem head at a very odd angle, but in fact she has quite a high stem and is less likely to bury her bows than a small cruiser of similar size and more orthodox design. Another great advantage of reverse sheer is that water which finds its way onto the foredeck tends to rum off over the sides instead of all running aft and trying to flood the cockpit. The difference in comfort between reverse and conventional sheer is most noticeable if you ever hapoen to be to leeward ofa couple of otherwise similar boats going well in a good breeze - I had it brought home to me when I noticed a Buchanan designed boat, I think it was a Yeoman, beating up off Bradwell with ‘water swilling along both side decks and the erew all huddled in the cockoit, whilst on a Helen of Troy class boat with its foot or more extra freeboard the owmers wife or daughter was lying in the sun on the lee side deck, although both boats were heeled to about the same angle. Wave tops licked the covering board of the Heien of Troy, but she kept her deck dry, and making due allowance for the difference in size seemed to be going every bit as well as the Yeoman. IBarnacle\"!","°*92OLT “=oO2L (7Ss0euT940tg (sosreyo °*9TV °+v97T #“SE0Y€ s,ArseqsourodexgeoytprumgecdsagpoIteaMrLOeFg, +“pgos *°suot0y6dOtzoTsqng \"“sJeoTOsetops:,egq sSywnyzod-ot#rudeTog4enTyqg ide of the launching ramp has been fitted with fibre- matting to enable a more secure footing to be obtained on the ramp face. Its life will depend upca the treatment it receives and a stiff broom is available w~ for cleaning down. \"Avril! \"Avril\" is now available for hire. The new flat rates approved by the committee are 10/- per tide, or 15/-~ per day and £5.0.0d per week. Bookings can be made with Mr.B.Goulden, New Street, Broadcasting, Tel. Int.649. Ext. 147. Only a copy of these bookings will be kept on board \"Mamgu\"' as reference. If you make a booking you will be responsible for payment unless at least 24 hours notice of cancellation is received, to enable another booking to be made. The Rescue Launch. Every effort is being made to get the rescue launch in working order by Whitsun. Volunteers to help are urgently needed. Please contact Jack.Bigden. Tuning - up Race. Owing to bad weather and rather a poor response it was decided to postpone the tuning-up race on Baster Sunday to the following day. Those who did in fact turn up on Sunday and were on the line included \"Rainbow\" (Mr.E.A.Payne), Kool Kat (B.Partridge), Kiora (N.Tovey), Muggs (P.Harris) and C,.Mansfield in a Gull. Credit is due to them for having made the effort to have been fitted~out and been ready for the season's activities on time. E.A.P. Monday proved an even worse day, but Kool Kat (B.Partridge) and \"Lollipop\" (A.Pratt) had a scratch race supervised by M. Cheyney. Other racing results as follows:- ist points Race:~ ist. P.Harris (Muggs) F.W. 150 and. B.Partridge (Kool Kat) E. 4389 3rd N.Tovey (Kiora) E. 2353 4th T.Holloway E. 1581 Officer of Day. P.Goulden 2nd Points Race:- lst. ?.Harris (Muggs) ~ F.W. 150 and. B.Partridge (Kool Kat) E.4389 3rd. A.Pratt (Lollipop) F.W. 380 Ath. N. Tovey (Kiore) E. 2353 5th. T.Holloway E, 1581 Officer of Day. A.Adams. Cont'd Page 2.","Page 2. 3rd Points Race:- B.Partridge (Wrong-Gourse) ) T.Holloway (Capsized) ) Retired. ans N. Tovey (75 Mark ) ) Officer of Day. S.Adamson. Ath Points Race:- lst. P.Harris (Muggs) F.W- 150 and. ‘A.Pratt (Lollipop) F.W. 380 3rd. S.Adamson (Logodo) FW. 137 Officer of Day. N.Tovey. Let's have a really good number of entries for all races, and particularly remember the Mud Trophy which will be held on Whit’ Saturday May 20th at 4.00 p.m. Block racing fees (£1) for those that wish to pay this way should be in as soo as possible. Social. Fitting-out Supper. . Didn't it rain! rain! rain? well, if it did, and thus prevent the film show from being held on the deck of \"Mamgu\", it didn't dampen the party spirit of the Fitting-out Supper on the 22nd April, and in fact it was a highly successful evening. About 70 guests, mainly members of the Club, enjoyed an entertaining programme of colour films, ranging from the activities of the English Electric Valve Company, in which our Sailing Secretary featured prominently, to the surf boatmen of Ghana, with Canadian Sailing thrown in for godéd measure! Daye Parkinson kindly lent us the projector. A gay accompaniment to the.excellent refreshments was provided by the “Remo's\", a local Skiffle group at Heybridge. A bottle of whisky was raffled and Fred Garrett was the owner of the lucky ticket. Our warm thenks go to the Social Secretary, Jack Bigden, and all concerned for a very happy evening. Picnic Cruise to Osea. - At a meeting last year there were many requests that more should be done for non-racing members, therefore your Sailing Secretary has included more cruises in the programme. The next of these will be a picnic cruise to Osea on Whit-Monday May 22nd, leaving \"Mamgu!! at 8.30 a.m. We hope that as mang people as possible will take part, and in order to organise it most efficiently, would those that wish to come on the cruise please contact me, Phil.Luke, (Physics Section, Baddow) ~ Tel. Int. 296. Ext. 227. Home Tel. Gt.sBaddow 486.), letting me know:- ~ aby) he If you havé a boat and can take passengers. 2.) Whether you possess a car and would be willing to give a lift to members on your way to Heybridge. PL. Gala Day. We are pabticipating in the Gala Day on July 8th and hope to have five boats on show. We are also running a Treasure Hunt Chart and anybody willing to assist please see the Hon.Sec. F.W.Garrett. News and Views. M. A. S. CG. At the annual general meeting of the M.A.S.C., held at the club on Friday, April 28th, F.W.Garrett, our Hon.Sec/Treasurer was elected Vice-President, having been proposed by E.A.Payne and seconded by F.W.Collins, and carried unanimously our congratulations to \"Fred! on this very well deserved honovr. E.A.P. Thames Sailing Barge. Information has been received giving details of the cruises that can be arranged in the Thames Sailing barge \"Memory\". Basically the idea is to take parties or groups of individuals for a few days sailing in the Blackwater Estuary Cont'd Page 3.","Page 3. a ‘Visitors are asked to provide their own food and prepare it. Calor gas cookers are fitted, and the main hold is divided into dormitories. The cost is 30/- per day per person. Will anyone interested or who would like more details please contact Doug. Rowland, Broadcasting Division, Room 441, Marconi House Tel. Int. 435. Ext. 359. D.Rowland. For Sale and Mart. Y¥.W. Heron (Classed 1459) Terylene Sails, buoyancy, oars, cover, two life jackets, and road trailer. All in good condition. Price £110 complete. Apply: - : 42, Second Avenue, Chelmsford. BEAM. By \"Barnacle\". Having briefly discussed freeboard, let us now consider a few aspects of that other controversial dimension, beam. Many British yachtsmyen seem to consider that the beam of a boat should be kept as low as possible, and they are to be seen sailing with their boats heeled over at absurd angles in the lightest of winds, or sitting below without room to stretch their legs. They are prepared to put up with these discomforts because a reduction in beam means a reduction in wetted area and their boat will be faster (or so they hope). In fact this is not true, as many American yachts have shown by beating the best British designs, boat for boat, in offshore races. Two of the reasons for this success are their greater initial stiffness, which enables better use of their sail area to be made, and their less violent motion which results in less crew fatigue on a long race. Also on the current handicap formula a moderate beam will help to reduce a boats rating, and certain designers are at last beginning to take advantage of this. One reason for the popularity of the \"plank on edge\" in this country was the use of the Thames Measurement formula to assess a boats rating. Since this formula uses beam squared as a multiplying factor it was obviously highly desirable to keep beam as low as possible. The tonnage given by this formula rises steadily as beam varies between| about a quarter and a half the length, but once the beam exceeds threequarters of - the length, the tonnage drops off rapidly until a circular vessel achieves a Thames~ tonnage of zero; ~ very handy for avoiding harbour dues, but of little other value! - In fact, if yo really want to baffle harbour masters, build yourself a boat whose beam is greater than its length, then they'll have to pay you to moor it in their harbours as it will have a large negative Thames Tonnage. (But mind they don't charge you on your register tonnage, which will be considerable!) This most peculiar tonnage rule, with its evil effect on design, was copied from the rule for ass&essing a merchant ships tonnage, i.e. the number of tons of wine she could carry. At the time this rule was evolved most ships were of very similar form, so simple measurements of length, beam and depth, with a constant correction factor for Nhull form, gave quite accurate results. Then it was noticed that the depth was usually about half the beam, and since it was awkward to measure depth, as the hold had to be cleared, half the beam was substituted in the formula. This was the signal for depth to increase and beam to decrease. On a cruising boat, good beam gives good initial stiffness, and more room below decks. On a beamy boat it is often possible to decrease headroom quite considerably without making the boat seem cramped, as the only time headroom is of value is when you want to stand upright, and when sailing it is usually impossible to do this anyway, whereas it is very pleasant to be able to sit down and stretch ones legs out full length. Not only does greater beam usually give a stiffer hull more capable of standing up to its canvas, italso gives a wider base for the rigging, thus reducing stresses in the mast and shrouds and enabling the boat to carry its canvas longer in a blow. Colin Archer exploited this to the full, and many people are convinced that boats of his design, or that general tyne, are the finest in the world. The impression of solidity and safeness one feels on their incredibly broad decks has to be experienced to be believed. Now that the Americans have so clearly pointed the way, many of our best designers are using greater beam, and the modern racing cruiser can also be a comfortable roomy floating home. \"Barnacle\""]},{"year":1961,"month":5,"no":"5","vol":5,"when":"May 1961","span":null,"contents":"Floodboards, rescue launch, the Pennant Race, team race against Ariel SC, Mud Trophy, Marconi Challenge Cup, Enterprise open at Maylandsea, camping weekend, 'Tonnage and Accommodation'","note":null,"file":"MSC-NL-1961-05.pdf","imgs":["1961-05-1.jpg","1961-05-2.jpg","1961-05-3.jpg","1961-05-4.jpg","1961-05-5.jpg","1961-05-6.jpg"],"pages":["s \"NAVIGANS\" Monthly Bulletin of the liarconi Seiling Club. ii.A.S.C. Editor: Daphne Tovey. Vol.5. Issue 5. May, 1961. Secretary's Comments. Floodboards. With the advent of a new season, members are reminded once again that the insertion and locking of the dinghy park floodboards at the end of sailing for the day is a legal responsibility imposed on the club, and our indemity insurance also hinges on this point, Don't leave it to the next man, there may not be one, if you are last, lock up. The key must be kept at all times on the notice board in the saloon. The club floodboards are also our responsibility and must be inserted at the end of the day, up to at least the third board, during the season. PWG The prize for the most thoughtless act of the month goes to the person who has taken the new nylon rope which was attached to the Mamgu life belt. Does anyone know anything about it ? Rescue Launch. Now that the Rescue Launch has been purchased and its overhaul is nearing completion, arrangements must be made to ensure it is used in an effective manner. To that end therefore, the committee is asking for volunteers to form a body of boatmen to operate the launch. A erew would consist normally of two, or possibly three, men including the coxswain and there would be several crews in the body. The launch would come strictly under the order of the Officer of the Day and would be operated as he sees fit. Although on fine, sunny days the duty would consist of a nice, gentle amble round the racing course, behind those dinghies participating, on rough days the work could well be both difficult and uncomfortable. It is felt, therefore, that some training will be required in handling the launch. This will be laid on. Will any member who feels that he would like to become a member of this body of boatmen, please get in touch with one of the following:- Commodore - T.W. Hallam. Baddow Research. Tel, Ext. 338 Int. 358 Sailing Sec. - B. Partridge. Baddow Research. Tel. 29 Int. 280 5. Adamson - Central Division, New Street. Ext. 607 J. Bigden - Machine Shop, New Street. Ext. 627 T.W.H. Sailing The Pennant Race The race which was held on May 6th was sailed in such strong winds that few boats could stay upright. The three brave starters weres— E. Payne in \"Rainbow\", P. Harris in \"Muggs\" F.W.150 and P. Wheeler in his \"Enterprise\", supervised by B. Partridge as Officer of the Day. \"Rainbow\" under nothing but a heavily reefed mainsail was the only boat to complete the course. Team Race against the Aricl S.C. A very enjoyable day was spent at Teddington on Sunday, May 7th, when we raced against the Ariel Sailing Club of the B.B.C. A fresh breeze provided plenty of excitement, causing several capsizes, but our team was hopelessly outsailed by the B.B.C., who were up to all the dodges of the river and knew where most to expect the gusts. The results were as followss- ist Race 2nd Race Total 24% 214 45% Ariel 5.C. 33 M.S.C. 15 18 Cont'd Page 2.","2. Page These results compare very closely with those obtained during our E visit last year. Generous hospitality was, as usual, provided by the Ariel S.C. and we look forward to the return match when they are duc to visit us at Heybridge on Sunday, September 10th (not, by-the-way, as erroniously stated in the Sailing Programme, on August 27th). Great credit is due to our Sailing Secretary, Brian Partridge, for having organised the outing so successfully and both to him and Nick Tov-~ for having trailed their Enterprises all that way in order to make up the requisite number of boats. B.A.P. MudTrophy Due to heavy winds, the Mud Trophy has been postponed until July 29th at 1.30 p.m. Another change, the team race versus the Osea Sailing Club has been postponed to a later date still to be decided. M.B.Y.C. Team Race, Heybridge. It was a calm, almost windless, morning and the Maylandsea Bay team, especially the Fleetwinds, had difficulty in getting to \"Mamgu\" on time, and for this reason the Enterprises began their first race ahead of the Fleetwinds. Our Enterprise team consisted of B. Partridge in \"Kool Kat\" N. Tovey in \"Kiora\" D. Percy. ty : We sailed Course 5, out to North Double, and almost from the start the Maylandsea team showed their superior sailing skill. B, Partridge did well to come 2rd. WN. Tovey finished 5th and D. Percy 6th. Our Fleetwind team wass- A. Pratt in \"Lollipop\" S. Adamson in \"Logodo\". K. Bazeley in. \"Lion\" ‘ Under a freshening wind they finished 3rd, fifth and sixth respectively. ' The second race for both classes was run simultaneously over Course A. Two of our Enterprises hit other boats and two of our Fleetwinds, and the Maylandsea Bay erack helmsman J. Bovis, hit the Herring Point mark, Of our two finishers, K. Bazeley came 3rd in his Fleetwind and NN. TONEY also came 3rd for the Enterprises. The final points were:— Maylandsea Bay Y.C. 90 pts. M.S.C. 63 r Marconi Challenge Cup. os _ This is being held on June 18th at 3.0 p.m. It is one of the Club's Open events and’ we hope it will be well supported by our own members as w2]1 as outsiders, Enterprise Open Team Race at Maylandsea, Mey 27th and 28th. Our team in this event consisted of B, Partridge P, Hsrris with D. Farthing crewing in his own boat. N. Tovey. Saturday's race wag a series of misfortunes for us against Broxbourne Sailing Club, Herts. At one time we appeared to be in the lead but then the toe-s seep in P. Harris's boat broke, depositing him in the water. He and his crew managed to right themselves, and sailed on. The next lap we were lying Ist, 2nd and 6th, but then B. Partridge's tiller extension broke, which seriously hampered him on the beat, and he dropped back to 4th position. Finally we finished 2nd, 4th and 6th and had to admit defeat to our very friendly opponents. Next day we sailed against the two losing teams of the other Saturde- race, on-a- course which took us out to the Doctor buoy. This time Cont'd Page 3.","Page 3. B. Partridge had a stone stuck in the centre-board casing of his boat, which delayed him until well efter the starting gun. About 100 yards from the finishing line N. Tovey capsized and finished last, behind P, Harris and B. Partridge. It was all good experience if not particularly successful! Overall winners were Burnham, closely followed by Broxbourne, Some Dates for your Diary, The Essex Schools Association are n was held on Sunday “ay 7th, cot- prising one boat withxen ferins ai Julian Bigden who.ventured to Csee,. Un- fortunetely they hed to be towed back due to stecriug trouble, evertheless they bad an enjoyable doy, aid ere to be congratuleted on upholding the sailing ,rogroemme. , eT ode Second cnic Cruise. Take 50 membe.s end friends, distribute as evenly as possible between 16 posts, add generous quantities of sun and what is the result? The result was seen on “hit Monday in the form of the second ,icnic cruise of the season to Oses. It was gratifying to see such a good turn-out of wembers, sufficient enough evidence of the popularity of these cruises. ast of the tide was 1 ‘Mamgu' the last bots were leaving with its pt to non-existent wind meant slow progress dovm to Gsea but a fair tide wade rowing or .addling an easy task. The galley facilities were soon functioni ng and it vas not long before the first “prew-up! was under way. Soon after the turn of the tide a reasonebl> breeze sprang up and some sailing between a and Stone enjoyed. During the aftemoon we were joined by our Commodore and his family who had been cruising down-river in 'Carolyn'. Cont'd Page 4.","Page 4. All too soon it was time to leave for the retum to Heybridge. With a fair breeze this time there was no trouble getting pack and the last boats arrived just before high water. : When interviewed, the youngest wewber of the party, 8-month-old Kerry _ Sims, said she had enjoyed herself very much and could she come on the next cruises I think that went for everyone else too. PL Camping ‘Weekend. The wext item in the cruising srogramme is the camping week-end on June 24-25th. This is intended for those who would like something a little more ambitious than ¢ day picnic cruise and who want to extend their kmowledge of local cruising waters. I hore that as many people as possible will want to go on the cruise, but that they will bear in mind the possibility of adverse yeather conditions and be prepared either to do some hard sailing, or even to leave their boats somewhere dovm-river should conditions warrant it. at don't want to sound too off-putting but it is only seamanlik e to be prepared for bad weather and to be realistic ebout the limitations of oneself, one's erew and one's bost. The yenue for the camp will probably be at the east end of Mersea Island, at the mouth of the Pyefleet Chamel, just opposite Brightlingsea. This part has a good shingle beach and landing is possible at all states of the tides the channel runs roughly NE to SY and so is sheltered from Y and SW winds. I will be going down to Hersea to ensure that water is laid on and to see what sites are available. Anyone who wants to go will have to find his om tent as yell os sleeping and cooking equipment and food, but should anyone be in any — difficulty please let me know and I will endeavour to help out. I would strongly recomend the use of extre-long tent-pegs, since the site is certain to be of a sandy neture, For those who have never camped before a few pointers may be in order. Probably the greatest worry of campers~to—be concerns sleeping comfort, and requirements vary in this respect. Youngsters should be quite happy with blankets made up into a bag, using blanket pins or large, strong safety pins, with, of course, a waterproof ground sheet undermeeth. On the type of ground that we will find on Mersea it should be easy enough to excavete in the right pleces and meke a surprisingly comfortuble bed. I usually sleep this way when camping and I find it warmer than a camp bed. where a uattress, or several blanket thicknesses, «re needed underneath to keep one warm. For older folk I imegine a good sleeping bag on an eir~bed would be hard-to bect, although I have never tried an air-bed myself. In all cases a good ground-sheet is a must. In order to give some further infor- metion on camping I will leave some copies of 'Camping and Outdoor Life! and 3 how-to-do-it booklet on camping in the saloon of 'Mamgu' for those interested ns ‘Will those interested in going on the cruise please contact me, Phil Luke, Physics Sec., Beddow,'phone internal 286, external 227 and at hone Gt. Baddow 486. Let me kmow assoon as possible so that arrangements can be wode well in advance. Any queries after 16th June should go to Jack Bigden, Machine Shop Office New St., extension 627. Open Day. As June 3rd coincided: with the holidays of some of our officials directly concermed with the organisation of Open Day, it was agreed to hold it on July end. Please try to keep 'Mamgu' verticulerly clean and ship-shape for this oceaeion. Besides the Ladies! Cu_, other events will be organised during the efternoon. Marconi Sailing Club Dance. This will be held on Gala Day, July Sth, at the Lion and Lamb Ballroom, with dencing from 8.0 p.in. to midnight to the dance orchestra of the Duke of ellington's Ligtt Infantry. Master of Ceremonies will be Don Lake. Tic-ets, 7/6 each, iriclude buffet, and can be obtained froms- Miss O. Marchant Baddow, Room 20A Jack Bigden, Mechine Shop, New St. The dance is being run purely as a social event, not for profit, and the tickets will be strictly limited to 400. Cont'd page 5.","by \"Barnacle\" Archaic Rule though it is, the Thames Measurement Tonnage still gives a fairly good idee of a cruiser's potential eccommodation, «t leest for the smaller sizes of bot. Since the aft measuring point is the aft side of the rudder post, it conveniently ignores any Wa a\" snace in a long counter; it takes no Gi scecount of depth, which in eny normel boct. does not greatly cffect the number of zeople who can cruise in reasonable cowfort, and it res no allowance for ch-rt space, bosun's stores etc., which often reduce register tonnage to an ebeurdly low figure. Displacement ton: guide et all, when a wo=berth Bleck a five-berth, class 2 ocean recer! Before considering us be quits clesr whet \"accomodetion\" ally mecns. A boet which is going to do sny cruisin t all must offer bun 6 feet 6 inches long it least twenty inches ¥ » possibly tapering in at the foot, for each person; a gelley with at least two burners cepable f ted: sed whilst the bont is sailing or rolling in a not too sheltered anchorage, and a flat surfice et leas oot squere on which to prepare meals; a flat surface on which charts can be and a decently installed toilet. Only when a dot has all these features c e be said to have \"accommodétion \\ TM, for so many ,eople\". imy well-designed cruiser offering \"full accomuode tion\" «' hou:d heve a r nent chart nA ich does not form a general working surface, and a toilet shut off in ; ertment. Adequete storage space for lamps, werps, spare geer, clothes, food end drinking water are obviously essential on any cruiser. Unless the boat is extremely bluff in the bows, it is not possible to get comforteble bunks within three feet of the stem, nor can they go within two feet of the rudder—post unless the cockpit is far too fer aft and excessively cr After all it is hardly fair to call a boat a six-berth eruiser if only two people into the cockpit. Quarter berths or other partially \"buried\" heve full sitting headroom over at least two feet of their length. From these requirements it is obvious that twenty to twenty-one fect overall length (or length to the rudder post) is the minimum into which four berths can be squeezed, with the toilet unscreened and a \"bare minimum\" galley, using two quarter berths, midships galley, and two settees running up into the bows. Any reasonably-proportioned t.enty-footer is going to be about 3 tons Thames, and boats below this size cen offer accommod: tion for two only. A sevarate compertment for the toilet needs another two to three feet on the length, putting us in the 4-5 ton class. Five bunks can be fitted into twenty-seven feet, using two quater berths, golley opposite chart table, two settee berths, end toilet and pipe cot in the fo'c'sle. By now we are in the 7-ton range, and a trifle cramped. The extr: space needed to get a second pipe cot into the fo'c'sle expands our boat into a ten-tonner, unless we put the toilet opposite the lley (a very bed place for it, as a1ybody who has experienced this arrangement will know) and use a folding chert table over the foot of a settee. Above about twelve tons, beam end depth heve increased to the size where one can contemplate a erimanent bunk behind a settee back, or a pipe cot hung above a settee, it is no longer possible to generalise about size and accomodation. Note that these figures ave minimum sizes for a given amount of accommods.tion aid not avera; Boats as large as twenty tons often offer accommodation for only three or four (but very spacious accomodation!) Sowe designers try :nd cheat by offering such tricks as chart tables folding down over the head of a quarter berth rendering the berth unusable, and galle.s consisting of a single primus in a box under the bridge deck, or, even worse, a two-burner calor-gas stove screved to a bul'thead. If only those designers could be compelled to spend « wet, stormy month aboard their creations with a full crew of fairly sensitive strangers! The supply of \"gall cruisers\" «ould almost completely cease! Cont'd page 6.","26a Boats which are very nerrow for their length usually have ends which ‘ are too fine to offer any reasonable accommodation, ard very beamy boats, although being more spacious generally, camot contain any more bunks than a boat of conventional proportions, so both a Fife racer and a Colin. Archer will offer rsduced accommodation for their tonnage. Bearing in mind these exceptionsywe can say up to three tons, two berths; three to three~and-a~ half tons, three verths; four to six tons, four berths; seven to nine tons, five berths; andton tons, six berths. \"Bammecle\"."]},{"year":1961,"month":6,"no":"6","vol":5,"when":"June 1961","span":null,"contents":"Club Flattie, Marconi Cruiser Cup, Fleetwind East Coast Area Championship, the Potted Pilot, f a running mooring it is secured to only one of the lines, so that it ean be hauled in when required, i.e. it is tied to the knot. BAP. Marconi Cruiser Cup. The race for the Marconi Cruiser Cup was sailed on Sunday June 4th, with nine boats crossing the starting line of Osea Pier. Considering the almost complete lack of wind, and what little there was being dead ahead, only three boats managed to save their tide at Stone, where the bend in the river brought the wind a little more free. The west, 'Flame' (G.Mill), ‘Escape’ (S.Poulton), ‘Rainbow! (B,A.Payne), ‘Karolin' (T.W.Hallam) 'Philowel! (T.Tulk) and 'Sea Mynx', perforce retired after a prolonged struggle. Great credit is due to those three boats who managed to finish the course, which was:- Osea ~ Mersea —- Bradwell — Osea. First home was ‘Nancy! (R. Bye) who completed the course in about five hours, followed by ‘Merry Maid! (K.Parker) and 'Nebula' (Mr. Woods).","on (Dims Final results on corrected time were:~ lst NEBULA lr. Woods - Maldon Little Ship Club. 2nd NANCY Ronnie Bye -— Maylandsea Bay Yacht Club, 3rd MERRY MAID - Ken Parker -- Maylandsea Bay Y.C. Our thanks ere due to iir. Bill Lenderyou of the Maldon Little Ship Club, who at short notice acted as Officer of the Day and Starter from the motor yacht 'Success'. T.W, Hallam. Fleetwind East Coast Area Championships. Marconi Sailing Club were entrusted with these championships this year, and they were sailed off at Heybridge on June LOth/i1th. Winds were SUly, Fresh to Strong on both days and multi-lap courses within Hilly Pool buoy were consequently used. A fleet of nine boats entered, M.S.C. being well represerited,with four competitors. Close contests were fought for many of the overall positions, but in particular for the first three. At the start of the final heat, J. Bovis, M.B.Y.C,, P. Harris, S.C., and T. Clabburn, ¥. & F.Y.C(Walton & Frinton Yacht Club) were within two points. As each heliusman could discard one \\t result, all depended on this last race. They came in in the order shown above and this was also the overall placing. The trophies were graciously presented by Mrs. Hallen. Other Marconi results were:~ 4th A.R. Pratt Tth S. Adamson Sth Xk. Bazeley (cotton sails). The Officer of the Day for both Saturday and Sunday was Terry Hallam, assisted in a most efficient manner by Vice Coniswodore Arthur Adams, Eric Cottam and Dave Farthing, I would like to take this opportunity of thanking also all the others who gave so willingly of their time on the deck, on the beach, and in the galley to make this meeting so pleasant for a 11 the competitors. AR. Ps (ae Team Race versus Maldon Little Ship Club. This event was sailed at Heybridge on June 17th, and there were high hopes of a Marconi victory, the first in team events this season. ‘The team entered was:- N. Tovey in Kiora E 2353 P, Harris in Iuges FW 150 A. Pratt in Lollipop Fi 380 Unfortunately Kiora was holed near the waterline 'luffing to a puff! just before the ten-minute gun, and B. Partridge (KoolKat) gallantly made a very hurried substitution. Conditions were rather blustery, Force 4-5 SWly, and the teams wore sent away on Course 4 (Black Deep) twice round. Right at the start the fleet seperated into pairs in the classic team-racing manver, with a Marconi bo:t 'up' in each pair. At the first mark luges was well in the lead from the M.L.S.C. Enterprise, Pratt and Partridge being close together ;hird and fourth. However on the first run back dovm the Club reach your reporter capsized, gybing close aboard an opponent, and hid to retire. The final results were computed separately for the two classes, P, Harris being first Fleetwind home, and B. Partridge second Enterprise. M.L.S.C. won on aggregate with 1Sz points to Marconi's 17¢ pts. A notable feature of this event was the superior close-windedness of the Fleetwinds over Enterprises in these conditions, P, Harris bringing liuggs home several lengths ahead of the best Enterprise. A.R.P.","% Qur open race for dinghy classes supperted, twenty- ight boats coming to the line. Tateias came from both Maldon clubs ia from Stone Sailing Club, as w turm-—out of Marconi boats. Conditions were good, th a moderate westerly breeze. A Vemile course was set, extending up Southey Creeks the fastest posts completed it in only one hour, twenty minutes, and most boats finished in less than two hours The first boct home, and eventual winner, was Hornet 603 from ron Yacht Club, sailed by last year's winner. Pster Harris in F.W.150 'Muggs' was tt successful Marconi entrant, finishing seventh on corrected time. -Resul 1. Hornet 603 E. Soaues. C. 5332 secs : (corrected time). 2. Snipe 8304 L. Lancaster N.Y.C.5472 secs. 3. Osprey ll. HeJ. Tribe §.S.C. 5519 secs. Social. The first cempingsruising week-end wes held on 24th-25th June at East Mersea. Altogether enteen people went, sowe of them by road, The boats that went were 'Avrilt, 'Melody', 'Andromeda', 'Venture', and'Kerolin', On the Saturday, afte rival and setting-up camp, we were pleased to accept the invitation ofa Youth Ho tel Associa tion group, who were also camping nearby,to join “them at their cemp fire that evening. & very pleasent evening was spent in their company. Sunday moming wes spent svimaing and sunb thing until the time came to strike camp and return home. The south-west wind necessitated a long bect back, and variable luck was experienced with the wind, a Mamgu at 1.0 the lest bost arriving In gencral a good time was had by all and enough perience was gained to uake it worth while running ry similer week-end. Our thanks 2 due to uany people for the success of the week-end; to Mir. and lirs. Spence who kindly allowed us to drew on their water supply ad,lib., to vence who allowed the use of his land for i our camping site, lst Widford Guide Company, and the 9th Chelusford Scout Troop, for the loan of valuable ena ae to cine for constructing an excellent one-holer, to Robbie Sins who, in fact did most of the organising, and finally to all those who supported the event. P.G.T P.Gobe The next picnic cruise will be on August 20th. Venue as yet undecided, Dates for your Diary. 167 th July. The team race versus Osea Sailing$lub will begin at “1.30 Deities the second Pennant rece will therefore be held later in the afternoon, probab round 3.45 peitle Sunday. The Blackwotex and Colne Dinghy Championship reoni SailingSlub at Stone Sailing P There will be tifteen classas two hundred dinghies teking part. return team race against the BBC at Heybridge will a held on 27th August as in theRacing Programme, not 10th Septenbes as stuted in the last issue of 'Navigans'. Owing to holidays the next issue of Wevigens' will be a bumper Ju August edition, coming out in mid-August.","News and Views. Madam, The appearance of my own name (albeit wrongly spelt!) in your Mey issue under \"Social\", provides a convenient opportunity to offer a contribution to your correspondence colum. Firstly, I must thenk P, Luke for his kindly euphemistic description of our \"steering trouble\", Bet.een ourselves, the rudder broke clean off during the stiff beat home, and was last seen floating happily towards the North Sea. (I wonder where it is now ~ the rudder I mean). The immediate result of this mishap (euphemism agein) was a somewhat sharp discussion between crew and helmsman on the abilities or otherwise cf Mr. Percy Blandford as a designer of small craft! It was indeed an enjoyable, and highly instructive day, but in view of the ignominious menner of Hispaniola's retum to Heybridge, her owner feels that in future a discreet veil should be drawn over the first 1961 picnic cruise! In a more serious vein, I am glad to see that we have now been reminded of the obvious fact that the practice of bringing cars ajong the track to the dinghy park is liable to bring the club into local disrepute (it is also likely to encourage non-club members to do the same and to use our facilities). I know that the Secretary's comments have already touched on the metter of the floodboards, but could we please have a clear rule that the first man to unlock the floodboards should return the key and the lock to the notice-board on Mamgu es soon as the boards have been unlocked, the last man to return taking both from the notice~board, locking the boards end returning the \\:ey to iamgu. In this way, key and lock will always be together in a safe place when the boards are open. Would the Committee consider and comment please? In closing, may I emphasize the value of 'Navigans', particularly to associate members lie myself. Yours etc., a Ken Beavins. (We apologise for the mis-spelling of names, ve imagine Ken Beavins has not been the only one} If we are getting your name or address wrong we would be very pleased to be corrected! D.T.) Seale and Mart. Outboard motor. Only ten hours running since new. Viking 3-clutch model. £40. Apply:- Maldon Seiling Centre, 42 London Road, Maldon. Potted Pilot. By T.W. Hallam. Introduction. If, as has been said, Navigation is an exact science, then Filotage may I think be truly classified as an Art. Its aim is to enable the intrepid mariner (that's you,) in your vessel, (that's your little ol! tore-out) to sail in safety from point to point around our coasts and estuaries. There have been, of course, a number of excellent books written about the subject,from Homer's Odyssey to the North Sea Pilot Book, Part IV of England, Borwick to the North Foreland). (Hast Coast Most of these however have been written with the assumption that the user's vessel is 2 300-Ton full-rigged ship, drawing up to eighteen feet. In view of this it is not surprising that pilot books tend to be the gloomies t books written since the Book of Job. Even those very excellent books written specifically for yachtsmen,","-5- such as Jack Coote's Fast Coast Rivers and Commander Irving's Yachtsman's Guide to the Thames Estuary, have in mind yachts with a draft up to eight feet or thereabouts. The fantastic increase in the last ten years in the number of small boats, and dinghies, draviing at the most three feet, has I think created a demand for Sailing Instructions of quite a different nature. Many long, and in some cases dengerous, passages for e small boat can be shortened and made sefer by us ing short cuts prohibited to the larger cruisers. It is with this in mind that the writer will try over the next few months to compose a series of articles on pilotage specifically for the owners of the suallest class of vessel. Normally each article will divide into two parts, tle first part being a discussion on pilotage as a general subject, and the second part a specific set of Sailing Instructipns for a particular part of the cou.st, river or harbour, A note of yaming howevergy on no account should the sketch charts accompanying the Sailing Instructions be used for navigational purposes. Alweys use proper charts. Tools of the Trade. These may be a3 simpie or as elabor:te as the desires of the pilot might dictate. First in importance comes the lead line. This consists essentially of a length of well~stretched line with a lead weight at one end and a nuniber of marks along the length to indicate depth. The old-time professional seaman's lead line was long, twenty fathoms, and was marked in a logicesl, although at first sight rather bewildering system, using pieces of leather and bunting. For our purpose 2 five fathom length would be ample, with a weight of about three pounds, and marked in fathoms (every six feet to you, mates) by means of mots; one for one fathom, two knots apaced an inch apart for two fathoms, three for three fathoms and so on. I actually use one knot again for five fathoms on the assumpti on that I can tell even on a dark night the diffcrence between six feet and thirty feet of line. Don't put the lmots too far apart or you might make a mistake one dark and dirty night. Here, having got you thoroughl y tangled up in thirty-odd feet of vecalcitrant line, is where we sor, like the old-fashioned movie serial, \"CONTINUED NEXT MOb he .oeeSHE CHART AND DESCRIPTION ON PAGE SIX. oecsee","-§- A SHORT ROUTE FRO: We Mi RSEA TO BRIGHTLINGSEA To avoid going the long way pound the Bench Head Buoy (Black Conical) when sailing from W. Mersea o r Bradwell to Brightlingsea, the following short cut can be used. Taking the Nass Beacon off W. Mer sea as the point of departure, head due Hast for 1 mile, when a Green Beacon surmounted by a Triangle will be seen. This marks a wreck and should be left to port sbout forty yards. Continuing on the same course for 2 miles, a Green Conical Wreck Buoy is taken as the nex t mark. Give this a fairly wide berth, at least two hundred yards >» and leave to port. From here there are two alternative courses 5 For vessels drawing onl; foot or two or if the tide is not eppr coaching low water, alter course to 52° idegnetic end head for No. & Por + Hand Red Cen Buoy in the River Colne. Alter course up the Colne bet ween the lines of Port Hand Red Can Buoys and Starboard Hand Black Con: ical Buoys. Should however the tide be low or the vessel draw more th an two feet, continue from the Green Conical Wreck Buoy along the sam e course of Magnetic to the Inner Bench Head-Red Can Buoy with L t-Flashing Red and thence up the Colne. Except for the area around the Wr eck Buoy k:own as the Coccum Hills one might expect to find not less than three fect at any state of the tide, When the Colne River Navigational Buoys do. not become approachin confused with a row rether no: ndescript buoys running out to a of small White Conical Buoy wear the Inuer Benc h Head, These are Fishery Buoys laid down by Colchester Corporetion an d mark the limit of the Oyster Grounds. (ADL. CHART No. 1975, IRAYS YA -S RIES, or ihe LINGSER HORDE thE wy + ewen. -","KJ et Ph sae BELANCE By \"Barnacle\". The balance of a boat is most important, and yet it is a subject on which one finds a surprisingly wide variety of different views, many of apparently equal merit. The first essential is that the hull should be balanced, i.e. that on heeling she should keep a straight course. Endeavours to fulfil this requirement have led to some terrible hull shaves. Obviously = cylindrical hull will be so balanced, put is hardly likely to make a successful boat, whereas a boat with fairly flat floors and a very broad stern ought to be violently unbal- anced, but this does not always prove to be the case. One of the simplest methods of getting a rough ides of a hull's balance is to check the fore-and-aft p.sition of the centre of buoyancy et various angles of heel. Any great movement of the centre of buoyancy will indicate lack of balance. Theories such as the balanced diagonal theory and Admiral Turner's Hetacentric Shelf Theory are both invoked in the design steges, the former usually with ereat success. The latter is not much in evidence these days, as it does not always result in a good hull design. Disposition of inside ballast will also affect a boat's balance, and quite often moving a few hundredweight of iron will tum a hard- mouthed brute of a boat into an easily-handled vessel, with a consid~ erable increase in speed. This increase in'speed is due to the fact that a well-balanced hull needs little cr no helm to keep her on course, chereas.an unbalanced hull which is always trying to turn, often requires @ considerable helm angle to hcld her, and this helm angle greatly increases the forward resistance of the boat. Once a nicely~halanced hull has been achieved, the sail plan must also be balanced, and it is here that theory and practice diverge hope— lessly. The centre of lateral resistance of the hull is easily found, as is the centre of effort of the seil plan with all sails sheeted-in flat to the centre~line of the boat, It is generally accepted that this centre of effort should be forward of the centre of lateral resistance, but there is no guide to how far forward. One very nicely balanced five-tonner ( a very well-known design) has the two centres coincident, whilst one of the leading Hast Coast designers always aims a getting the centre of effort twenty-five per cent of the waterline length for- yard of the centre of lateral resistance, and his boats also balance very well. When one looks down on 2 boat beeting to windward, the centre of effort must be forward of the C.L.R., since it swings forward and outward as the sails set off the centre-line, and it also moves to leeward as the boat heels over. This weans two turning couples are acting, one tending to cause the boet to luff, and the other opposing this tendency. Unfortunately theory leaves us floundering et this point, as there are too many variable factors involved, but most designers manage to produce the desired result. All the designer's hard work can be rendered useless by careless sail- trimming, and one often finds old boats with modified rigs which balance very bedly indeed, One pitfall here is the fitting of longer bowsprits end larcer headsails on hard-mouthed boats, the theory being that since the boat is always trying to turm head to wind the greater sail area forward of the mast will blow her head off. This is all very well con- sidered statically with the b upright, but all too often when sailing heeled the extra sail area forward depresses tie bow, producing even worse weather heln. If you own a beat with bad ther helm, it is often possible to cure it by spending a week-end shifting ballast and playing with the headsails. Another source of lack of balance is a hole in the rudder or deadwood. A badly designed propellor installaticn can utterly ruin a boet's perform—- ance, and this is the reason why so many designers prefer to mount aux- ilieries on one querter, where they function nearly es well as a central engine, without affecting the boat's sailing performance. An added bonus is that it is easier to get at the propellor to clear weeds or fouled-up ropes. \"UBARNWACLE\""]},{"year":1961,"month":7,"no":"7 & 8","vol":5,"when":"July–August 1961","span":"July–August","contents":"Obituary of F. W. Garrett, open day, greasy pole, Blackwater and Colne Dinghy Championship results, Mud Trophy, Pilots Cup, Mona's Cup, Blackwater Regatta, Krohn Cup, entrance to Bradwell Creek, 'Hull Construction'","note":null,"file":"MSC-NL-1961-07.pdf","imgs":["1961-07-01.jpg","1961-07-02.jpg","1961-07-03.jpg","1961-07-04.jpg","1961-07-05.jpg","1961-07-06.jpg","1961-07-07.jpg","1961-07-08.jpg","1961-07-09.jpg","1961-07-10.jpg"],"pages":["Monthly Bulletin of the Marconi Sailing Club MA S.C. Editor: Daphne Tovey 2 Vol. 5. Issues 7 & 8 July/August 1961 Obituary: FB. VM. Carrott All members of the Sailing Section will mourn the loss of their very good friend \"Fred'' who died on August 18th after a short illness. He worked untiringly for the Section for many years, as Ship's Husband, and during the last three years has been Secretary/Treasurer. Until this year he edited and produced \"Navigans\" as well. The responsibility of the conversion of \"Mamgu\" from a dilapidated old barge yacht to the Club House she is today was largely his, and he successfully conducted the prolonged end difficult negotiations for the agreement with the proprietors of the dinghy park, and its subsequent extensions, with great patience and perseverance. The connection of the water and electric supplies to the Club headquarters on the barge \"Mamgu'' were due to his initiative His friendly nature and close contact with the Committee of the M.A.S.C., of which he was a Vice-President, ensured that the interests of the Sailing Section were always given close consideration. When latterly As he acquired his own yacht \"Melody\" he generously placed it at the disposal of members who did not own their own craft 7 BA.P./T.W.H, \"Robbie\" Sims has kindly offered to act as Secretary until the end of the year. His home address is - \"Fairneyknowe\", Rignals Lane, Galleywood, Chelmsford. Tel. Chelmsford 72140 Work - Room 267 Baddow. Tel. Chelmsford 3255 Ext. 59 Contributions for \"Navigans\" can be given to:- Nick Tovey : Room 100E Baddow Tel. Chelmsford 3255 Ext. 323 or our home address iss- \"Hornbeams\", 44 Priory Road, Bicknacre Tel. Danbury 2318 One of the last acts of our late Secretary, whose untimely death all of us who knew him feel acutely, was to send out nearly 50 subscription reminders - and that was in August! Please could I have these subscriptions as soon as possible with the reminder notice. If you don't wish to rejoin please return just the notice. RFS SAILING I am concerned at the large number of people who, when bringing boats up the ramp, particularly when using the winch, allow helpers to push from behind. It is amazing that they cannot see the possibility of the Cont'd Page 2","Page 2 rope breaking and the boat running backwards rapidly. The slipperiness of the ramp would make it difficult for the pushers to jump clear, anda really serious injury could result. : Stan Adamson end July Open Day Owing to gusty weather the Ladies' Race was postponed and will now be held on September 10th at 2.0 p.m., after the 10th Points Race. The Greasy Pole event wes von by Peter Darney, and out of six entries for the Sweepstake Race, Peter Harris came lst in \"Muggs\", F.W. 1505 Alan Pratt 2nd in \"Lollipop\" F.. 380; and Brian Partridge 3rd in \"Kool Kat\" B. 4369. 16th July Osea S.C. Team Race The two teams sailed for ar imposing cup kindly presented by Osea S.C. The race was sailed in Enterprises and the Marconi team took the first three places. Shortly after the start one of the Osea 8.C. team was forced to retire. The return match will be held on the 17th September at 3.30 pm. This was.followed by the 2nd Pennant Race in which the Osea S.C. took part. Out of a total of 15 entries lst came P. Harris in F.W. 150; 2nd B. Partridge in B.4389 and 3rd P. Darney in \"Melody\"; 4th W.F. Gould in a Graduate \"Jennie\" and 5th P. Wheeler in E.495. 23rd July Blackwa and Col most ‘e important rule, does not read at all well. ‘whilst I can offer no better altcrnative wording, I would a concern ed to study it well and see if it does in fact state clearly 1 it Y ded to convey. I feel brevity could well be sacrificcd for clarity here. John A. Scarlett Maldon Little Ship Club PIS Hr. Sims informs me that it was not his intention to suppress all alternative opinions, etc., until the A.G The rules as published wiil be tried out until then. Constructive criticism and suggestions will be welenne. If published in \"Navigans\", all members can consider them before a decision 18 taken at the A.@ iM. Cont'd Page oseeee ra","by T. W. Hallam The Lead Line (Cont'd) You will remomber I suggested last month that the lead line should be well stretched. This is most important, not only for stability of measurenent but also, and of rather more importance, so that the line will coil easily. Most people have } idence of tryi to coil up a yiece of new rope. It is like f tha constrictor, in the end one is lucky to come out of the contest unh: ed. The addition of he knots to the lead line just makes the whole thing more intractable vressing for a momont, and ignoring the bloke who just shouted \"keep to the point\" the casicst way to coil up a new rope is to chuck the whole coil overboard, hanging on of course to the bitter end, and coil up as it is pulled in, taking the twists out as they ar over the rail To coil up one ond in the left hand, slide the right hand along the rope, straightening it as you go, elmost to arms length, then bring that length of rope in the form of a coil back to the left hand giving the rope a twist in the direction of the lay of the strands. Transfer from right hand to left and carry on. You will find thet the twist is done most easily between the thumb and first fingor of the right hand as it moves back bic eaataad “ae left. This will give coils of equal size and of about twenty inches diameter. To stretch the lead line before marking, tie one end to a fixed eeeand pull on the other with a tackle. en it is taut drench it with water. Keep it in that state for a few hours, then let it dry tightening the tacklo as it slackens Another and rather easier way is to tie a bucket on one end, make the other ond fust to the boat, chuck the bucket overboard, end tow it on. the end of the line for a few hours. A much easier type of line to handle, and one which is much more disinclined to tangle is the round sennit or plaited line. You know the sort of line Mum hangs her clots on in the garden. This is not, however, easily obtained in small sizes Yhen Hot in usc, keep the lead line coiled down in a box in the cockpit or for under a thwart. This will ensurc that when you want it in a hell of a hurry, as you usually do, it is aveilable and you don't have to spend five minutes untangling it. Another uy way is to carry it wound between two cleats a couple of feet apart. On my ovwm boat it is kept wound on a kevil or long cleat about two fect long fastened through the stanchions inside the rail. There is it out of the way yet constantly available. : Now how to use the lead linc. This is always good for a laugh! We read of the leadsman in the old time ship-of--the-line standing in the chains and swinging the lead round his head in ever increasing circles like a sort of Ouglan rd in reverse ,car, tt s it go to fly forward, the lead, that is to say, not the leadsman into +} ! r, the line sliding through his fingers until bottom reached wh ereupon he would chant \"By the Mark Nine\" or somc such romark. Remombering that the lead must have weighed thing up to ten pounds or mo: I often wonder what he chanted when he forgot to let go. I bet even in Hornblower laughcd!! No, 1 your way of using the lead will be a much more ae aa although in a small boat still with distinct possibilities as a mirth-maker. For that, howev vil by low cunnin,; fulfilled in a meandering wey my stint you will have to wait until NEXT OMTtE (Gis:) By then I might have succeeded in coiling up my new lead line. )","The Entrance To Bradwell Creek This has always had a somewhat justifiable reputation for difficulty, although once mown it is comparatively simple, Sailing Directions given in most pilot books are now however somewhat in error due to the erection of the Nuclear Power Station, Some marks have been removed and other replaced, Approaching from the west, keep parallel to Pewit Islant and well out, about half a mile from the island, This means at the present time you will be passing quite close to the ships which lie in the river, Keep on this line until about two hundred vards west of the Power Station cofferdam barrier wall, This is a most unmistakable object which resembles a pier and lies about a quarter of a mile east of the entrance, Turn south and head towards the shore. When in line with and about two hundred yards from the west end of the barrier wall a square wooden post will be seen in a south westerly direction, distance about two hundred yards, This post, which carries water temperature monitoring equipment for the Power Station, is on and near the end of the spit which runs in a north easterly direction from the eastern end of Pewit Island, Head for a point due east of, and thirty yards from, this post. From this point turn and sail towards the post in a westerly direction keeping south of the post and passing it close to, about eight to ten yards, From here on the southern and eastern side of the spit which is quite steep to, is marked by withies, The channel is narrow and is most shallow at the outer end, Follow the withies in, keeping them to starboard and very close, a few yards, on no account straying to the south and east of them, The mud flat extending from shore between tre Power Station and the navigable channel of the creek is extensive and dries out six feet above L.W, Ordinary Spring Tides, As the channel turns towards the south a pair of leading marks will be seen on the sea illotson for Associate members. (359 Baddow Road, Great Baddow, or c/o The Halifax Building Soc., 71 Duke Street, Chelmsford) M.8.C. versus the Ariel S.C (B.B.C.) at Heybridge on 27th August With a team of four Enterprises each side, the two races were sailed under perfect conditions Alan Woolford (3.3.C.) as usual gave a spectacular performance and undoubtedly the best team won. The 3B.3.C. team nobly brought their four boats all the way from Teddington, and it proved to be a most enjoyable day. Results:~ ist Race 2nd Race = Total Ariel $.c 36 4 314 618 M.S.C. 23 29 52 9th Points Race — September 2nd This points race was notable for the fact that such a large number of boats took part, eight in all. Perhaps this was due to the time it took place - 6.15 in the evening? The course,which was sailed between Herring Point, Black Deep and Hilly Pool twice, ended in thickening mist. Results:— Enterprises 1. B. Partridge E. 4389 2. P. Wheeler E.495 3. WN. Tovey B. 2353 4. D. Perey E. 4304 5. D. Bolwell E. 7052 Cont'd on Page 2","Page 2 Menagerie Class 1. B. Tillotson \"Solaster\" (5.937) 2 xk. Hutchins \"Felix\" 12! National Retired . Baker “Bluebell Gull 555. Poin ts 10th Race ~ September Three Fleetwinds and three Enterprises took part in gusty winds with the results as follows ~— Pleetwinds Enterprises 1. P. Harris F.W.150 1. B. Partridge E.4389 2. A. Pratt FB. 380 2. P. ‘heeler B. 495 3 J. Littlewood F.%.137 3. D. Farthing B. 893 This was followed by the Ladies Cup in which Miss J. Fairbains was first in \"Ginger Snap\" #.893, second Miss A. Kwasieborski in “Ariadne\", and third was lirs. D. A. Rowland in \"Pina\", Gull 118. The 11th Points Race was cancelled due to heavy winds. M S.C, versus Osea S.C. - September 17th The Osea Sailing Club very kindly lent us three Graduates in which to sail off the event, and our helmsmen were pleased to have the experience of sailins boats of a different class. Conditions turned out to be very light, and on occasions the tide caused erations Fortunately no harm was done, but it indicates that cruising members of the club have need vf the rescue launch as well as racing members, and that the role of the rescue launch on picnic cruises should be clearly defined. On the whole I think that the cruises and the camping week-end have been very successful: this is entirely due to the enthusiasm of members. I apologise for any shortcomings on my part in the organisation of the cruises, and I hope that I may be permitted to try and improve on this next season. If you have had any bright ideas for cruises or any criticism whatsoever, PLEASE let either myself or the Committee know so that something can be done. P. G. Luke Children's \"Laying-up Party\" We propose to hold a \"Laying-up Party\" for the children of members,un board 'Mamgu\" on Saturday October 14th 1961. I am sure the children will look forward to this, their own party. In order to cater would you please write or telephone and let us know whether you wish to have tickets. Ages 2 years - 12 years old. ‘We would appreciate it if mummies could supply a jelly or small cake, we will supply the rest, films, etc , etc. O. M, Marchant, Baddow. A. S. Bigden, New Street. Annual \"Laying-up Supper\" - 10th 0 Our annual \"Laying-up “Eaupenil is due to be held on Friday 10th November 1961 at 7 o.m in the Palm Court of Marconi Works, Chelmsford. We should like to extend a hearty welcome to our members who wish to join us on this occasion andwe can assure them of a very enjoyable evening with an excellent dinner followed by dancing to the Duke of Wellington's Regt. Dance Orchestra. Due to catering staff difficulties, tickets are to be limited to 200, so to avoid disappointment please order your tickets now. Price will be 15/- per person. Checks or postal orders should be made payable to the Marconi Athletic & Social Club. When making application for tickets please state names and as to whether applicants are employed by Marconi Company, as we have to submit
