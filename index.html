s the line running through it. Fingers are extremely sensitive instruments, and can detect even in deep water this thump and the slight slacking of tension in the line as the lead hits the bottom You will now be able to read off the depth either visually or by feel from the knots, which will be in the region of either wielding or holding hand Coil up the line again retrieving it as quickly as you can and make another cast. This brings us face to face with a cardinal truth. Unless at anchor one sounding is utterly useless. Two or three at least are required, preferably more. One sounding merely tells you the depth of the water over that one particular pimple or depression on which the lead has landed. A number will give you the trend of the soundings; whether the water is becoming shallower or deeper, and whether this change in depth is fast or slow, thus indicating a steep or shallow change in the contours of the sea bottom. The lead line as a pilotage instrument can be used in a number of ways. Perhaps the most obvious is to give adequate warning of the time to go about when tacking near the shore. Another way is to use the lead as a blind man uses a stick, tapping along a kerb. At night, or in fog, when sailing on a river or estuary, one can sail towards a known bank until in say a couple of fathoms, then follow the two fathoms line along, feeling ones way with the lead. The existence of a spit or a swatch will be apparent, thus giving by reference to the chart an indication of ones position; but more of this later on in the series when we consider the technique of pilotage proper. The lead line is probably the most useful and certainly the cheapest tool of the pilots trade. I+ is also unfortunately the least used by most yachtsmen. This is probably due to the fact that using it is possibly the quickest way of getting water up ones sleeve. The amount of water brought on board by the lead line as it is retrieved is almost unbelieveable. A few casts and ones hands and sleeves are soaking, no fun in the winter There is another implement which can be used for depth sounding, the possession of which in days sone by was the hall mark of the Bast Coast yachtsman, the sounding pole. This, a light wood or bamboo pole between six and twelve feet long, marked off in feet by alternate white and black bands, would be displayed proudly in the rigging, stamping the owner as 2 genuine hairy chested ditch crawler Its use had its lighter moments too. The sight of old Charlie trying desperately to get into Bradwell Creek at Cont'd on page 6","wa ay tg o yo oO on a cuarter to closing time on a Saturday evening, wielding pole like a demented drum-major vas usually sufficient to clear the public bar of the Green Man Although the sounding pole has largely fallen into disuse now- I am sure that a shorter version, say five feet long, would be if g@ more useful to the dinghy, or os light craft cruiser, owners. It could be used single handed easier than the lead and could double as a boat-hook or a spinnaker pole. This month's Sailing Instructions deal + stretch of water on your ovm doorstep. You probably !mow this diecees. you do not you oussht to. From Osea Pier the channel hand (red cans) and is a single red can buoy known as \"Clarks\" . Up to this the channel is quite clearly marked. From here on however it is somewhat obscure. The following instructions will give you the best of at water there is Cross over from \"Clarks\" buoy to the Mill Beach side to a point ww opposite the first beach hut after Decoy Point. Take a line bet his beach hut and the first beach hut to the souhof the Blackwater Sailing Club. Sail along this line as far as Hilly Pool Point Buoy (red can), round this buoy leaving it to port and sail on a line between there and the “arconi Sailing Club Distance a large yellow buoy off the clubhouse, keeping well outside it, say tw vperds. This course will sive you about three feet more water than sailing straight up the centre of the nel and will enable you to miss in particular the large hill between Hilly Pool spit and Vill Beach. war AL ee Fe ‘a, BEACH HUTS LER a te — ae Witity es 0 = e —_ S Noein fh Fe “poubn IRS Seutn~ a","- 2 HULLCONSTRUCTION by \"Barnacle! Last month we dealt with three methods of planking a round bilge hull with solid wood. First, this month, let us look at clinker-ply, or glued clinker. This is an elegant way of producing a light, strong dinghy, and has most of the advantages and disadvantages of normal clinker. Since the plywood strakes have adequate transverse strength, it requires no ribs, but this great advantage is offset by the fact that all seams are glued, producing a rigid hull which is more liable to be cracked. For a boat which is to give any real service, all strakes should be rivetted es well as glued, since it is an unfortunate fact that the modern resin glues do not always behave the same way on a boat immersed in sea water as they do immersed in a laboratory beaker. For rapid production of light, shapely yacht tenders this method is just about ideal. Next in the possible methods of producing a round bilge hull we can consider wooden moulding. This can be many layers of thin veneers bonded to form a single sheet of shaped plywood, or two or three skins laid at angles (I am lumping such constructions as vee root, slim strake and double diayonal under the heading of moulded hulls). At first sight these methods seem very well suited to amateur construction, but a little further consideration shows that there will be nearly as much work in building the moulé as in building a more conventional hull, and then to achieve good results considerably more than a casual acquaintance with modern resin glues is needed One or two skins are not too bad, but the third, fourth and fifth get extremely tedious. Wo, this is a method best left to the factory And what about the result? Strong, light, very shapely, and rigid, ideal for a short term proposition, but perhaps not the thing in which to invest hard earned savings in the expectation of realising your money in ten years time. At this point let me clear up possible misunderstandings about my use of the word rigid. It has been pointed out to me that the topsides of @ glued-strip hull can move in and out as much as those of a carvel hull. Admittedly, but that is NOT what I meant by rigid. They heve no movement at all in the fore and aft direction; the very direction in which movement is essential to give to a pounding from a heavy sea. Old sailormen always swore that Eastwoods brick barges went fastest in a heavy sea when they worked the most, and the Lowestoft and Southwold \"Yolls\" used to carry a saw to cut through the thiarts so their clinker hulls could work even more, when they vanted to get along gvickly in a North Bast gale. Lastly in the round bilge hulls we have fibreglass. This is no proposition for the amateur. A mould involves more work than building a hull by any other method, and then the knowledze of practical chemistry required is considerable if the best results are to be achieved. A fibreglass hull hes most of the advantages and disadvantages of a moulded wooden hull, except that it cannot rot, worits won't eat it, and the topsides need not be painted although the bottom of a cruiser will still need entifoulding. On the other hand ultra violet light will degrade the resin, other ageing effects may occur, and a cheap moulding may delaminate. One is also faced with an unusual surface finish worry, that of one side being beautifully smooth and the other very rough indeed Some firms overcome this by using inner and outer mouldings so all the rough surfaces are hidden One point with regard to fibreglass dinghies - always buy a dinghy with wooden floorboards and thwarts screwed in and not moulded in place. The fibreglass may appear to have a good non-skid surface when dry, but when it gets wet it is about as safe to stand on as a sheet of wet ice, and it is extremely fatiguing rowing a dinghy when one is continually sliding eround on the thwarts. On any fibreglass boat always beware of moulded-in wooden components - these are almost certain to rot very quickly. Some moulders use pieces of wood moulded in place to form a support for a rib in the fibreglass This is frowned on in the better moulding shops, but it is the fibreglass rib that supplies the strength and not the timber, so it is not too serious if the wood does rot. A moulded in keel, gunwale or thwart which rots is a different story. And what if you damage a moulded hull? Some puople may recall a glue advertisement showing a Flying Fifteen that had been run into. The","damage was far more than would have occurred on a planked hull, and Small would be far beyond the repair capabilities of the average amateur. lt, holes can be patched, but on wooden mouldings it is extremely difficulass if not impossible, to restore them to their original condition. Fibregbe offers better hopes of a good reyzir. The patch can nearly always made so it cannot be seen, but there is still a risk of weakness where patch and original join, as it is impossivle to get the actual strands of glass to cross this joint so there must be a difference.in streng at this point. \"Barnacle\" (To be continued)"]},{"year":1961,"month":10,"no":"10","vol":5,"when":"October 1961","span":null,"contents":"Dolphin Trophy, Dyer Cup, children's party, 'Hull Construction 3'","note":null,"file":"MSC-NL-1961-10.pdf","imgs":["1961-10-1.jpg","1961-10-2.jpg","1961-10-3.jpg","1961-10-4.jpg"],"pages":["t Mr &.A.Payne, ! The Leaurels,New Street. \"NAVIGANS\" Monthly »sulletin of the Marconi Sailing Club MA S.C. Editor: Daphne Tovey Vol. 5 Issue 10 Oo October 1961 Editor's Comment As you can see from this issue, contributions to \"Navigans\" are decidedly sparse the winter season is upon us. However don't let us hibernate! How about some new contributors — perhaps some useful tips on laying-up, or notes on home-made gadgets that you have found useful on your boat? We're sure that M.S.C members are not lacking in ingenuity! We apologise for the absence, this month, of the Potted Pilot, but nope to resume this interesting article in the November edition. SAILING Dolphin Trophy In the ual race for cruisers held by the Maylandsea Bay Yacht Club on Sunday September 17th the results, on corrected time, were3— 1. ilomel 7. Tulk Maldon Little Ship Club 2s J. Mills Maldon Little Ship Club 3. B A.Payne Marconi Sailing Club 4 R. Bye Maylandsea Bay Yacht Club M.S.C. versus Malacn Liz ipClub - 30th September This race was sailed from the Maldon Little Ship Club starting line, and the teams consisted of two Fleetwinds and two Enterprises per side. Peter Harris and Alan Pratt sailed Fleetwinds and the two Enterprise helmsmen were Nick Tovey and Peter Wheeler. The latter kindly took part at very short notice. Unfortunately due to a fast dying wind and feding light only one race was able to be sailed, and after some very welcome refreshments we set off, slowly, back to Heybridge before it became too dark. Results: The Enterprises came second and third, thus losing by 1/4 point, Whilst tho Fleotwinis came secord and fourth. Therefore we lost by 2¢ points. 12th Points Race held on Sunday Ist October The last points race of the season wes well supported by Fleetwinds but only one Enterprise took part. The result was as follows:— . Harris sailing \"Muggs\" Pratt in \"Lollipop\" Adamson in \"Logodo\" rgetitor was P. Wheeler - E.495. Dyer Cup The annual race for the Dyer Cup, sponsored by the B.S.C. was held on October &th in brilliant weather with over 100 yachts participating. The winner was J. Stevens of #.5.Y.C. in a Flying Dutchman. Our members were Cont'd on Page 2","placed as follows:- P. Darney in \"Melody\" 29th E A Payne in \"Rainbow\" 47th P. Harris in \"Muggs\" 51st This was our last event of the season and members will now be thinking about laying up their boats for the winter. Es As Bs SOCIAL The Children's Party The children's laying up party was held aboard \"Mamgu\" on Saturday October 14th 1961. Approximately 30 children attended and they assured me they had a wonderful time. I would like to thank the ladies who helped in the galley and also the mummies who helped to provide the food. Special thanks to Uncle Peter Makins for being games master and for bringing his Performing Flea along. The Balloon Race was won by Sarah Darney (on corrected time) with David Rowlands second. A. S. B, Laying-Up Supper and Dance There are still a few tickets available so should you wish to attend please let me know by return, or contact any Committee member. Associate members may write direct to A S. Bigden, 26 Langton Avenue, Chelmsford. Tickets 15/- each inclusive NEWS AND VIEYS Enterprise Fleet No. 82 The Marconi fleet was represented at the National Enterprise Association, Hast Coast Area, committee meeting held at Broxbourne Sailing Club on the 29th October, by Brian Partridge (Fleet Captain) and Nick Tovey (Fleet Secretary). The 1962 Area Championship will be held at Harwich on the last weekend June/July. The area crest for use on stationery, etc., will be the code flag 'H' with E.C.4 superimposed upon it. Notes on the minutes with dates of interest to Enterprise owners will be forwarded to them in due course. SALE AND MART Enterprise No. 1581 - measured Built by Phillcraft of Romford, with Lucas terylene racing sails. - £120 Apply to: T. Holloway, Receiver Test, Section 176, New Street. Telephone: Int. 228 Ext. 29 Cont'd on Page 3","tay Page 3 HULL CONSTRUCTION - 3 To finish off this series let us consider the various chine hulls. These are by no means confined to dinghies and small cruisers, as some quite large hulls are ouilt with chines, including spritsail barges. Building a hard chine hull (single or multi-chine) is usually quick, far quicker then any other method, but it requires more accurate workmanship, and the fairing off of keel, chines and frames is harder than anything met with on a round bilged carvel hull. The hull may be planked and caulked, it may be clinker, or it may be ply skinned. All are somewhat easier and quicker to build than the equivalent round bilge hull, perticularly ply, where the boat is changed from a skeleton to a complete hull ina week vend. Most of the troubles with chine hulls occur in the design stages, as it is possible to bend a flat sheet of normal plywood only into a cylindrical or conical shape. Any compound curvature or twist is not possible. This has fooled many people who imagine that all they have to do to design a hard chine hull is to draw a series of straight sided sections. Alas, nothing could be further from the truth, for the sections, particularly in the bows, are quite well curved, as are the keel and chines. In fact a well designed hard chine hull, skinned with sheet ply, can be nearly as shepely as a planked or moulded hull, whilst costing far less to build. Many people have attempted to \"prove\" that chine hulls are not as good as round bilged hulls, ilst others have wasted just cs much time trying to prove the reverse. In fact each has its advantages and disadvantages, which do not greatly affect the sailing performance of the boat, 4 except in the case of sailing barges oS =) chine hull was where the long decidedly superior to a round bilge. Ply skinned chine hulls do have stress concentrations along the keel, chines and deck edge, but these are not usually likely to cause serious trouble on a well designed hull, whilst clinker and carvel chine hulls behave exactly like round bilge hulls, and are as easy to repair. A plywood skinned chine boat can be restored to its original condition after being holed by replacing the entire ply panel involved, but its life expectation is probably not so good as that of a planked hull, although marine plywood is steadily improving. To summarise, (most difficult) for an amateur built hull wanted quickly; hard chine, plywood skinned. For a hull not wanted quite so quickly, involving less care in building and with the best possible expectation of life; round bilge carvel. For small dinghies; clinker ply, and for a light, long lasting hull requiring that bit more care in building; normal clinker. For those rich types who can afford to buy a new racing boat whenever they want to; a moulded hull, either ply or fibreglass \"Barnacle\""]},{"year":1961,"month":11,"no":"11","vol":5,"when":"November 1961","span":null,"contents":"Laying-up supper, the Potted Pilot part 4, the entrance to Brightlingsea Harbour, 'What is Her Value?', facility survey","note":null,"file":"MSC-NL-1961-11.pdf","imgs":["1961-11-01.jpg","1961-11-02.jpg","1961-11-03.jpg","1961-11-04.jpg","1961-11-05.jpg","1961-11-06.jpg","1961-11-07.jpg","1961-11-08.jpg","1961-11-09.jpg","1961-11-10.jpg"],"pages":["Mr B.A.Payne, : ~ @ The Laurels,New Street. \"NAVIGANS\" Monthly bulletin of Marconi Sailing Club, MoASC. Editor: Daphne Tovey Vol. 5 Issue 1l November 1961, The Annual General Meeting will be held in the Marconi College, Arbour Lane, Chelmsford, commencing at 7.45 pem. sharp, on Thursday 30th November 1961. This meeting, for many reasons, will be very important to the future of the Club; indeed, as a result of increased membership we have reached a turning pOLnt, Because of this we implore you all to turn “up and lend your voice to the discussions on topics like the Club's future, Rules, etc. The final agenda will be publicised shortly. Yours sincerely, RoE. Sims. Hon.Secretaryo SAILING I would like to remind all members who may be building, buying or otherwise acquiring boats during this winter, that the adopted one designs for the club are Flestwinds and tnterprises. Although other boats are welcome, members shovld bear in mind that the club one designs are particularly suitable for the types of dinghy sailing, and the sailing conditions that apply to our club. Furthermore, it should be appreci- ated that the bigger the flects of one design boats, the more fun and companionship one is likely to enjoy both in racing and general activities. I have also been asked to notify members that there is a certain amount of space still available with the Little Ship Construction Association at Margaretting for the building of either Fleetwinds or Enterprises. Be Par .tridge. Rear Commodore. SOCIAL Laying Up Supper - 1961 A crowd of about 200 were present in the Palm Court on November llth at the Club's annual Laying Up Supper, Guests of Honour were Admiral Sir John Haton and Lady Hateon. Other clubs on the Blackwater as far as Tollesbury were represented by their present Commodores on the top table, and on the centre table our Vice President Mr. H.A. Payne had as guests a fine assortment of retired Commodores from our neighbouring clubs. : Contd.on Page 2","Page 2 Terry Hallam, our Commodore for the year, introduced the guests anc mentioned the fine spirit of neighbourliness between the clubs and thanked all clubs for their co-operation during tne year, in particular Stone Sailing Club for the use of their facilities and assistance given on the occasion of the Blackwater and Colne Dinghy Championsiip. He concluded with a warning to our members not to take for granted the assistance of other clubs, often so freely offered, before proposing thetoast to the Guests. In his reply Mr. L. Lancaster, Commodore of the Maldon Yacht Club traced the history of our club from its small beginnings to its present flourishing state, complimenting us on our progress and proposing the toast \"the Club\" with best wishes for our future. Sir John Baton, replying on behalf of the Club gave us a bright and breezy glimpse of sailing in the Royal Navy; sailing not for pleasure, but for a purpose with a boatload of beef and spuds, and told us graphically how not to come alongside one of H.M. Battleships, and the awful consequences of'.so doing. Next time we have some ice on the Blackwater, perhaps he will come and give us a demonstration of seal catching the easy ways Then came the prize giving by Lady Baton. One or two new names managed to appear on the list, but it still seems that Peter and Brian have things pretty much their own way in the One Design Races. After the more usual presentations Robbie received a short length ov chain to help secure \"Venture\" and Alan Pratt, as the most immersed helmsman of the year received a pair of water wings. Miss Margaret Linders presented a pouquet to Lady Baton on behalf of the Club. Dinner was followeby d dancing to the Duke of Wellington's Regiment Dance Orchestra, for wiich we were joined by friends from the Dramatic Si ciety, the M.A.35.C. Staff and Canteen Staff. - For the benefit of those who had to leave early, the raffle prizes \\sre won by: Anchor Lamp Derek Thompson Teddy Bear Richard Manning Sherry - Dave Farthing Cider : - Roy Wellstead Beer - Bar Steward and CSéa S.C. Member. ToAcoSe The Potted Pilot by T.W. Hallam of the Trade (continued) Tools Part So far we have been considering methods of depth sounding using equipment that is traditional, and in the main, cheap. There are, however, more esoteric, and more @éxpensive ways of doing the same job. Electronic Depth Sounders, or Hcho Sounders are becoming the fashion nowadays. Priced between £355 and £150, and fitted in some cases with an eudio alarm to tell the pilot when a particular depth is reached, they are undoubtedly Contd. on page","fascinating thi vith. They do the job quite efficiently too, in fect they are probably nearly as good as a weight on the end of a piece of line! They cost a bit more of course, bet no doubt this is off-set by the joy of - with a piece of electronic apparatus. t amount of money to spare I would prefer to spend it on a new dinghy, .r a new mainsail, or even, perish the tnught, to paying my creditors! For those who would be serious about. this matter, however,the Echo Sounder works as follows. An ultra- sonic signal is generated, usually in the range of 20 KC/S to 50 KC/S. This is fed to a transducer fastened to the bottom of the boat. The signel radiated from the transducer is reflected by the sea bottom, the reflected signal being picked up by ths transducer and fed to ths receiver section of the ., Then it is ee time-wise with the transmitter signal. The ed of propagation through wator being arene the time Teg between the transmitter end récsiver signals will give the depth of water. he result of this eomeuieantdion is displayed eithsr on a meter calibrated in fathoms or feet, or on a rotating neon lamp type of display. The advantage of this scquipment is that a continuous visible display of depth is sresented, togsther with, in some cases, an audible warning signal when a pr.-determined depth is reached, thus enabling the helmsman to give more attention to actually sailing t. boat. This is more important perhaps when racing rather than cruising. The disadvantages ars cost, and the maintenance of piece of comparatively complicated elsctronic equipment which by the very nature of the environment in which it lives is bound to add to the normal task of maintaining the boat and its cquipment, We have considered, at some length, means whereby we determine the depth of water in a we are sailing. The next point is to consider t BEL necessary to ensure ral we know in waica direction we ¢ Tae most important of esse is the steering Sama ae, This is an essential part of the boat's equipment. It is, moreover, usually quite expensive and cannot be révlaced sasily, unfortunately, by any contrivance made out of bits of sticks and string. The normal ship's compass has a card which is gruduated in points and half points. There are thirty-two points, cisnt in seach quadrant. Starting at North and going clockwise, those in the North to Bast quadrant ars as follows:- Norvh, N. by &., NN.ote, N.H.by N., NoG., Wied. bo aay Ho Nei vy N , Mast. Those in the other quadran N ins pattern, the cardinal points nging as we swi = throi ; quadrants. A recitation of the full t is known as “boxing the compass\" svery sailing man shculd be able to do instinctively without having to stop and think. Try it after a few pints in the Jolly Sailur. You will probably get it mixed up with that rather improger story about a railway porter. They don't call us rude seamen for nothing! As a full circle is normally divided into 369° and therg are thirty-two points, it foll ws that there are 114° to each point and just over 54° to a half-point. This last, incidentally, is just about the amount of leeway a boat makes when on the wind, and is a common unit of measurement. Contd.on Page 4","The compass must always be of the dead beat variety, the card being damped by a fluid, usually a mixture of alcuhol and distilled water. The undamped or dry card type being completely useless at sea, but more of this next month, : Sailing Instructions| THE ENTRANCS TO BRIGHTLINGS#A ARBOUR In the June issue I gave you sailing instructions for a Short cut across the Mersea Flats to the River Colne. You will rememoer we ended up at No. & Port Hand Buoy (Red Can). A spherical Bucy (Red and White Vertical Stripes with a Red Cross Topmark) marks the end of a flat extending from West Marsh Point on the north side of the entrace to the Harbour. This, ths Fairway Buoy, should be approached vory closely leaving it to port. The main channel of the River Colne is well buoyed, but from No.8 fay’ onwards caré should be taken not to go outside the line of buoys especially on the west side which is very steep to. There .is a‘’least depth of 20ft in this main channel. If the Fairway buoy cannot be identified, a sare line can be taken between No.8 buoy and Batemans Tower, 4 tall tower on a small promontory two hundred yards north of West Marsh Point, until such times as identification, — fe} is certain. Alter course at the fairway buoy to 55 Magnetic to enter the Harbour. A pair of leading marks, boards with Black and White Vertical Stripes are fixed to telegraph poles to the west of a large white shed. At night these are replaced by two fixed red lights. Theres isusually a pair of small buoys or spars to Port (Red) and Starboard (Black) but these may be missing. Theres is frequently a barge moored just in the entrance. Abvut four hundred yards inside the entrance a line of mvored boats commences. Keep the leading marks in line until this line of moorings is reached then follow then — round close to as far as stone Point on the south side. a It is advisazle to anchor between here and the Town Hard on the north side, and consult the Harbour Master if a vacant space cannot be found in which to anchor saiely for any length of time. Altern: tively one can frequently pick up a mooring further down the harbour nearer the entrancc. Warning, When you do anchor, fit it with a tripping line to the head, and buoy it. Tae bed of the harbour is a veritable nest of old moorings and it is easy to get fouled. up. Charts: StanfordSNo. 4 (#ssex Rivers) No. 5 (Thames #stuary) Imrays Y 15 (Colne River - Knoll to Wivenhoe) Admiralty No. 3741. S—","Sa « To Paviou TLING SEA CREEK 7 5 + oe bab ans NVALUE? by \"Barnacle\" What is the value of “our boat? Its true value, not tne exorbitant prices you may have paid for it. This is a very tricky question to answer properly, although in many cases one could reply \"the amount she will fetch in free sale on the open market\" » aowever, dues not apply to boats built f poses, wnose real value may be many times y covld hope to feteh on an opsn market. Let us have a lonk ut some of the factors which help to detsrmine a boats value. Unlike cars, age is of little help, and condition must be taken as the main factor. It is sossibls to find quits good brats, eighty years old, in far better condition than similar forty year olds. The next consideration is the vessel's pedigree; her designer, and racing record. Hers one has to tread warily as some of the best designers have their cuff days, whilst some almost unknown people have dssigned first class boats. If it is a dinghy you are buying, the best guide is the size of the class. The higher the sail numbers the more likely you are to geta quick sale at a good price. Avoid unknown \"ore designs\" like the plague. They may have many brilliant features, but their second hand value will be low because there will be only a limited market for them. Likewise, never buy a racing dinghy without a valid measurement certificate. She may be out of class, and if she is, her value will probably be halved. iso, if you already own an unmeasured class din get it measured. It is pointless owning a recing macl that can never be entersd for open events, and eve srou don't want to race, you may want to sell the buat one Gay, and yuu will loss far more than the cost of the measurer's fee. Contd.un Page 5","Page A. Unless you are very rich, steer clear of the restricted r classes where designs are continually improving and = boats lose tnsir value rapidly. \"Odds and Sods\" dinghies are horrible things to value as thers is réally very little to guide you. Sometimes they may be an 21d class boat, or they may be similar to an existing class, but usually you will have to do quite a bit of studying of current second hand prices (those which ars being paid, not the asked prices!) before you can decide what a given boat is w:rth. As a very rough guide a good clinker built dinghy, with all gear, all in first class condition should be worth half the square of hzr length, i.e. £50 for a ten foot boat, possibly rising slightly higher for the bigger boats. Common ssnse and current building prices wight indicate a cube law, but this is not so as the demand falls off with increasing size - in fact it is very hard to find a good ten or twelve foot dinghy second hand. Old dinghies with cracked ribs; wet, out of shape hulls, dented topsidcs and other signs of old age fall in value tua quarter of their length squared. Below this price they are probably not worth buying at all, or the vendor is a real mug. - Once the condition of a cruiser has been assessed, things are a little simpler. The materials used in her construction (and hence her prospect of life); the number of good bunks, her wardrobe of sails and the amount of gear with her, all affect the value, although any boat sold as “in commission\" sheuld have a full inventory (See ‘Is your cruiser properly equipped?\" Navigans, September 1959) Gadgets such as automatic barnacls removers, devices for fixing the stoves rigidly and putting the cook in gimbals and tables which convert into dinghies will all tend to lower a boats valus. Even the best thought out and most useful gadgets will add little if anything to a boat's value. Crvisers should all ss valued individually, but as a very rough guide, a really good boat (Lloyd's 100 Al with all gear) about four or five years old might be upwards of £300 a ton (Thames) £150 to $200 is the usual range for run of the mill craft in reasonable order, dropping to £100 a ton. Here again, the value drops in the larger sizes (over about eight tons). Boats below this valuation should be avoidsd by people vther than shipwrights and brcakers, although ons can occasionally find a bargain. A large, old boat is very difficult to value truly, as most people with sufficient money to pay a reasonable price will buy a smaller, younger boat with lower running costs, but novices are unlikely to bs trying to buy an cld ten tonner. By the tims they have acquired s.fficient experience to handle and maintain a big cruiser they will know enough about values to decide whether they are being swindled! Small cruisers, plywood or fibreglass boats up to about twenty feet are also difficult to value. A goud, well designed specimen with full inventory might well be worth £100 a ton or evens little over, whereas others reaily have no value at all, other than as firewood, and well soaked plywood burns very, very badly indeed! These boats do not cost a lot new, so the safest policy is tc buy new and sail it to death. Whether or not a particular boat is good value for money is very easily assessed by commring its price with thet of other boats offering similar accommodation. -Generally their sailing performance is 'much >f a muchness', so avoid any whose Contd.on Page 7","Page 7 price is much above the average for its size, or any which aré not well thought out. (See Navigans, June, October and November 1959) \"Barnacle\"","","Mr N.F.Tovey, Rm. 1008. Baddow, Sayne Page 8 This is a list of possible club activities ete, Soe that the club can cater for the wants of as many members aS possible, please number the items in each group. 2 for your main interests, 1 for any secondary interests, and leave blank all items which do not interest you. You may number more than one item in sach group 2 or l. Space has bsen left in each group for further constructive suggestions; destructive criticism is NOT required. Flease return the completed form to the editor. Do not put your name on the form. Ae SATLING ACTIVITIES Be Drinking and Yarning Cruiser Racing in tns Jolly Sailor Day Picnics Drinking and Yarning Dinghy Racing aboard Mamgu Learning to sail Films Shows eboard Mamgu Longer Cruises Jiving \" \" Weekend Cruises Organissd Games 7 Social evenings with light meals. C. WINTSR EVENINGS De DO YOU REGARD MAMGU_ AS Brains Trusts A cheap cafe? Dences A jetty? Film Shows Semewherse to change? Instruction on Sailing u\" to sat your and boat maintenance sandwiches Lectures by Club Members \" meet friends Lectures by wellknown and watch sailings? Sailing Personalities u to store gear? Ee Have YOU any suggestions to improve the facilities on \"MAMGU\"?"]},{"year":1961,"month":12,"no":"12","vol":5,"when":"December 1961","span":null,"contents":"AGM, treatment of canvas sails, the Potted Pilot part 5, Thirslet Creek, Christmas crossword","note":"Pages 6 and 7 are missing from the scan — the printed page numbers jump from 5 to 8. Needs rescanning.","file":"MSC-NL-1961-12.pdf","imgs":["1961-12-1.jpg","1961-12-2.jpg","1961-12-3.jpg","1961-12-4.jpg","1961-12-5.jpg","1961-12-6.jpg","1961-12-7.jpg","1961-12-8.jpg"],"pages":["Monthly Bulletin of Marconi Sailing Club, M.A.S.C. Editor: Daphne Tovey emol.5 Issue 12 December, 1961 | CHRISTMAS MESSAGE FROM THE COMMODORE At the. recent A.G.M. we heard prophets of doom predicting the demise of the Club from loss of its dinghy park, decrepitude of our clubhouse and various other reasons. Let me now say that the Club is as secure as it has ever been. We shall probably be able to use the same dinghy park site as last season, perhaps extended and just possibly including some car parking space. In the remote possibility of our being unable to keep the same site next year we are on friendly terms with the owner of the adjacent field, and should be able to reach an agreement for its use. There is another possible site which we are investigating, beyond | Herring Point. Some members consider this to be better than the ‘present one but it has its drawbacks as well. One is that it will cease to exist in 5-7 years time because of gravel digging, so it would be a short-term project only. Several members hope that we will buy a shore base for our Club. The committee are well aware of the advantages of this, and will always consider any specific proposals that are made; but we do not know of any site. In the meantime \"MAMGU\" is the best base we have. She is sound enough for many years to come, and her facilities are being improved at a rate limited only by the amount of labour on the winter working parties. The first of these was very well supported, and if this continues we shall have a much improved club- house next season After Christmas comes the. Boat Show. If you are looking for a new racing dinghy, though, remember that we have our own active boat show, in effect, on every sailing day. By all means go to Earl's Court and look at the latest ideas, but don't dive overboa R.forEach(r=>{
  r.hay=(r.when+" "+r.contents+" issue "+r.no).toLowerCase();
  r.body=r.pages.map(p=>p.toLowerCase());
});
const YEARS=[...new Set(R.map(r=>r.year))].sort();
let year=null,q="",view=null,pg=0;

document.getElementById("tally").textContent =
  R.length+" issues · "+YEARS[0]+"–"+YEARS[YEARS.length-1]+" · "+
  R.reduce((a,r)=>a+r.imgs.length,0)+" pages · "+
  R.reduce((a,r)=>a+r.pages.reduce((b,p)=>b+p.split(" ").length,0),0).toLocaleString()+" words searchable";

const yrBox=document.getElementById("years");
YEARS.forEach(y=>{
  const b=document.createElement("button");
  b.className="yr";b.textContent=y;b.setAttribute("aria-pressed","false");
  b.onclick=()=>{year=(year===y?null:y);paint()};
  yrBox.appendChild(b);
});

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rx=t=>new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
const hi=(s,t)=>t?esc(s).replace(rx(t),"<mark>$1</mark>"):esc(s);

function snips(r,term){
  const out=[];
  r.body.forEach((low,i)=>{
    const at=low.indexOf(term); if(at<0) return;
    const s=Math.max(0,at-70), e=Math.min(low.length,at+term.length+90);
    out.push({page:i+1,text:(s>0?"…":"")+r.pages[i].slice(s,e).trim()+(e<low.length?"…":"")});
  });
  return out;
}

/* ---- reader ------------------------------------------------------- */
const reader=document.getElementById("reader"), stage=document.getElementById("stage"),
      thumbs=document.getElementById("thumbs"), folio=document.getElementById("folio");

function show(){
  const r=view;
  stage.innerHTML=`<img src="pages/${r.imgs[pg]}" alt="${esc(r.when)}, page ${pg+1}">`;
  stage.scrollTop=0;
  folio.textContent=`${pg+1} of ${r.imgs.length}`;
  document.getElementById("prev").disabled = pg===0;
  document.getElementById("next").disabled = pg===r.imgs.length-1;
  [...thumbs.children].forEach((b,i)=>b.setAttribute("aria-current",String(i===pg)));
  const t=thumbs.children[pg]; if(t) t.scrollIntoView({block:"nearest",inline:"nearest"});
}
function open(r,page){
  view=r; pg=page||0;
  document.getElementById("rtitle").textContent=r.when+" — issue "+r.no;
  thumbs.innerHTML=r.imgs.map((_,i)=>`<button aria-current="false">${i+1}</button>`).join("");
  [...thumbs.children].forEach((b,i)=>b.onclick=()=>{pg=i;show()});
  reader.classList.add("open"); document.body.classList.add("reading");
  show(); document.getElementById("close").focus();
}
function close(){reader.classList.remove("open");document.body.classList.remove("reading");view=null}
document.getElementById("close").onclick=close;
document.getElementById("prev").onclick=()=>{if(pg>0){pg--;show()}};
document.getElementById("next").onclick=()=>{if(pg<view.imgs.length-1){pg++;show()}};
addEventListener("keydown",e=>{
  if(!view) return;
  if(e.key==="Escape") close();
  if(e.key==="ArrowLeft"&&pg>0){pg--;show()}
  if(e.key==="ArrowRight"&&pg<view.imgs.length-1){pg++;show()}
});
let x0=null;
stage.addEventListener("touchstart",e=>{x0=e.changedTouches[0].clientX},{passive:true});
stage.addEventListener("touchend",e=>{
  if(x0===null||!view) return;
  const dx=e.changedTouches[0].clientX-x0; x0=null;
  if(Math.abs(dx)<55) return;
  if(dx<0&&pg<view.imgs.length-1){pg++;show()}
  if(dx>0&&pg>0){pg--;show()}
},{passive:true});

/* ---- list --------------------------------------------------------- */
const list=document.getElementById("list"), count=document.getElementById("count");

function paint(){
  const term=q.trim().toLowerCase(), hits=[];
  R.forEach(r=>{
    if(year&&r.year!==year) return;
    if(!term){hits.push({r,s:[]});return}
    const s=snips(r,term);
    if(r.hay.includes(term)||s.length) hits.push({r,s});
  });
  [...yrBox.children].forEach(b=>b.setAttribute("aria-pressed",String(+b.textContent===year)));
  document.getElementById("clear").classList.toggle("on",q.length>0);

  const pages=hits.reduce((a,h)=>a+h.s.length,0);
  count.textContent = !hits.length ? "" :
    term ? hits.length+(hits.length===1?" issue":" issues")+
           (pages?" · "+pages+(pages===1?" page":" pages")+" mentioning “"+q.trim()+"”":"")
         : hits.length+" issues";

  if(!hits.length){
    list.innerHTML='<li class="empty">Nothing matches that. Try a boat — Mamgu, Avril, Fleetwind — a trophy, or a surname.</li>';
    return;
  }

  list.innerHTML=hits.map((h,i)=>{
    const r=h.r, shown=h.s.slice(0,3);
    return `<li>
      <button class="entry" aria-expanded="false" data-i="${i}">
        <span class="line">
          <span class="when">${hi(r.when,term)}</span>
          <span class="no">Issue ${esc(r.no)} · ${r.imgs.length} pages</span>
          ${r.span?'<span class="tag">Double issue</span>':""}
          ${r.note?'<span class="tag warn">Note</span>':""}
        </span>
        ${r.contents?`<p class="contents">${hi(r.contents,term)}</p>`:""}
        ${shown.length?`<ul class="snips">${shown.map(s=>
          `<li><span class="snip"><span class="pg">p.${s.page}</span>
           <span class="quote" data-page="${s.page}">${hi(s.text,term)}</span></span></li>`).join("")}</ul>`:""}
        ${h.s.length>3?`<p class="more">and ${h.s.length-3} more on this issue</p>`:""}
      </button>
      <div class="detail" id="d${i}">
        <dl>
          <dt>Issue</dt><dd>No. ${esc(r.no)}, volume ${r.vol}</dd>
          <dt>Pages</dt><dd>${r.imgs.length}</dd>
          <dt>File</dt><dd>${esc(r.file)}</dd>
        </dl>
        ${r.note?`<p class="note">${esc(r.note)}</p>`:""}
        <button class="read" data-open="${i}">${h.s.length?`Read from page ${h.s[0].page}`:"Read this issue"}</button>
      </div>
    </li>`;}).join("");

  list.querySelectorAll(".entry").forEach(b=>{
    b.onclick=()=>{const d=document.getElementById("d"+b.dataset.i);
      b.setAttribute("aria-expanded",String(d.classList.toggle("open")))};
  });
  list.querySelectorAll("[data-open]").forEach(b=>{
    b.onclick=e=>{e.stopPropagation();
      const h=hits[+b.dataset.open];
      open(h.r,(h.s[0]?h.s[0].page-1:0))};
  });
}

document.getElementById("q").addEventListener("input",e=>{q=e.target.value;paint()});
document.getElementById("clear").onclick=()=>{
  q="";document.getElementById("q").value="";paint();document.getElementById("q").focus()};
paint();
</script>
