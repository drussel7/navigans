 S. Adamson Hon. Sailing Secretary Mr. A. Adam Committee Mr. M. Greatrex Committee Trailers The terms of our dinghy park agreement allow members of the Club : to use only that land enclosed by the fence and NOT the access road or the land surrounding it. Members should therefore NOT leave their - trailers conspkcuously outside the fence or, least of all, in the access road and should it be inconvenient to remove their trailers immediately after the delivery of a dinghy, these should be discreetly tucked away in the long grass under the sea wall. Mooring Fees The River Bailiff, Mr. C. Stebbens, has asked that members who have moorings at Heybridge, should pay their fees either to him or to the Commodore as soon as possible, as these are due at the beginn~ ing of the season. When it is remembered the good service Mr. Stebbens renders the Club members inaattending to their yachts when they break loose in a gale and in helping the Club generally, all members should make a point of settling this matter as soon as possible. we aK 0 Ke Ok ook a ok OK OK ok oe SAILING NOTES (continued from Page ) | \"Yiona's Cup\" Race — lst. P, Harris and, E. Cottam . 3rd, Ey Scales Sante: Ath. S. Adamson 5th. G. Mayo 6th. 8B, Partridge 7th. E.A. Payne 8th. - Sims 9th. - Bigden 140th. Payne boys in \"Avril\" LADIES RACE We were unable to hold this race owing to inclement weather on both accasions (continues on Page 2)","2 \"MAMGU\" A considerable amount of work has gone into the restoration of the Clubhouse, both externally and internally. Much remains to be done, but progress is being made. It behoves all members to respect this work and NOT undo the progress madee The support that we are receiving from the M,A.S.Ce is governed to some extent by the amount of positive action we are prepared to give in restoring and maintaining the facilities provided and they leave it to us to play our parte The majority of the furnishing and work is a voluntary contribution. If you are untidy, leave paper about, drop cigarette stubs, dead matches etc., somebody has to clean up and there is no paid steward, Members are also reminded that no item of equipment on the vessel or dinghy park, other than personal items, may be removed or interfered with, without the consent of the Ship!s Husband or a member of the Committee. This is particularly important as the supply mains are about to be laid on to the ship. SEAWALL FLOODBOARDS . To prevent unauthorised removal, the Seawall floodboards have been : secured by chain and padlock by the River Board, at the request of the Bailiff and ourselves. Keys are available in the Clubhouse (on the Notice Board) and a duplicate set are in the Bailiff's keeping. THEY MUST BE RETURNED AFTER USE. The importance of replacing and locking the boards at the end of the day cannot be over emphasised and a serious view will be taken on members. who fail to carry out this obligation to the Club. One lapse has already been noted on the 26th. September and was discovered at 11 pem. on that day! As matters atdn to date in respect of the Dinghy Park, and they are subject to continued negotiation, the Club may become involved in a liability due to an abnormal tide and wind leading to flooding in the absence of these boards. A book will be provided on \"Mamgu\" for the receipt and return of these keys. DINGHY PARK = The Dinghy Park has been a great success and it is hoped that it may be possible to enlarge the facilities next year. However, all this costs money in capital expenditure and rent. A charge of 5/= is being levied for the use of the Dinghy Park this seasOMne This amounts to approximately 1d. per week and is a considerable reduction on the fee envisaged by one previous Sailing Secretary, Mr. W.D. Roberts. We would remind members who do not take kindly to the above, and few of us like paying out, that the mooring fee on the river is at least 10/- and in most other Clubs, a similar charge is made. F.eGe ee oe ee SATLING NOTES (continued from pages 1 & )) THE PENNANT RACE iste P. Harris 2nd. EA. Payne 3rd. S. Adamson 4th. E, Scales 5th. D, Freeman 6th. A, Pratt 7th. - Tovey 8th, - Hewson 9th, - Sims (Be Partridge retired)","3 SOME POINTS TO CONSIDER ON BUYING A SMALL CRUISER by \"Barnacle\" Maybe some of you are planning to visit the Boat Show with a view to buying a small cruiser. Be careful what you buy. You are going to spend something oyer £200. Be sure you get value for your money and get a boat in which you can cruise in comfort without partially re-building it or, if you have any skill with tools, and any spare time, get a hull, spars and sails and do the cabin interior yourself, Some firms produce small cruisers with a superb finish - varnished all over. Avoid these like the plague. A varnished interior is useless on a small cruiser as it will make the cabin look smaller than it is and whatever boat you buy, you will find you would like a larger cabin. Also, once the initial high gloss has gone from the varnish, you will find the cabin will be a miserable gloomy place in which to live, even for one night. A pastel shade of enamel is a far better finish as it will make the cabin look much bigger, warmer and lighter. White is not good as it is cold and soon gets grubby, showing all the dirt. Blue also tends to be cold but is reputed not to attract flies and other insects. If rou want to see the grain and colour of any timber inside the boat, use a Wax polish and you can touch it up any time and not have to leave it for a day to drye Whilst on the subject of apparent size, get a boat with the minimum of bulkheads. A bridge deck between cabin and cockpit is good for keeping the cabin dry but the only other bulkhead needed is a small one near the boWe Any other bulkheads will divide the precious cabin space into smaller units and will make the accommodation look more cramped than it really is. You need onlt glance at two otherwise identical hulls, one with a bulkhead or partial bulkhead by the mast, and one with the bulkhead about 3 ft. from the stem, to realise the vast difference in the apparent amount of room in the hull. Curtains can be used when required for screening off pamt of the hull. Be sure adequate provision has been made for carrying fresh water, for cooking and for toilet facilities. One gimballed stove Cdeuctay a, Primus) just inside the aft end of the cabin with a shelf near on which a saucepan and kettle can be stood is the minimum to be asked of a small cruiser. Be sure the stove is not mounted too high and that it has s sheet of asbestos above it, for otherwise your cabin top will soon be filthy. A plastic bucket under a: small plywood locker is the best form of toilet for a miniature cruiser. Bunks should be at least 6'6\" long and 22\" wide, though they may taper to as kow as 10\" at the foot. Be sure that some arrangement has heen made to prevent you slipping off the bunk when the boat rolls. Incidentally, 3' head- room is adequate for sitting in comfort. Obviously, you will not be able to stand up in a small cruiser and since 3' is more than adequate for crawling about there is really no need for an excessively high cabin top. Get a boat with the floorboards raised high enough to stow tinned food and the inevitable bilge water underneath; it is most unpleasant to put your - foot in cold water on getting out of your nice warm sleeping bage Ample storage space is a necessity in a cruiser but remember that one vast locker or innumerable small lockers are both bad ~ three or four medium sized lockers will enable you to keep food seperate from clothing etc. and will alse be fairly easy to keep clean. Small shelves between the frames of the boat with 3\" perspex fronts are handy for stowing odds and ends but be sure the corners of the shelves are cut away so they will not trap water. Some form of table is also highly desirable. It may be hinged to the side of the boat over one of the buhks or it may be stowed out of the way by clipping up under the deck. Adequate ventilation of the cabin is another essential and be sure the ventilators are fitted with water traps. Some form of extractor vent over the stove is another good feature. Avoid large cabin windows for they easily get covered in spray and dirt and weaken the cabin sides unduly. Next month I hope to be able to mention some of the points to watch on the outside of the boate","Ph SAILING NOTES Here are the results overall the racing season 195%. EASTWOOD CUP ist. P, Harris 180 points 2nd, S. Adamson 168 points 3rd, G, Mayo 154. points uth. E. Scales 153 points 5th, K, Elkins 108 points 6th. A. Pratt 67 points 7th. T, Hallam 58 points 8th. J. Hewson 46 points \"ALL DINGHY\" RACES Race No. 1 P, Harris Race No. 2 P. Harris Race No. 3 G Mayo Race No. 4 5 6 P, Harris 7 8 Race Bo. 9 B. Partridge Race No. 10 B, Partridge . Race No. 11 P, Harris Race No. 12 B, Partridge *NNGRS OF THE SERIES OF 12 DINGHY RACES Race No, 1 P. Harris Race No. 2 P Harris Race No. 3 G. Mayo Race No. P, Harris Race No. 5 P. Harris Race No. 6 P. Harris Race No. 7 P. Harris Race No. 8 P, Harris Race No. 9 B. Partridge Race No. 10 B. Partridge Race No. 11 P. Harris Race No. 12 B. Partridge SINGLE HAND FLEETWIND Race No. 1. Race No. 2 Race, No, 3 ist. P,. Harris ist. E, Scales ist. ;.P...Harris 2nd. 8S. Adamson S. Adamson (retired) 2nd, T. Hallam 3rd. K. Elkins 3rd. E, Scales me Ath. 3B. Partridge * 5th, = Tovey * Enterprise occecene continues on Page lessesscccccsce"]},{"year":1959,"month":11,"no":"11","vol":3,"when":"November 1959","span":null,"contents":"Laying-up dinner dance, New Year party at the Kursaal, 'Some Points to Consider on Buying a Small Cruiser'","note":null,"file":"MSC-NL-1959-11.pdf","imgs":["1959-11-1.jpg","1959-11-2.jpg"],"pages":["\"NAVIGAWN 5\" Monthly Bulletin of the Sailing Section, M.A.S.C. Editor:~ WeoJ, Hodge (Hon. Sec.) Voleo3 Issue 11 November, 1959 COMMITTEE NOTES ANNUAL GENERAL MEETING Your Committee hopes that everyone who is able, will attend the Annual General Meeting to be held in the Apprentices’ Lecture Room, Building 720 on Thursday 19th. November, commencing at 7.30 sharps LAYING-UP DINNER/DANCE Although the attendance was not up to last year's standard, the Laying-up Dinner and Dance was a great success, due largely to the efforts of Reg Bolt of the MoA.S.Ce, Brian Partridge, our Social Secretary, and all those good people who worked so doligently in the sale of tickets. The occasion was graced by the presence of our President, Dr. Eastwood - — together with Mrs. Eastwood - both of whom made admirable contributions in their respective spheres, and the Commodores of a number of associated Clubs. If there was any boredom at all, it arose from the monotonous recital of events won by Peter Harris! Surely thexe is someone in the Club capable of offering him competition. WoJoH i So NEW YEAR PARTY. The M.AeS.C. announce that a New Year Party is to be held on Friday 8th. January 1960 at the Kursaal, Southend. Tickets at 2/~ (Members) 4/~ (Guests) = Transport available at 5/~ return extra ~ are obtainable from Monday 2nd. November until Saturday 5th. December, between the hours of 9 aem. and 4.30 pem., or during the lunch hour at the Secretary's of fice. Leaflets advertising this event have been printed and distri- buted. The Sailing Club Committee hopes that many will support this Club venture. GET YOUR TICKETS EARLY TO AVOID DISAPPOINTMENT. eS \"MAMGU\" Members are warned of the damage which can arise from the installation of electricity on board. The water-tight covers on the g way connecting socket MUST always be replaced following disconnection, to eliminate the possibility of rain causing short-circuits. © 0 © © @ ee Oe Now that the Sailing Season is past, members are reminded that the established monthly working days will be re-introduced; the first being Sunday 6th. December, 1959. These arrangements will not, of course, prejudice any additional voluntary effort on other days - in fact, we would welcome any such activity. The work outstanding is mainly painting but. other work is available if necessary. For full detakls, please contact the Ship's Husband, Mr. F. Garrett at Baddow. F.G. ee","SOME POINTS TO CONSIDER ON BUYING A SMALL CRUISER by \"Barnacle\" I have already aired the various snags and merits of centreboards, leeboards, bilge keels and fixed keels in this series of srticles, so the only point I will make here is - go for simplicity if you buy a centreboarder. Avoid dagger plate types - they are alright on a racing dinghy but tend to need excessively elaborate gear on a cruiser and they project too high into the cabin if they are even reasonable size - remember it is depth of plate that counts, not just area. The question of Bermudian or Gaff rig is too big to be considered in this article but one point I must make here is - get a sloop rig. If you go cutter, your headsails will probably be too small to be of much real use and the onl® real reason for multi-mast and multi-sail rigs is to keep individual sails down to a size that can be easily handled. If the mast is stepped on deck, make sure the deck is well strenghhened to take it, preferably with a post down to the keel. While examining the rigging, make sure the boat has adequate chain plates well secured to the hull and if the rigging screws are used, see they are so fitted that no bending strain can be put on the threads. Check up on the metals used in the rigging assembly and indeed in the whole boat and be certain there are no likely sources of electrol- ytic action. Iron bilge keels riveted to the hull with copper rivets, iron straps with brass rivets and rigging screws with male and female members of. different metals are three common examples. — If the boat you contemplate buying has a fairly high cabin top, be sure the side decks are wide enough to enable you to reach the foredeck easily and quickly, going inside the shrouds. If the boat has a lower full width cabin top, check that it is easy of access from the cockpit. Whatever type of cabin top the boat has, be sure it has a good handrail which can be easily grasped, even if your hand is half wrapped up in a spare handsail and also a toe rail one or two inches high all round the edge of the deck with adequate holes in it to let the water drain off the deck. On the foredeck, see the boat has adequate provision for securing the warps, either a stout ringbolt, cleat or post well secured to the framework of the hull, and good fairheads through which to lead the warps. Chocks should be provided in which to secure the anchor whilst sailing and there should be stowage space handy for the warp, unless the boat is fitted with a navel pipe and the warp stowed below. If the main cabib entrance has a sliding hatch, make sure it slidus easily and is of a type which will keep leaks to a minimum. If hinged cabin doors are fitted they should be on a \"lift off\" type hinge with a larger pin on the bottor hinge than the top. ww” Lastle the finish of the boat. Varnish looks nice when it is new but it is a swine to keep looking good. It is better to have the hull enamelled and only the cabin sides and the trimmings and of course, the spars, varnished. A varnished deck is hopeless. As soon as it gets wet it will be dangerously slippery and anyway the varnish will not last long. The deck surface should be rough, but not so rough that you would hurt yourself if you fell. Some modern plastic coverings are good but if any of them are used, make sure they are fitted 80 the joints cannot open and let water get between the coverings on the deck. Finally, before spending a lot of money, it is a good idea to try and get a sail on as many different types of small cruiser as possible, and take the owners judgement with a large pinch of salt. It may be well to remember that they may have never sailed on any other cruiser so they don't realise their boat is just about everything that a cruiser should not be. oH HH Oe OR OS OO OO OR OR"]},{"year":1959,"month":12,"no":"12","vol":3,"when":"December 1959","span":null,"contents":"AGM, winter meetings, hon. secretary's report, sailing secretary's report, commodore's report, 'So You Want To Look Like a Sailor!'","note":null,"file":"MSC-NL-1959-12.pdf","imgs":["1959-12-1.jpg","1959-12-2.jpg","1959-12-3.jpg","1959-12-4.jpg"],"pages":["\"NAVIGANS\" Monthly Bulletin of the Sailing Section, M.A.S.C. Editor:- W.J. Hodge (Hon. Sec. ) Vol.3 Issue 12 December, 1959 COMMITTEE NOTES This issue, the 36th, is the last under my editorship, for the time being at any rate. Copy for future issues should be made available to the new Hon. Secretary, Mr. F. Garrett, at Baddow Research Laboratories. I sincerely hope that he will enjoy a better show of support than has been my experience. : koe OR ROR OR RR I have been asked by the Commodore to send the compliments of the season to all members and the hope that the Club will show marked progress in 1960. We can use this coming year in the spirit of Advent - our goal being the Blackwater & Colne Dinghy Championships of 1961. With all members showing maximum interest, it should be possible to compete with, if not excel, similar events in the past. OR RK GR ak ROK Ok OR The Aniual General Meeting was attended by some thirty members. Reports from the Commodore and retiring Secretaries were heard and, for the benefit of those unable to be present, are published in this issue. The Officers and elected Committee for the coming year are as follow:- Commodore E.A. Payne ) elected for 3rd. year. Vice-—Commodore T.W. Hallam Rear-Commodore A. Adam ) Baddow Hon. Secretary) and Treasurer ) F. Garrett Baddow Assistant to the Secretary/Treasurer PP. Berkeley Broomfield Social Secretary R. Simms Baddow Sailing Secretary B. Partridge Baddow Committee. C. Clarke Baddow )) A.S. Bigden Baddow F. Collins New Street S. Adamson New Street G. Wardell Baddow D. Freeman New Street Wy JH. Par Sar en eae eee WINTER STORAGE Some members are storing boats an sts in a barn at Sandon, charges 20/— and 25/- for the Winter. details, see Phil Berkeley, Broomfield, Extension 11. vw af “a P.Be 2 FOR SALE \"VENTURER\" length 11%\", pine and mahogany construction. Built 1959 - new condition. British Anyani 4 h.p. super single engine in first class condition. Price: £70 or split - Boat £55, engine £15 Apply:- C.N. Morris, Telephone No. Welwyn Garden City 2697 Mk 3k OS 8 FR ke","2 WINTER MEETINGS The first of the Winter Mectings will be held at the College on Thursday, 10th. December, commencing at 7.30 pelle Mr. H.G. Crispin, Commodore of the Stone Sailing Club will give a film show of the Snipe World Championships held in Brazil. This promises to be an interesting evening, and we hope that the Club will be well represented. tet ete t+ A Christmas Party will be held on board \"Mamgu\" on Saturday, December 19th. This event is in response to a number of requests from various members who found the last party even more interesting than the Laying-up Dinner - due no doubt to the absence of formality. We hope you will patronize the event and enjoy yourselves. WO RR OK GR ok OK OR OR Ok OK REPORT FROM THE HON, SECRETARY, READ AT THE A.G.M. ON 19TH. NOVEMBER '59 Before settling down to the business side of this report, I must announce that I shall not be available for office next year. The Commodere and members of the Committee are already aware of this. My _— three years as your Secretary and Treasurer have been af happy memory Eve ae] I hope, after a rest, to. be allowed to serve again in a similar, if not identical, capacity. This last year has been somewhat eventful, if not lucrative. The Social events of the Club have been well patronized and membership has maintained its steady increase. Do not allow this to encourage apathy however, for any increase in membership is invariably cancelled out by resignations from the Club. An adverse report from the M.A.S.C. regarding the state of the barge \"Mamgu\" encouraged some additional effort and the Club Headquarters is now in good shape. The verbal bouquets for this work will be given by the Commodore later. We have electricity and water on board and, following a rather unfortunate mishap when one member, attempting to board \"Mamgu\" from a temporary structure, was unceremoniously ducked into the water, a permanent access gangway was hastily erected. An anonymous donation made provision for furnishings. © The lease. of land comprising the Dinghy Park is still under active negotiation but the venture seems to have the general support of all members. The Club News Sheet has achieved its third year - by a short neck!! I shall not be editing it in the forthcoming year, but I hope that members will support my successor and make this facility useful. Three members of your elected Committee resigned during the year - Messrs. Durham, Roberts and Mayo. Of these, Mr. Roberts merits special mention and I'm sure that the Commodore will refer to his outstanding service when the time comes for him to deliver his report. Finally, a word for the future. Payment of subscriptions is still far from complete and quite frankly, we are worried. The M.A.S.C. is not in a position to gaurantee the past subsidies, so that we must look more and more to receipts from other sources and endeavour to make ourselves completely independent financially. For only by doing this can we ensure autonomy for ourselves in the matter of planning the programme for 1961 when we foster the Blackwater & Colne Dinghy Championships. I cannot leave your service without thenking the Commodores and Committees under whish I have been privileged to hold office. In particular, I want to thank Mr. Berkeley who has helped me enormously over the past twelve months. In conclusion, thank you all for your support and good luck in the future.","5 SATLING SECRETARY'S REPORT TO A.G.M. ON THURSDAY, 19TH. NOVEMBER, 1959 A lengthy report and comment included these points:- 1. That while we are constantly recruiting new members, the true strength of the Club shows no, or little increase, because, as the Secretary/Treasurer's report for 1958 has clearly shown, many after an initial year of membership do not continue. It was deplorable that the Committee had failed to see the implications and seek remedy. Members themselves could help by giving a cordial welcome to newcomers to the Club, by taking them, whenever possible, for a sail and, when needing racing crews, by choosing a club member rather than a friend outside the Club. With this in mind, a few vacant dates should be left in the programme so that members could take friends for a sail, without prejudice to racing events. a That our participation in \"open\" events was the lowest in the history of the Club. As a club, our status in the Joint Clubs Committee is largely judged by our entmsiasm in such events, and we must try to do better next year. Now that \"Mamgu\" has been brought to a reasonable standard of tidiness, though much remains still to be done, we might well devote some effort to things to assist sailing, e.g. lockers, storage of gear, racks etc. and a workshop. Ze That, in appointing officers, we should be more critical in assessing the suitability of candidates. te Thet the provision of a trophy for the Enterprise (expected to be five in number) to race as the Fleetwinds in the Eastwood Cup, is an urgent necessity. P In a closing note, the Sailing Secretary deplored the lack of potential in Ladies! Racing which excluded competition for Mrs. Hallam's trophy. Kok OR MORO kM Rk RK OR COMMODORE'S REPORT TO A.G.M. ON THURSDAY, 19TH. NOVEMBER, 1959 Considerable progress has been made in establishing the barge \"Mamgu\" as a clubhouse at Heybridge. Painting and fitting out have continued and I would thank all who have participated in this work. The saloon has been furnished with tables, chairs and matting for the floors, as the result of an anonymous donation. Racing against otherclubs has taken place and we have entertained the representatives on board. The two \"open Days\" for visitors proved most successful and the annual Laying-up dinner was honoured by the presence of eight Commodores of other ¢libs. A word of thanks to the retiring Hon. Sacretary/Treasurer who hasworked so diligently on our behalf over the past 3 years and whose editorship of the Club news=-sheet has achieved thirty-five copies. I must also mention Mr, Garrett, whose unfailing devotion to duty as Ship's Husband has been the inspiration behind our achievements in restoring \"Mamgu\" to suitable premises. The Secretary in his report made special mention of Derek Roberts and left it to me to record his endeavours in office. We miss him greatly and found it no easy matter to replace him. We all hope that he is doing well in his new job and able to use his outstanding abilities in another club. A word of thanks also to Mr. Greatrex for his assistance in carpentry, to Mr. Hallam for his courage against overwhelming odds and of course the ladies without whose invaluable assistance, social events could not be held, Finally, those members who lent their dinghies for the team races, particularly those who had torelinquish their normal crews (in many cases, their wives!) and race with the crews prescribed. The MeA.S.C. must also come in for a share of the bouquets, Messrs. Collins and Bolt especially, both of whom have had our interests at heart and have never refused a legitimate request. The club boat was given a major overhaul in the Spring and, thanks to the efforts of our bos'un, the Club was relieved of considerable expense. Arthur Adam had a number of letters published in the Yachting Monthly. So much for the past ~ for the future, good luck and a happy outcome of all your endeavours.","Ih SO YOU WANT TO LOOK LIKE A SAILOR: by \"Barnacle\" In these highly competitive days, first impressions count for quite a lot so it behoves all who wish to achieve merit in the-sailing world to do their utmost to create the right first impression. The tactics to be adopted will vary according to the type of boat sailed. The owner of a racing dinghy during the Winter and on non-sailing days in. the Summer will create the right impression if he appears in a freshly laundered white overall, of a non-fluffy material, with an outsize tin of Blanks silicone polish in one pocket, a good pile of polishing cloths and, at painting time, a wet and dry bulb hygrometer. One or teo carefully positioned paint splashes on the overall are admissible but should not be overdone. Whilst the other Club members are happily slapping on paint, the expert will measure the humid- ity and estimate the dust content of the atmosphere and decide that conditions hardly favour the perfect finish, so will spend the day working on the Beel band with \"Brasso\", then, when no-one is about, he can comfortably remove his immaculate overalls, don a couple of fluffy old sweaters and slosh on some paint. This way he will get the same quality finish overall as all the rest, but he will have created a far better impression. On sailing days, there is a fair amount of latitude as regards sailing, but~~—.. any form of headwear is OUT - look at all that excess windage in the tassc— of a wooled hat or the peak of a cap} Likewise, body clothing must be ultra- light-weight and offer minimum wind resistance. A stop-watch, slide rule and ventimeter are essential accessories. Before each race, the wond strength must be measured, the necessary calculations made and the rigging screws and leach line of the mainsail adjusted accordingly. Inconspicuous little marks on these items willenable you to get them back where you always have them once the impression has been created. The cruiser owner is fortunate that he has many more props available. His overalls must bear liberal splashes of antifouling, sump oil, varnish, linseed oil, stockholm tar, sail tanning and topside enamel. His pockets should bulge with an oily rag, a Stillson wrench, a few spare shackles, a bettered hip flask, a navigating officer's deck watch (with carefully dented and tarnished case), three or four pipes, tobacco and matches. Tobacco should of the hard variety and black. There is no fear of making yourself sick for no-one will let you smoke it near them! A sheath knife to cut the tobacco and a marline spike on a lanyard are also essential. Sweaters should have an oversize roll neck reaching up to the eyes and should be at least knee~length. Aboard the boat, old carpet slippers are the onlt footwear admissible. In the galley, a saucepan of thick stew should be kept simmering. This will last a long as no=one will be tempted to eat it when you offer some: and then, when no-one is looking of course, you will eat your freshly made sandwiches. A couple of old charts should be torn up and used for note-paper and spitfire jib and storm trysail sailbags should have a prominent position in the cabin (they are ideal for storing dry clothes unless you have a spitfire jib and storm trysail in which case you will be trying NOT to look like a sailor!) A sea anchor should also have a prominent place aboard (with the bottom tied up it is handy for storing vegetables) When living aboard, the day should be started right by washing in cold sea- water and shaving with your sheath-knife, using the binnacle glass as a mirror. Then, when the quay is deserted, you can.slip ashore to the pub and have a real wash and shave in comfort. There are many other ways in which the would-be sailor can create the right impression, but I hope I have mentioned enough here to give you the general idea. HK ok Rk Ok Rk KR Ok kk OK x FOR SALE 4 hepe twin cylinder water-cooled in-board engine with reversing Wortham Blake propeller, shaft, water filter and all fittings. In ecellent conditiom, little used. Weight approx. 52 lbs., 44 cue ft. volume. Price £40 oenede Apply := Mr. FoJ. Tompsett, \"A\" Division. Internal 681."]},{"year":1960,"month":1,"no":"1","vol":4,"when":"January 1960","span":null,"contents":"Winter programme, new editor, Enterprise and Fleetwind designs, 'If You Keep Your Boat in a Boatyard'","note":null,"file":"MSC-NL-1960-01.pdf","imgs":["1960-01-1.jpg","1960-01-2.jpg","1960-01-3.jpg","1960-01-4.jpg"],"pages":["¢ \"NAVIGANS\" Monthly Bulletin of the Sailing Section, M.A.S.C, Vol. 4. No. 1. Editors— F.W. Garrett Janua: 1960 (Hon, Sec.) \"With the advent of the 1960 season your New Secretary takes over the editorship of our monthly newsheet. In so doing he would like to pay a tribute to Mr, W.J. Hodge who for the past three years has undertaken these tasks. Of the club offices they are probably the least specteeular, but demand a considerable amount of time and attention if the fortunes of the club are to remain on an even keel. That they are, I think is an indication how well \"Wally\" has discharged his tasks in the interest of the club F.W.G,. SAILING SEASON 1960 Your Sailing Secretary has completed his programme for the forthcoming po season, which promises to be a very full one, including 2 open championship. races sponsored by the Club. One for Dinghies and one for Cruisers. Dependant upon negotiations it is hoped to enlarge the Dinghy Park for the forthcoming season, The provisioning of a club rescue boat is receiving attention by your committee. : To launch the Season and assist your Club a dance has -been arranged for Friday, April 22nd at the Odeon Ballroom. Make a note of this date and support your Club in this venture. WINTER PROGRAMME Illustrated Lectures at, Marconi. College, Arbour Lane, Tuesday January 19th 7.30.pm The Changing Blackwater (A fasinating guide to the sailors under- standing of the river he sails) by Mr. Masefield. Wednesday 3rd February 7.30.pm. Experiences in Southern Oceans (Whaling and the Navy in those adventurous seas) by E. Priestly. A Party will be held on \"MAMGU\" on January 16th from 90.00 hrs, Tickets 5/- Refreshments inclusive. RFS. Honour for member of Sailing Club At the Annual General Meeting of the National Enterprise Association held at the Piccadilly Hotel on the 5th December, Mr. Freeman was elected to the National Committee.","pS Ron Brittain an old friend of the Marconi Sailing Club and ex. Commodore of the Maylandsea Bay Club was elected Secretary of the Association. Matters arising from AGM Owners of Enterprise's in the Club will'be pleased to hear that¥ Windows are now allowed in the sails of an Enterprise, and full details will be cirquiated to members of the association in due course, D.G.Fe Class Measurer Mir. D.G. Freeman has been appointed class measurer to the Club for the Enterprise and Fleetwind classes and will be pleased to advise owners on any problems. Phone New Street Ext. 285 Int. 447 tx a Enterprise One Design Sketch Plans of suggested position of Window in the Enterprise sails are being prepared by the class measurer and will be available soon. Cost of fitting is stated to be 12/6, D.G.F Pleetwind One Design Sketch plans for the new full length Top Batten are being prepared by the class measurer and will be available shortly to all owners. DsGeds For Sale . Fleetwind FW.134 £60 o.n.o. Contact Mr.- Freeman, Int. ext. 447 New Street. IF YOU KEEP YOUR BOAT IN A BOATYARD mand By \"Barnacle\", If you keep your boat in a boatyard for the winter, there are a few small points that are worth bearing in mind, When you lay the boat up for the winter, check her over thoroughly and decide what work will have to be done ready for the next season, If there are any jobs that you cannot tackle yourself, let the Yard Manager Have a list of them immediately telling him the date by which you would like them finished. Then he can fit the work in with his winter programme and you can be reasonably ‘ sure the boat will be ready on time. If you do not let the Manager know about the jobs until Easter, the yard may be so busy that they will not be able to do them for you for some little time, Also with sail repairs, let the sailmaker have your instructions as early in the winter as possible. Be explicit in your instructions, If you merely say \"Stop the garboards leaking\", you might find yourself with a bill for an assortment of new floors and frames, put in a ripe old boat that was not really worth repairing. If","= 3- you are not certain of the amount of work that will have to be done to effect a repair, explain the problem and get an estimate from the Yard Manager before authorising any work to be done, If the Manager tells you the boat is not worth repairing or spending money on, accept his judgement, find a mug who will buy the boat off you, and get yourself'a better one. Judging by the number of people one sees working on rotten, unseaworthy old tubs, there are still plenty of mugs about who believe a rotten boet is a bargain if it is cheap. While you are working in the yard, remember there may also be other owners working near you. Don't start raising dust until you have made sure that nobady near you is putting on varnish or enamel, and if you are washing out a boat, be careful where all the water goes -— you can soon turn a boatyard into a sea of mud to the great inconvenience of fellow workers. If you borrow any tools, be sure you return them to their owner as soon as you have finished with them. If you own tools and want them to remain in reasonable condition, unless you are confident of the borrowers abilities, never lend saws, otherthan hacksaws, chisels, planes or paintbrushes, and if you are an habitual borrower of tools, don't expect to borrow these items from an owner who takes any pride in his work, If you move or borrow any yard equipment for the weekend, be sure you put it back where you found it before you leave, and if you borrow any tools from the Proffesional Shipwrights, take are of them and hand them back in good order, Remember you are there only for your own pleasure, but it is the professional's livelihood. If you keep your boat in a boatyard, you will be expected to buy paint etc. from the yard. Local yards rents are not high, and most rely on the work on the leid up boats and profit on the sale of paint and gear to show any profit at all. If you think the yard are overcharging you, then take your boat to another yard. You will probably find his prices even higher! Remember that the local yards are all very good to owmers in letting them work on their own boats - there are plenty of boatyards that will not let owners do the work, and just imagine what your local garage owner would say if you drove in and asked him if you could respray your car and put a new engine in in his garage! When dealing with the yard shipwrights, remember your manners. Most of them are skilled craftsmen, probably more skilled at their trade than you are at yours, and if you try to impress them with whet a superior person you are, they will merely laugh at you (when you have gone) for being the conceited ass that you are. \"Barnacle\""]},{"year":1960,"month":2,"no":"2","vol":4,"when":"February 1960","span":null,"contents":"Balance sheet, Mamgu, sailing programme, National Boat Show at Earls Court, 'Fitting Out'","note":null,"file":"MSC-NL-1960-02.pdf","imgs":["1960-02-1.jpg","1960-02-2.jpg","1960-02-3.jpg","1960-02-4.jpg","1960-02-5.jpg","1960-02-6.jpg"],"pages":["WHA VEGANS # Monthly Bulletin of the Sailing Section N.A.S.C. Editor:- F.W.Garrett. (Hon.Sec.) Vol.4. No.2. February 1960. Editors Monthly comment. In reviewing the register it is noted that a certain number of members have moved to a new habitat or have left for pastures new. Hither by personal knowledge or enquiry a track can be kept on many changes, but it would reatly facilitate the keeping of records up to date, and the dcolivery of this nevs sheet, if members would advise the Secretary of any changes in location; particularly if very different from the ore appearing on your original application form Balance Sheet comments. Attached to this months news letter is the balance sheet for the vast year, prepared by your past’ Secretary and Treasurer. The years results show a satisf ctory position, but do not let us become complacent, for although the man hours given gratis to the club by members on the restoration and refurbishing of the club premises ig considerable, so is the capital expenditure by the M...5.C. om our behalf. In respect of expenditute, attention is drawn to the feet thet no.membe is authorised tc commit the club in any way, particularly on local purchase, without the sanction of the Comnittee or the Treasurer. \"Mameull Working parties are the order or the day during the 'close! seagon and mambers are urged to assist in the nainting and refurbishing. It is your clubhouse and you vill expect to enjoy the facilities provided, in addition we will be hosts to uny other clubs this season and we all like to look our best on such occasions. The first Sunday .n each month is reserved as a working day, and if sufficient support is forthcoming the third Sunday in addition, as time to the commencement of the new season is limited. lir.Jaek Bigdon the new \"Ships Husband!\" will advise on the work to be undertaken, or in his absence the Secretary. Members are reminded that the notice board in the Saloon is for official and approved items only. Any miscellaneous posters etc. not in the above category will be removed. Items for display directing the attention of members to a particular subject must be forwarded to the Secretary. Sailing. The forthcoming seasons! programme is in the printers hands and copies should be available in the near future. It is proposed to allocate space in the Dinghy Park this season and members should contact the Sailing Secretary Nr.5.W.Partridge if they recuire this facility. Fleetwind owers not replacing their sails will find it worth while to have the top-batten pocket extended to take the now full length batten Cont'd","Page 2. allowed under the new class rule. This should only cost a few shillings if the sail is forwarded to the sail makers promptly. S.A. Social. The winter programme of lectures have been well attended and have been most interesting. The next two lectures at the College are:- Thursday 18th February at 7.30pm. \"Building a small cruiser\" by Mr.J.A.Scarlett. Thursday 3rd March at 7.30pm. \"Messing about in boats\" by Mr.A.E.Lamb,. This lecture will. cover insurance, sailing and a film of the Spithead Review. Have ycu made a note of the club dance at the Odeon Ballroom on April 22nd?. ~~ News and Views. SATTONAL BOAT SHOW 1960. By moving to Earls Court, the organisers of the Boat Show have gained in space, and better still have obtained a nool wherein a few yachts may lie with their proper dignity. It is safe to predict that next year the upper floor of the building will also be in use and we shall again have the pleasure of looking down at the larger exhibits, as at Olympia. Traditionally~built yachts of beautiful finish were on show in greater size and splendour than ever - and inevitably at greater price. Newer techniques such as moulded ply and fibreglass are more interesting in that they are more subject to development. Ian Proctor's \"Alpha\" is a notable examole of a dinghy designed to require the absolute minimum of maintenance, with glass fibre hull and foam- filled buoyancy by the Bristol Aeroplane Go., metal spars and Terylene sails and cordage. She is expensive to begin with, but quite cheap if you include 5 - 10 years! maintenance- free life. The News Chronicle is sponsoring the \"Audacity\", a very attractive 34 ton centreboard cruiser designed by Laurent Giles. Of cold-moulded construction - again with the co-operation of the aircraft industry ~ she has the shape of a genuine yacht, yet taking size into account her price is competetive with the Tucker range of tea-chest boats. She deserves to share in the success of the News Chronicle \" Enterprise\". The second generetion of modern catamarans is with us. No loger can anything be sold that has two hulls; among day=sailers were three or four which could give a \"Shearwater\" a hard race. Three interesting cruising cats were shown; uncon- ventional to look at, but notably comfortable in a seaway, by accounts even from confirmed single-hull sailors. Nor are they in continual danger of capsizing = the Hawiian 40 ft \"Waikiki Surf\" has crossed the Pacific frequently. For those really determined to capsize through sheer overdriving, Michael Henderson has the enswer in \" Golden Miller\" which uses a masthead float and a little ballast to ensure self~righting from any position. Will the Fashion Show next year provide proof of the uacrushable quality of its delectable dresses? Perhaps they might be publicly unpacked from a damp, sat-upon kitbag before being worn in the Parade Round the Pond. AMA. Members will be interested to hear that Douglas Lamb, Warden of the Maldon Youth Hostel, has been awarded the Sritish Hmsire i:edal in the New Years Honours list. Doug.Lamb is well Imown to many of our members, particularly those who keep their yachts in Maldon shipyards, and all will agree that the award is very well deserved. Gonttd.","Page 3. In addition to his duties as a Warden he founded the Maldon Sailing Centre and rore recently, the ialdon Redwing Club, which under his guidance has constructed two Redwings. BeAeP. A special presentation of \" Finding your way by the Stars\" is being given at 8.30 pm on Wednesday 9th March 1960 by the Management of the London Planeteriun, Marylebone Road, N.W.1l. This is a repeat of a presentation at the Boat Show. Tickets 4/- (Bookable in advance) Tel. Hunter 1121. Further details from the Secretary. MART. For Sale. About 3 sqeyds. of White \"Trakmark\" available. Ideal for non-slip decking and floors. Contact S.Adamson, Gentral Division or P. Goulden, Baddow, Room 100. For Sale. Mariner. 4 H.P. Twin Cylinder Inboard ingine by Brockhouse Eng. Ltd. Watercooled, couwplete with shaft and propeller. £4C or near offer. F.J.Tcmpsett, Room 718C, New Street. ‘ NAVIGANS - FEPRUARY. FI He NG OUT. by \"3ARHACLE\". Lf you are going to repaint and fit out a boat, you will need a certain number of tools. They are not many, and they are not exoensive, so there is not much excuse for not having then. first of ali, remove old paint and muck from the hull you will need some scrapers, a good scrub>ing brush and bucket. The good old triangular scrapers take a lot of beating, and for a high finish or awkward corners, special scrapers can be made up from broken power hacksaw blades or old files. A file or stone for sharpening the scrapers will also be needed. A plastic bucket is the obvious choice - f think vhe only point in favour of a galvanised bucket is that you can lower it over the stern of your boat as an emergency brake without fear of pulling out the handle. A brush for brushing out the inside of the boat, and some form of dustpan will be needed, unless you can borrow a vacuum cleaner. When cleaning out the inside of the hull, be careful to remove all dust, etc. from the limber holes. It may pay to make up a special little tool for this job, especially if the boat is an old one and the limber holes are pertially blocked by an accumulation of old paint. uaving cleaned all the old paint off the hull, you will probably need a putty Imife. A stainless steel table knife with a whipoy blade makes a fair substitute, and can be handy for awkward corners. Sheets of glasspaper are obviously needed, and can usually be purchased at the boatyard. If you want a good finish, don't skimp the sanding off, and then remove all dust thoroughly with a brush followed by a damp sponge. Fost essential of all are paint brushes. You will find it pays to get good brushes and take care of them, and keep separate brushes for different jobs. Never use the varnish brush for any coloured paints, and try to keep one brush for each colour paint used, as it is very difficult to remove all the paint from a brush, and it is most annoying to find the white enamel is slightly tinged with green. A separate brush for priming paint is advisable, and separate brushes for black varnish and anti-fouling are obviously essential. The black varnish brush need never be cleaned out. When you have finished with it, wrap it up in a polythene bag and leave it. It may harden up by next season, but ten minutes Cont'd","Page 4. work on an odd piece of wood with the brush well saturated in black varnish will soon soften it again. ‘Whilst on the subject of painting, never try to apply paint thickly. Several thin coats will harden better and give a much better looking finish. Also, whenever possible, start by painting the lightest colour first and finish with the darkest. Remember that anti~fouling must be put on within 24 hours of lavnching. Varnish is best done last of all, to try and get better weather. Again, several thin coats well smoothed down are infinitely better than one or two thick coats. For cleaning 2! out brushes you will need an assortment of tins and old rags and some turps. The more tins and rags you can collect by fitting out time the better. When using varnish it pays to oour a small amount into a small clean tin you can comfortably hold in your hand ( an old enamel mug is ideal, ov a teacup) , rather than pour out a lot, and then either have to waste the surplus or: pour it back into the can. For rigging the mast you will need at least a screwdriver, a pair of pliers and a good sharp knife. There shovld not really be any specific use for a hammer at fitting out time, but it is almost certain you WILL need one somewhere. If the boat needs any structural repairs, you vill need a larger tool kit, but so long as you have a good saw, a medium size plane, a large and a small chisel and means of drilling holes, you should be able to cone with most of the routine maintenance. If your boat is carvel built it will pay you to get one or two caulking irons of your awn, otherwise the yard shipwrights will usually lend these, together with rivetting dollies, large clamps, etc. when they are needed for special jobs. \"BARNACLE\" HAVE YOU PAID YOUR AN VALSUBSURIPTIOuNS?.","dnuo~tSzuytesUkueop]o9u4}4Jjose[aTnyqTp#usTd1x9eyesoepanytoutostsTqeupouefedspu*no*dg°“y£*4i5TwJe4fgor°a°N _*tl°Se8*aLZrds°it96yralGaigZo) OdeiB9)\"s9e INOOUWOLGTWTGOVNVAINVYELIUVAIHOSs,SfU7OG1dNe7T9O6.S16-0lgONIs°*ToIsouVfeSed;xNeOTIeJLtoOoyEoSsz)es(kAteqoz0eg °OL\"SL BSpIeogoTJON—Korqerty°eeHaoeudtenqg)y9nGo*-zSiu°tl4e9TqyewopruleysUpeTscYsyosreg S“e £GNi0oG)°96 bL°eSt)5\"°S)b ea £°Q09S} i\"O9eN6 (Baiael |Gp °\"S9b me sT*seds-u°—oTedWxy(,py°9udetaqryesn)(yngu°ousru¢epzyr) (eo°zu¥pok°umeHog) »soudotagzy(asYTtUey-aUZyTuOgeNT)o4TFanuozt-Oo130duF4T294neT9gxqJrn9o‘s-oaeSzysuet2de40dxn1eFswTsNneSuoaUteygsY, sATe¥dqtyuemsSTyuotueo>dDltugeqy)*ueTy—dtzosqng wTsAnerzsUpeuyeuZoynr,gd $*7eP0Y7TIHyTS£eIsauVTY—osStucIeNgdTyVxGe,ozdTn-suo2-esutsgd,exye 9Sy0u4U9TgtOmMe0LYDy ys*ngqoz°ugsoenuyokerneykd*AP4UoT°ps_*OevqDz°UenQgM °JZ0e9UT0C (2°eP°¢a0eTi.es\"m\"itSeOn,bLJ2°isGes6a9e(BsUy*TgSItU(yOeuTI2PsZOeuTMqnOI.ySTM7)Ueos—9T)sSwu)oYsyg,tTeszUPurSsoyezsoyg*Po°erTCymZ°o0)°S0lL\"°09S*eOu°nsSpy°otVp\"ruNoeaWdrxoder-sjUoz°Ooo°TuqJusOtoeSqmveensda0nFnx-eg2UYuuYtUts-ele9TDtq) O °oanpie o\"#dc2Ly. “o9z1 a°01)S aeu\"CeO)oLie\"!°O6lL*aL0adoy~°PT9OTYS°M0ODTG“LMeHVo)°s\"GtQqunLTP9tA0y4,uoJtOyeSuToHg CG (anSwureoyq, suotadtazosqng gSnoyugto aeD (sSutetye)9 i°\"*C6Z9ke,F"]},{"year":1960,"month":3,"no":"3","vol":4,"when":"March 1960","span":null,"contents":"Blackwater and Colne dinghy handicapping ratings, cruiser handicaps, championships, 'Caveat Emptor'","note":null,"file":"MSC-NL-1960-03.pdf","imgs":["1960-03-1.jpg","1960-03-2.jpg","1960-03-3.jpg","1960-03-4.jpg"],"pages":["UNAVIGAIS\" Monthly Bulletin of the Sailing Section M.A.S.0. Editor: F.W.Garrett. ( Hon.Sec.) Vol.4. No.3. March 1960. Editors Monthly comment. We are within a month of the opening of a new season,a season which promises to be one of the busiest in the clubs! history, judging from your Sailing Secretary's programme, and I am sure it will be an eminently successful one- In the meantime much remains to be done to make our clubhouse \"Mamgu\" shipshape.e All members who can make it, are urged to give a hand in time for the \"Fitting out\" supper, to be held on board on April 9th. Sailing. In referring to the forthcoming seasons' programme, it is noted that there are six cups, (two in the open championships). The Fleetwind Designers Trophy, and the Pennant Race, in addition to the team races with at least four visiting clubs. Early entries are advised for the Blackwater and Colne Dinghy Champion- ships to be held on July 7th. Members wishing to enter any of the events should contact the Sailing Secretary Mr.3.W.Partridge, Baddow. Room 100 who proposes a block entry for the club. Blackwater and Colne Dinghy Handicaping Committee. A meeting of the above committee took place at the Maldon Yacht Club on the 6th March. Messrs. Gottam and Freeman (in the absence of the Sailing Secretary on business) represented our club. The main points arising from the meeting were as follows:— Portsmouth Standard Handicap for 1960 to be adopted in ail cases with the following exceptions. Terylene Cotton. as: National Y.W. Hornet 89 91 2.) Snipe 100 100 Bh) Fleetwind 0.D. 113 U5 4a) International Cadet 129 132 5.) Wivenhoe. 0.D. 108 108 The National Enterprise class will be given a rating of 98 in all cases, unless a declaration is given to the race officer before the race that cotton sails, or a cruising rig is being used,as the owner does not possess a suit of terylene, then a rating of 103 and 108 will be given respectively. This is to prevent unfair competetion where owmers have three suits of sails for varying weather conditions. Menagerie Class. The rating of \"Avril\" during 1960 will be 130. A block of numbers, 41 - 60 inclusive has been allocated to the club for use with boats not possessing a class sail number. These numbers are to be shown on the sails in any open event and are to be in Red. : D.F.G. ( A resume of the Portsmouth standard yardstick for 1960 will be published next month. Editor.) Notes for Fleetwind Owners. The Fleetwind Association has ruled that only #.A.-members and measured boats wiil be allowed to compete in F.A. events. The \"joint clubs!\" have also ruled that only measured boats will be allowed to compete in the championships at Stone. Cont'd. Page 2.","Page 2. While the first reactions to these announcements were hardly favourable, it is felt that these measures are for the good of all ultimately. if any member has doubts on this, Mr.Cotiams lecture in the near future on \"Racing Rules and Tactics\" should settle any pointssan event well worth attending whatever your interest, or whichever class you rate helmsmanship . SA. Our class measurer Don.#reeman, to help us operate at the lowest possible cost, has generously waived the fees to which he is entitled. In view of Dan's generosity it is suggested that we should save his time, and measure a number of boats in one day, volunteers could assist in the construction of the necessary jigs. It should then be possible to qualify for all F.A. events in our area on the 7/6d fee for F.A. Membership. : oA. ( Mr.Adamson igs the club representative with the Fleetwind Association, and can arrange membership. Editor.) Social. The next three illustrated lectures at the College are:- \"Flags and Naval History\" by a Naval Historian on Thursday March 17th _ at 7.300m. — This promises to be a most interesting and informative lecture. \" Sailing Rules and Tactics\" by E.Cottam. on Thursday .24th March at 7.30pm. \"Sailing in Dutch Waters\"by Mr.Lenderyou on Thursday 3ist March at 7. 300m. Do not forget the Club dance at the Odeon on Friday April 22nd} News and Views. The Central Council of Physical Recreation (U.C.P.R.) has arranged a number of lectures on Sailing and Navigation by well known personalities during the next two months, details fron the Secretary. Anyone interested in procuring a yacht Timer at 32/6a each should contact the Commodore for details. Navigans. om: Wanted. Fleetwind. 0.D. Would anyone knowing of a Fleetwind fcr sale please inform the Commodore or Hon. Secretary. Burgees have been exchanged with the Wivenhoe Sailing Club whose turn it is to sponsor the Blackwater and Colne dinghy championships this season. Cc r Handicaps. The Commodore represented our club at a meeting of the joint Clubs Committee held at the Maldon Little Ship Club, to discuss handicaps for cruisers during the forth- coming season. Results over the last few years were analysed and those cruisers which have not been so successful were re-rated; with the proviso that if thoir owners were dissatisfied after participating in three events, they could apply to the committee for further consideration of their rating. This appeared to meet the wishes of most of the representatives, many of whom were cruiser owners. Blackwater and Colne Dinghy Championships. The Commodore and Sailing Secretary attended a meeting of the above, which was held at the Wivenhoe Sailing Club, under whose auspices the’ chatpionships are to be held this Summer at Stone. Details of the event were arranged and it was agreed that the winning helmsman in each event should sail the final race in Enterprises and G.P.-14s which would be best for the occasion; regrettably, it was not expected that sufficient boats of one class would be available for the Championship Race.","o March 1960. CAVEAT EMPTOR, By \"BARNACLE \" If you are thinking of buying a second hand boat, you will be faced with a great number of decisions, some obvious and others not so obvious. The first two things to decide are the type and size of bcat you want, and the total amount of capital you are prepared to invest. Having settled these points you can start looking round the market. You may find several possibles. Let us have a look at the alternatives that may present themselves. Firstly there is the newish boat, probably at the top limit of your size range. This boat will depreciate in value as she gets older, but against tuis maintenance bills should be low. If the boat is of a type of which several have been built over the years, you will be able to get an idea of the average rate of annual depreciation over the class. If you buy this boat, be sure she is what you want, as if you start altering radically the accommodation or sail plan you will see little, if any return for your money and labour when you come to sell. Next comes the older boat, may be slightly larger and slightly cheaper, but still basically sound. She may need minor repairs to bring her into really good order, but nothing serious. Her value will not change much over the years, but maintenance will be more; anything from 5/~ to £5 per hours sailing each year, depending on the standard you set and the amount of sailing you do. Thi; boat will probably, over the years, be the cheapest to buy, as if you take care of her, you will be able to sell her for anproximetely what you paid. The third alternative is a really old beat, at the top limit of your size range, and the bottom limit of your price range, needing quite a lot of work to get her into reasonable condition. If you are prepared to put a lot of time ard labour into the job, she may prove a good buy, but any large sums of money you spend on her will be completely thrown away, as maintenance will probably be heavy and no amount of ncncy and work will increase her capital value very much. Lastly there is the possibility of buying a real old wreck with only a couple of season's use left in her. She will be very cheap, and you can sail her to pieces, regarding the money spent as a dead loss, apart from what you may get from a scrap merchant for any lead, copper, etc., she may havee If you buy a boat of this type, mind she doesn't fall apart under you when you are sailing, possibly drowning you, and certainly losing anything you might have sold as: scrap Whatever size and age boat you buy, be sure that the initial cost plus all repairs, alterations etc. is within your price range, and represents a reasonable value for the boat. Most of the'bargains\" one sees advertised are bargains for the vendor only. Beware of musual tyves of boats which will have only a limited resale market and in particular, beware of conversions. On buying any boat over about three tons,get a good professional surveyor. Avoid fisherman and longshoremen - their ideas of a sound boat are usually optimistic to say the least,and in the more expensive classes, the possession of a favourable surveyors report will often help if you want to borrow money to buy the boat. No matter how small the boat you intend buying, get an independe:.t opinion on her waless you are very well acquainted with 211 the ills likely to affect a boat. When contemplating buying a larger boat, it will probably pay you to get a friends' opinion before engaging a surveyor, as he may find some defect sufficient for you to reject the boat without the expense of a full survey. There are several good books on the market dealing with the surveying and repairing of old boats, and anybody about to invest in a second hand boat would be well advised to read as many of these as possible. No matter how new a boat is, treat it with suspicion. Even a month old boat may have cracked a rib or two, or she may even have been so badly built that the original owner would not have her. Never forget that it is entirely up to you to see that you are getting value for your money. A very few owners may take pity on your lack of funds and let you have a good boat cheap, but these owners are extremely rare, you are most unlikely to meet one. Also, most yacht brokers are acting for the vendors, so treat their remarks with a grain of salt, they want their commission. As they usually value their good reputations they probably won't lead you right up the garden path. One last point to watch, having found a boat at a price you can afford, make sure you can afford to run it when you have paid for her. The larger or older the boat, the more will be your annual maintenance bill. Finally, always remember - The surveyor and his report. \"Barnacle\"","AB> ton! oe iLbe BOY,(heed bond 7 aes a ditibetdt ote voy iT ‘ ened: oe sor sradde Bits avosvdo aioe| scotetosh. 20. teddin ee B , dae adres wey geod to. 8: Ey. face edyd sit ste sites egaidd owt tetht act 7 egeds hat diee perch steovat cae C 4 so ‘to davon Ledot os = a8 [Ein woe fate ot ort inmon geticol gendu cav voy. edniod ares niteri = ner Lo envert snoeste$mye fant acvidemiedts add $s Yoel * svar ey dod flit aed giitt = Oy { cet oft te yidddore .deod desven end ef Binone 2 eonacedninn 8 deniegs duc tele eden ede es oviey of edsioagab’ cetaay add neve dftnd css : ee to sqzt s to sik teod ad? IL .wol ed “Save. to LPatootnehl!fax ater agetovs odd Yo sSbi cs ton ot aids ed [ihr soy State HOY TL .es Saew voy tedy es ota ote od teed slid yud voy 22 .eaclo ont = ti — sus Lfiwevoy sigLien se soitsbomiooos ett yiisether gairodis: rae! + kige”Gf Sio5 (poy, nad ‘ese dst bas Yorom suoy rot emus et ; ompisede seete Ags segrel yitdetle od, yan tao 19839 odd eenpo dxof xE AO ofcl isi y ad ot Bt isgot tonia bees yx. ede bance yflnotesd. [{ite gud. asp eile wh /-savotaes gridtas dud giaihto Boog RE: pene‘a9 at] ot =\\0: moat Buti eTou adiff: escasedaten ted siete giailiseto davotis edd brs decoy bishaste end uo geihneres .ra8y Hoe th Be. ed ee=3 : se ad 1 OESOY atid steve Drea fiiw tuod= 3 ~bisg yoy tecw“Maton moirca tol ted fiea pt efda od 10h soy ered teo9 ‘sete Rees ‘teae crm ae ta aod: Blo yilset » 2i evitsiietis imtse efT (- : E i ito jamst notsed add han .oack FOd-. . ; ——coreg elder sae: o¢at tif toy Ba - ans cored ysis dd. 42 s ond otal *tpedat ‘ Lita ———ee wots ylade Tein i Litw ied no basqs i tanghia of fas yyaed sieaten 3-mes $93 wey ekut Id daod » quot eabruoyb- = tenoq BSenta se00 BHELST Bast! :
