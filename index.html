<title>Navigans Archive — Marconi Sailing Club</title>
<style>
  :root{
    --ink:#17232B; --ink-soft:#4A5A64; --stock:#E9E4D6; --sheet:#F7F4EC;
    --violet:#4B3A8F; --violet-wash:#DFD8F0; --sea:#2E5C6E;
    --rule:#CCC3AC; --rule-soft:#DFD8C6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--stock);color:var(--ink);
    font:400 17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:0 0 4rem}
  .wrap{max-width:780px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}
  body.reading{overflow:hidden}

  header{padding:clamp(2.2rem,7vw,4rem) 0 1.5rem;text-align:center}
  h1{font:400 clamp(1.7rem,7.2vw,3rem)/1 "Iowan Old Style",Charter,Georgia,serif;
     letter-spacing:.34em;text-indent:.34em;margin:0 0 .9rem}
  .strap{font:400 clamp(.82rem,2.9vw,1rem)/1.4 "Iowan Old Style",Charter,Georgia,serif;
         color:var(--ink-soft);margin:0}
  .rule-pair{border:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);
             height:4px;margin:1.4rem auto 1.2rem;max-width:560px}
  .tally{font-size:.9rem;color:var(--ink-soft);margin:0}

  .finder{position:sticky;top:0;z-index:5;background:var(--stock);padding:.9rem 0 .7rem}
  .finder::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;
    background:linear-gradient(var(--stock),rgba(233,228,214,0))}
  .field{position:relative;display:block}
  input[type=search]{width:100%;font:400 17px/1.4 inherit;color:var(--ink);background:var(--sheet);
    border:1px solid var(--rule);border-radius:4px;padding:.85rem 2.6rem .85rem .9rem;
    -webkit-appearance:none;appearance:none}
  input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
  input[type=search]:focus{outline:2px solid var(--violet);outline-offset:1px;border-color:var(--violet)}
  .clear{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);width:2rem;height:2rem;
    border:0;background:none;color:var(--ink-soft);font-size:1.3rem;cursor:pointer;display:none}
  .clear.on{display:block}
  .years{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
  .yr{font:400 15px/1 inherit;color:var(--ink);background:none;border:1px solid var(--rule);
      border-radius:999px;padding:0 .85rem;min-height:38px;cursor:pointer}
  .yr[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
  .yr:focus-visible,.clear:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
  .count{font-size:.86rem;color:var(--ink-soft);margin:.9rem 0 .2rem}

  ol{list-style:none;margin:0;padding:0}
  ol>li{border-top:1px solid var(--rule-soft)}
  ol>li:last-child{border-bottom:1px solid var(--rule-soft)}
  .entry{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;
         color:inherit;cursor:pointer;padding:1.05rem .25rem}
  .entry:focus-visible{outline:2px solid var(--violet);outline-offset:-2px}
  .line{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.3rem}
  .when{font:400 1.22rem/1.2 "Iowan Old Style",Charter,Georgia,serif}
  .no{font-size:.84rem;color:var(--ink-soft)}
  .tag{font-size:.72rem;color:var(--violet);border:1px solid var(--violet);border-radius:3px;padding:.1rem .38rem}
  .tag.warn{color:var(--sea);border-color:var(--sea)}
  .contents{margin:0;color:var(--ink-soft);font-size:.95rem}
  mark{background:var(--violet-wash);color:var(--violet);border-radius:2px;padding:0 .1em}
  .snips{margin:.55rem 0 0;padding:0;list-style:none}
  .snips li{border:0;margin:0 0 .3rem}
  .snip{display:flex;gap:.55rem;font-size:.92rem;line-height:1.45}
  .pg{flex:none;color:var(--ink-soft);font-size:.78rem;padding-top:.16rem;min-width:3.1rem}
  .quote{font-family:"Iowan Old Style",Charter,Georgia,serif}
  .more{font-size:.84rem;color:var(--ink-soft);margin:.25rem 0 0 3.65rem}
  .empty{padding:2.5rem .25rem;color:var(--ink-soft)}

  /* ---- reader ------------------------------------------------------ */
  .reader{position:fixed;inset:0;z-index:20;background:var(--ink);display:none;
          flex-direction:column}
  .reader.open{display:flex}
  .bar{display:flex;align-items:center;gap:.7rem;padding:.55rem .8rem;
       background:#0F1A21;color:var(--stock);flex:none}
  .bar .title{font:400 1rem/1.2 "Iowan Old Style",Charter,Georgia,serif;flex:1;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar button{min-width:44px;min-height:44px;border:0;border-radius:4px;background:none;
              color:var(--stock);font-size:1.15rem;cursor:pointer}
  .bar button:disabled{opacity:.32;cursor:default}
  .bar button:focus-visible{outline:2px solid var(--violet-wash)}
  .folio{font-size:.86rem;color:#9FB0BA;min-width:5.4rem;text-align:center}
  .stage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;
         padding:1rem;-webkit-overflow-scrolling:touch}
  .stage img{max-width:100%;height:auto;background:var(--sheet);
             box-shadow:0 2px 18px rgba(0,0,0,.45);border-radius:2px}
  .thumbs{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem .8rem;background:#0F1A21;flex:none}
  .thumbs button{flex:none;width:44px;height:56px;border:1px solid #2C3D47;border-radius:3px;
                 background:#16242E;color:#9FB0BA;font-size:.78rem;cursor:pointer}
  .thumbs button[aria-current=true]{border-color:var(--violet-wash);color:var(--stock);background:#243744}

  .detail{display:none;padding:0 .25rem 1.15rem}
  .detail.open{display:block}
  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;font-size:.92rem}
  dt{color:var(--ink-soft)} dd{margin:0}
  .note{margin:.85rem 0 0;padding:.6rem .75rem;background:var(--sheet);
        border-left:3px solid var(--sea);font-size:.9rem}
  .read{display:inline-block;margin-top:.9rem;min-height:44px;line-height:44px;padding:0 1.1rem;
        background:var(--ink);color:var(--sheet);border:0;border-radius:4px;font:inherit;font-size:.95rem;cursor:pointer}
  footer{margin-top:2.5rem;padding-top:1.2rem;border-top:1px solid var(--rule);
         font-size:.84rem;color:var(--ink-soft)}
  footer p{margin:.35rem 0}
  @media (prefers-reduced-motion:no-preference){
    .detail.open{animation:drop .18s ease-out}
    @keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  }
</style>

<div class="wrap">
  <header>
    <h1>NAVIGANS</h1>

    </label>
    <div class="years" id="years"></div>
  </div>

  <p class="count" id="count"></p>
  <ol id="list"></ol>

  <footer>
    <p>Scanned at 300&nbsp;dpi from the club's bound set and read by optical character recognition.</p>
    <p>Recognition is good but not perfect on sixty-year-old typescript, so an occasional word is misread.</p>
  </footer>
</div>

igible for haicicap vaces. G. Wardell (Sailing Secretary) BULLD A FLEETWIND 1! At the end of the 1953 seasor., the Marconi Sailing Club Committee decided to promote the adoption of a Ore Dosign racing class. After careful consideration, the 12 foot \"Fieetwind\", a new design by Alan Hckford, was chosen, It showed a high performance and could be amateur built easily and cheaply. Woreover, the cluss was growing in popularity both at Maldon and on the South Coast, The Fleetwind Association had been formed, which kept a register of boats, issucd sail numbers, defined class rules and arranged National open meetings. Owners woulc. therefore be able to compete not only in Club races but also in open competition elsewhere, the craft being light enough to be transported by car, The success of the design is now indicated by the increase in the number of boats being built. The number of sail numbers issued has doubled in just over two years and now stands at over 300 (Jan. 1957). Club members who built boats found it a straightforward job. The hull is made in the inverted position on a set of four temporary moulds set up from the floor, and cie permanent frame which is left in the hull when it is lifted from the moulds. The longitudinal members - hog, chines and gun'tls are of mahogany and the skin is 5 milli-metre resin bonded plywood. Tho ply! dccks which are fitted after the hull is lifted from the moulds complete tlhe \"box girder\", producing a light, stiff hull into which cre fitted a dagger board box and thwart. All joints and seams are glued with synthetic resin making an extremely durable and watertight job. With a few minor exceptions no ply'edge is left exposed. The mast is a 20 ft. silver spruce, hollow spar,’ made by glucing together two halves, each half having a semi-circular groove spindled out of it. A circular groove in the after edge of the mast carries the luff rope of the 55 square foot bermudian mains'1. The mast is fitted at its heel with a screw jack w ing at 7.00 p.m. Mr. and Mrs. Eric Hiscock will give a lecture with slides describing their world voyage in Wanderer III. A charge of about 2/6d. will be made which will include a Buffet. Will members wishing to accept this invitation please notify the undersigned as soon as possible so that the Blackwater Sailing Club may be told how many visitors to expect. (Sgd) G. Wardell Sailing Secretary Room 54 Baddow. SATLING NEWS A handicap race has been fixed for Easter and boats should be ready— in good time. The Section Clubhouse badly needs cleaning up. Voluntecerg for a working party are required for Saturday 23rd. March 1957. The more help there is ~ the less time the job will take and the cleanliness of the club-house should be the interest of all sailing members. Sailing programmes will be ready sometime this month and will be issued without delay. Annual subscriptions are now overdue and members are requested to contact one of the undermentioned members of the Committee without delay. Membership cards for the current year will be issued with the receipt of payment. Mr. G. Wardell, Researca Laboratories, Baddow Mr. A. Adam, Writtle Mr. W.J. Hodge, Room 422, New Street, Chelmsford. A launching trolley has now been purchased and a launching ramp is under construction to be ready in time for the opening of the season.- The following letter has been received from Messrs. E.K. and J. Feesey of Maldon, Agents for the Navigators and General Insurance Co. Ltd. Various documents, including specimen policies were also received and can be seen by members of the Section upon application to the Secretary.","E.K. & J, FEESEY NORTH ST., MALDON, ESSEX Insurance Brokers Tele Maldon 280 and 475 20th. February, 1957. The Publicity Officer, The Marconi Sailing Club. Dear Sir, Racing Dinghy Insurance We have watched with great interest the growth of your Dinghy activity in the Maldon area, and in consequence would like to offer our services in the arranging of your Members! Dinghy Insurance, The Navigators & General Insurance Co. Ltd., the only Office specialising in Yacht Insurance, have introduced a special Class Racing Dinghy policy, which is both comprehensive and economical. It incorporates without extra charge, racing and transit risks. A specimen policy and a supply of proposal forms are enclosed and, ~e as we are in day to day contact with their Hast Anglian Office and Under-— writer at Colchester, immediate cover and prompt specialist service can be offered to your membership. May we be permitted to render this service? Yours faithfully, ok. & J, FEESEY. (Sed) Feesey FITTING-OUT SUPPER As already announced in a previous issue of the Bulletin, this event will take place on Friday 5th. April, 1957. A coach has been laid on for the evening in order that those whose attendance was dependent upon transport facilities could be present and so that those whose petrol alloc- ation is somewhat restricted might have alternative means. The cost per person for the return journey will be 2/6a. om Those members wishing to attend the supper are invited to complete and detach the application form at the foot of this page and return it to the Secretary in Room 422, Marconi House by Friday 29th. March, 1957. The price of tickets is 4/~ per person, exclusive of transport. CROPS OCH ETO SSO ECHO DOME OO EDC ERD ED ETE ETO REO O OEE SO SET OR DOSER ODT ESE ESTOS EDD OOO OO HOD DOC ESOS. PITTING-OUT SUPPER Tos- The Hon. Secretary, 1957 Sailing Section, M.A.S.C. Please reserve me tickets for the Fitting-Out Supper to be held at the \"Jolly Sailor\", Heybridge on Friday, Sth. April, 1957. * Coach seating accommodation is required. (*) Delete as required. I enclose herewith the total of in full payment of the cost of tickets. (Sgd)"]},{"year":1957,"month":4,"no":"4","vol":1,"when":"April 1957","span":null,"contents":"Sailing courses, 'Going Foreign' log, 'True as a Turtle' film","note":null,"file":"MSC-NL-1957-04.pdf","imgs":["1957-04-1.jpg","1957-04-2.jpg","1957-04-3.jpg","1957-04-4.jpg"],"pages":["\"NAVIGaAawN Ss\" Monthly Bulletin of the M.A.S.C. Sailing Section Editors W.J. Hodge (Hon. Secretary) Issue No. 4 April, 1957 Now that the Sailing Season is almost with us, when events of common interest become aimost a daily occurence, your editor expects to be inundated with copy for each issue of the Bulletin, Please ensure therefore that any items for inclusion are received by the first Wednesday in cach month at the very latest. A word about annval subscriptions. They are now considerably over- due and should be paid without further delay. A member of the Committee has been appointed to act as Treasurer in each locality so that members will have no difficulty in making payment. It has now becn decided that the Extraordinary General Meeting, proposed, seconded and passed at the Annual General Meeting in November last, will be held at the M.A.S.C, Club premises, Victoria Road, Chelmsford on Thursday 9th. May, 1957 commencing at 8 p.m. All members are requested to attend, since the subject under discussion, i.e. the proposed new premises for the Section Clubhcuse requires a gereral concensus of opinion. SATLING NEWS The following letter has been received from the Central Council of Physical Recreation and may be of interest to members of our Section. 6, Bedford Square, London, W.0.1. Tos The Secretary, 6th. March, 1957 Dear Sir/Madam, Burnham-on-Crouch 1957 Sailing Courses The Central Council of Physical Recreation has arranged for six Sailing Courses to take place at the Royal Corinthian Yacht Club, for beginners, during the Summer, and for each we need eight voluntary instruct- ors for the boats. I should be most grateful if you could agree to let your Club members know that the C.C.P.R. Sailing Committee would very much appreciate hearing from anyone who could be recommended, and who would be willing to help us for a week or more as an instructor. The weeks of the courses are as follows:= No. lll Sunday 16th. June to Friday er. The previous week, we had all been watching the weather, would the wind be kind to us and not make us spend a \"“Land-lubber's\" holiday at Ramsgate, with our passports lying dejected in a locker, the wind shrilling about the rigging and our thoughts having already gone foreign, far away from \"The Brassy Blondes\", \"Fish and Chip\" Shops, also the \"Kiss Me Quick\" Hats of that South-East Coastal resort. Fate was being kind to us, for the sun was shining and the wind was steady from a North-Easterly direction. The sails were ready to be hoisted, the engine was drumming away, the last lines were gathered and now \"Lolli- poppet\" began to edge out of the harbour towards the open sea.","3. We arrived off Pover at 6 p.m. - She skipper decided to chance the go passage across the Channel alth10U &aa visibility was not all t good. that Steaming along in the dusk with the wind still we ctbe steady, all the crew's eyes ‘3 were beginning to searsh for thelandfall 1 ch sould have =bh been in sight, os or the flashing _teent which beams for bwely miles from Calais 4 Harbour. At aast we were sure that Calais was only ab out:rnan hour away y and that uncanny whistie of those rather tall French Buoys seemed to herald our arrival. Lollipoppet was just about to enter the narrow claw-like piers of Siais Ha ppeue when to our horror, thudding out of the darkness came a Cross- ‘RQIoD ‘hannel Stcamer and we realised that we had not got any lights showing at all. Favoc raged, everyone chased about looking for the navigation lights and et ong last, someone managed to get Port and Starboardshowing. fs The steamer assed very close to us and Lollipoppet wallowed in her wash for what seemed ixe eternity. The Skirper was up early next morning, having woken the crew up by shouting grectings to other boats flying a British flag, for Calais in the Sumer has more English poate anchored in her basin than her own French ships. The youngest member of the crew who was five, became quite disappointed at still hearing her own language being spoken all around. Having stowed away all the breakables, eaten a heavy breakfast (some of the crew need not have bothered te eat bacon and eggs, for the meal was going to stay such a very short time before being tossed to the waves )s the crew started to haul the anchor aboard, but it just would not move. Time was pressing, for we wanted to catch the flood for some of the way to Dunkirk. We found that the anchor claw had been caught underneath a cable which had to be lifted in order to free the anchor. Tempers became very frayed, the crew wished that they had frogman suits and it seemed that the anchor was going to remain in the murky water. Then, a motor-boat manned by two Frenchmen came alongside, fixed a line to our anchor chain pulled hard astern. After that, to everyone's relief, the anchor could at last be stowed. Beating along the monotonous coastline towards our next port, Dunkirk, on the way to our destination Holland, the sea was getting uppish and two members of the crew were already sick, but the sun was shining and we were slowly getting toward that light-house at the entrance to Dunkirk arbour eoceesoe (to be continued) NORUE AS A TURTLE\" -~- FILM We fecl sure that members o:my @ Club will welcome the news that \"True as a Turtle\", our new comedy about p eoplo who 'mess about in boats', will be coming your way very soon. 'Turtlet is an 1898 vintage ketch, skippered by that fine comedian, Cecil Parker. On board, as his crew, are John Gregson -— he's lost his 'rings! since he captained H.M.S. Exeter inthe Royal Film, \"The Battle of the River Plate” - with pretty June Thorburn as a honeymoon couples that meee Australian, Keith Kichell, and a pert little pixie named Elvi Hale, who's had all the critics raving about her. We know that this is blatant publicity abd we make no apology for it, because we should be to blame if you were to miss this film through lack of publicity. So if this can be posted on your club noticeboard we should be very gratefuls and we think that » in roturn will be grateful to producer Peter de Sarigny and director “endy Toye for bringing you such a chuckling comedy Dare we suggest a litsle preliminary 'splicing of the mainbrace', and they. club party visit to see “ruc as a Turtle\"? We can safely promise you a good fuugh. Yours very sincerely, THE RANK ORGANISATION."]},{"year":1957,"month":5,"no":"5","vol":1,"when":"May 1957","span":null,"contents":"Exchange & Mart, Bexhill Sailing Club, part 2 of 'Going Foreign'","note":null,"file":"MSC-NL-1957-05.pdf","imgs":["1957-05-1.jpg","1957-05-2.jpg","1957-05-3.jpg"],"pages":["NAVIGANS \" Monthly Bulletin of the Sailing Section - HLA 5.C. TSSUH NO.5. Editors Wed. Hodge. MAY 1957. (Hon. Secretary) Ty make the Bulletin a permanent feature, it is essential that the support of all members of the Section be forthcoming. In the past, contributions have been solely from the Committee and although every effort has been made to keep the issues on a basis of general interest, we are never quite able to make the bulletin as fully comprehensive as we would like, Give us your co-operation, therefore, and show thereby your appreciation of the efforts of your Committee. Members are reminded that this year's subscriptions are now long overdue. The success of the Sailing Section is determined mainly by the availability of funds and by propagating interest in others to seck membership. It is essential therefore that all monies due in the form of subscriptions and storage be paid as early as possible so that your Committee will be at all times supplied with funds to ensure an enjoyable and comforteble season. Please make your subscription or other payments to the Treasurer, Room 422, Marconi House, Chelmsford, Essex. All members are again reminded that the Extraordinary Gencral Meeting proposed and adopted at the last Annual Gencral Meoting will be held at the M.A.S.C. Club Room, Victoria Road at 8 p.m. on Thursday, 9th May 1957. The purpose of this meeting is to instruct the Section in the activities of the Committec regarding the new club-house premises and to seek the wishes of the Section before going ahead with present plans. This is a matter which should be the concern of all active mombers of the Section. Please make every endeavour, thersfore, to attend this mocting and give your point of view so that your Committee will have the best possible idea of genoral regquircments. In the tuning-up race on Easter Sundey, \"Nuts and May\" (7. .Hallam) was first, followed by \"Lagonda\" (G.Nichols) second and'\"Rainbow'( E.G. Payne) third. eaeoo0eoceseegeeogceon eres dooag pxchange & Mart. FOR SALE. 2=- 20! x 3 x 2\" planks ungrooved and unfinished suiteble for \"FPleetwind\" Masts - price £2 lot. Apply Mr.T..Hallam, Baddow Drawing Office. An unlimited quantity of 1}\" Italian Hemp is available from Mr.G.Adam, Writtle at i/ld. per fathom length.","The Following Letter has been received by the Secretary and is published as being of general interests BEXHILL SAILING CLUB, Channel View Hast, Marine, BEXHTLL-ON~SEHA. Sussex. 23rd March, 1957. Dear Sir, Bexhill Sailing Club is holding a Sailing Week this ‘year from Saturday, 15th June to Friday, @lst June. Five local Clubs will be taking part in the racing and there should be good competition for Kerlin/Rockets, left. Nationals, 12ft. Fireflies, Y.W.G.P's, Enterprises and Handicap craft. Bexhill is a residential seaside town, only sixty~five wiles from London, and is especially suitable for family holidays. Bathing is safe, and there is a good stretch of sand at low tide. There are plenty of well-run, yet reasonably priced hotcis and boarding—houses,. Any of your members who may wish to come to Bexhill for this Week will be very welcome and will be made Honorary Members of the Club. IT enclose details of the events which will be organised and shall be pleagzed to furnish you with eny further particulars with regard to the Club and accommodation in the TOWN » ; Yours faithfully, Hon. Sailing Secretary. PART IT The fresh breeze h 1d the whole way to Dunkirk, so that we vere able to make a fast pas SAE 6 The harbour was filled with a miscellany of vessels. Tucked away however, MH. in a quiet corner we spied another British ship and we decided to tie up alongside this lovely locking boat of about ten tons. We all read with sadness a year later that she was lost in the chamnel in a very severe gale. After a fow hours we were hailed by a rather comical-looking figure on the quay, he was, in fact, the Customs man. The Skipper offered him some refreshment while the crew searched for their passports. At last ell were found and the Customs man seemed loathe to leave the boat on this very hot afternoon and the Brandy bottle only half empty!","Wext morning we left Dunkirk and as it was rather hazy the Fog Horn on the edge of the harbour bade us a melancholy farewell. Everyone was rather tense, for in front of us lay a tricky piece of navigation \"The Zuydcoote Pass\" . This is a very narrow cut in the Sands. The First Mate hed the glasses and the lead line was being thrown overboard every few seconds, but at last we were through, Skipper became a normal human being again, coffee was served and we knew that if the breeze held, we would be in Belgium by late afternoon. \"Lollipoppet\" was made secure in a very snug berth in Ostend. The fomale members of the crew had already gone ashore but not without firm instructions from the Skipper to be caroful with the Belgian money and to make sure we kept our stcamer fare to England, as it might blow nard on our way home. We stayed three days in Ostend, for it has everything to offer the tourist, a lovely harbour, a very hospitable North Sea Yacht Club, wonderful sands, cheap smokes, drinks and shops that never close till the carly hours. The weather was perfect for our trip from Ostend up to the Island of Walcheren. At Flushing there is the entrance to the Vere Canal, which runs right across Walcheren to Vere. Everyone felt excited exploring our first ever Dutch Canal. We all had planned on long dark winter evenings of going up the waterways in Holland, but it did not scom possible that at last we were really here. Having reached Vere the Skipper and the First Mate decided to go ashore to do some shopping. Unlike Ostend, most of its shops were closed, but they did manage to find one open. This shop scemed to sell everything, so they asked the gaunt-looking shopkeeper for some bacon. He bought everything on to the counter except what was asked for, then a pad was produced, a pig drawn; hope gleamed in his eyes. They waiteds back he came with an enormous ham! Then the first mate in trying to explain further by signs, fell back right into the refrigerator. The Skipper looked to find him amongst Ices, Choc Ices and Lollics. They were both convulsed with laughter, and looking back to the counter, the Dutch shopkeeper remained unmoved and you could almost hear the words of Noel Coward echoing out of his mouth \"Mad Dogs and Englishmen.\" The boats all around us at Vere seemed to be impatient to be away, for they, like ourselves, were on holiday. We had to wait some time before we could get through the lock and out on our way to Dordrecht. We were, in fact, never going to reach our destination. To be concluded."]},{"year":1957,"month":6,"no":"6","vol":1,"when":"June 1957","span":null,"contents":"Orion, May & Butcher Enterprise, Thames Sailing Rule amended, part 3 of 'Going Foreign', Charlotte Cottam","note":null,"file":"MSC-NL-1957-06.pdf","imgs":["1957-06-1.jpg","1957-06-2.jpg","1957-06-3.jpg","1957-06-4.jpg","1957-06-5.jpg"],"pages":["NAVIGAWN S* Monthly Bulletin of the Sailing Section, M.A.5.C. Editors W.J Hodge (Hon. Sec.) ISSUE NO.6. JUNE, 1957. In spite of repeated requests, annual subscriptions are only trickling in. It has already been pointed out that the success and smooth running of any club is dependent mainly on availability of funds. Ours is no exception and we do therefore urgently request all members who have not already done go to send thsir subscriptions to the Treasurer, Room 422, Marconi House, who will be pleased to supply current Membership Cards by return. The General Committee of the M.A.S.C. have agreed upon a Quarterly Conference of all Sections, the first to be held on Thursday 13th June 1957 under the chairmanship of the President, Mr.F.N. Sutherland, with invitations extended to one official and member of each Section. In view of the limited space of time available before the first Conference, nominees were appointed by the Committee in session on June 5th, but for future such Conferences, we shall be glad to receive the names of those wishing to attend. In putting this proposal to the section, it is necessary, I think, for future nominees to stake their claims on the privilege so that priority can be given to the most deserving. Two motor wheels with tyres and axle are available from Mr.Jolliffe, Room 26, Great Baddow. They are suitable for making a trailer and are offered at £12,.15.0d. @oGGe OOS G26 58 0G6258 84 _FOR SALE \"ORION\" West of England Redwing Class Sail No.42. Lengths 14~ft. Beams 4-ft. 6—ins. Sail Areas . 125~aq. ft. Clinker Built 1948, C.B., half decked, two suits sails by Jeckelis - 1952 - virtually unused, oars, buoyancy bags, cover, mast and ali rigging, hull and decks varnished. Lying five minutes from Wickham Bishops Railway Station, transport can be provided by appointment - Wickham Bishops 370, preferably evenings or woekcnds. £80.0.0d. or nearest offer. Applys tT, Hak, Five Gables, Groat Braxted, Nr. Witham, Essex. Tel.No. Wickham Bishops","Sailing News. In the Fleetwind points series race held on Sunday June 2nd in almost ideal conditions, \"Muggs\" (B.H.Cottam) was first, \"Lion\" (G. Wardell) second and \"Nutsy May\" (T.W.Hallam) third. With a light easterly breeze Course D was a fetch on the starboard tack to Hilly Pool then short and long boards out to the North Double. A gybe then, and an easy run back to Herring Point for the close haul to this finish. Sailing Tuition. Members feeling the necd for elementary instruction in sailing should contact either C.Clarke, Room 54, Great Baddow, ext.42, or T.W.Hallam, Baddow Drawing Office, who will be pleased to arrange trips. ecsaeeeoeecee Geoegreseege The following advertisements may be of interest to the Section and are published accordingty. ~ \"Light Craft\" Link House, Store Street, To The Secretary. LONDON.W.C.1, Dear Sir, Although the older clubs are not so badly affceted, I know that many of the newer ones meet with difficulty at this time of the year when orgenising Sailing Committecs. To help clubs and provide useful help and guidance to members who arc hazy about the dutics of Sailing Committees, Ian Proctor has prepared a special article on the subject which is featured in the May issue of LIGHT CRAFT, on sale April 15th. This article will cover the dutics of a Sailing Committee concerned with normal club racing and also with the organisation required for running the larger Open Meetings. It will detail the preliminary information that has to be given to competitors, the arrangement of courses, advertising times of starts, rescue facilities, time keeping, recording finishing order, protest cases, publication of results to competitors and so on. Prepared by such an authority as Ian Proctor, this feature will, I am certain, be of great value to the clubs and it is for this reason that I am sending you this advance notice about it. if you place an order with your own newsagent now you will be able to obtain copies of the May number but, should you mect with difficulty, we shall be plceascd to supply you direct if you will send a remittance of 1/8d. to cover cost of copy end postage. Yours sincercly, P.&dordany, HOITOR«","May & Butcher Lid., Heybridge Basin, MALDON. Essex. The Secretary, The Marconi Social & Athletic Club, 3rd May, 1957. Yachting Section, CHELMSFORD. Essex. Dear Sir, News Chronicle \"Enterprise\" One design Dinghy. We have recently completed one of tho above, and would be very pleased to arrange for any of your members to inspect at our Works by appointment. his is shipwright built and is a first cless job. throughout. Brief specification is as followss- Lengths 13ft. 3 ins. Boam 3 5 ft. 3 ins. Draught: C.B.e up 7 ins. Draught: CB. down 3 ft. Rigs Bermudian Sloop. We offer this complete with mast, boom and rigging but without sails for the sum of £110. Sails can be obtained however, from approximately £13.10.0d. for 2 set of cruising, up to £26,10.0d. for a mildew proofed water repellant racing set. Hire purchase terms are available and it wili be greatly appreciated if you will kindly bring this vessel to the notice of your members. Further information will be gladly submitted. Yours faithfully, MAY & BUTCHER LTD. OR e2eKHH SED eeeeoe8ooe0Ge2 The following oxtract from The Times is published as boing of general interest - \"Thames Sailing Rule Amended . The disquiet which the new by-law proposed by the Port of London Authority for the navigation of sailing vessels on the Thames caused last February among those who sail them seems to have been wholly appeascd. Complete satisfaction was expressed yesterday by Mr.Francis Usborne, sccretary of the Royal Yachting Association, with an amendment which the authority have drafted after discussions with representatives of London sailing clubs. In its new form the clause states that sailing vessels above London Bridge must avoid crossing the bows of an oncoming power- driven vessel “whon to do so would involve the risk of a collision.” Originally it had simply stipulated that every such vessel \"shall be navigated so as not to cause obstruction to any power-driven > te vessol\",","Deseribing the amonded version as \"abosolutely reasonable\" Mr. Usborne said the change would mean a great deal to yachtsman. \"As the rule stood\", he said, \"in theory you could not put a sailing boat on tho Thames at all because you might not be able to carry out the law.\" Now yachtsmen would have all the rights they needed, while motor vessels would have the right of way when they must have it, Mr.Usborne omphasised that the settlement of tho issue would have more than local significance, Other harbour authorities, he was convinced, had beon watching the P.L.A., and if sailing vessels on the Thames had been \"bull-doged\" out of their rights there would probably have been \"similar reactions from every part of the country. Ho did not think any objections to the new clause were likely. It had been prepared in collaboration with the representatives of London yachting clubs.” eeeeeooceoeeee sone ge as GOING FOREIGN By Charlotte Cottam. Chapter ITI. How hot it was as we engined our way around the Island of North Beolland, Everyone was gay for today was to be the climax of our cruise. How new and exciting it all was, now that we had reached that very busy waterway, the river Maas. We lost count of the number of Dutch Lighters which had the appearance of fashionable maisonettes, with net arranged at the portholes and window boxes which were a mass of colour on the deck and also there wore lines of washing, The time by now wass 4 Pem. and we wore still quite a considerable way from Dordrecht. Thore was no wind to help us over this six knc tide. Skipper had become veroy anxious for it was now clear we wore not to reach our destination. Fate was being kind to us again, for a small morn boat which wehed been following suddenly made for the bank and disappeared behind a scawall, Then Skipper threw discretion to the wind and followed; everyono held their breath for the inlet looked very shallow indecd. The lead linc was thrown overboard and there was more than enough water for \"Lollipoppet\", After rounding the last corner we found ourselves in the most picturesque harbour we have ever scen —~ Willenstad. We all still remember this delightful anchorage and quaint littic town. if you really want to sec Holland at its best it is these little back watorways you must visit. That cvening we just could not got over how lovely Willenstad was end how very kind the peopic wero Us, insisting on oc i shopping cown to the boat.","The Skipper and the First Mate had got the boat under way by five in the morning, but the rest of the crew could not sleep, for the wind had indecd freshened and we were really making heavy weather of this passage, By noon the wind was almost at gale force so we decided to run for shelter to Aierikzec. Again it looked as though we were meant to visit this flourishing town. The crow dashed eshore and did some shopping, but we had hardly climbed back aboard, when the sails were hoisted and we wore away to try and reach Vere before dark. Long after dusk had fallen we reached Vere for, as so often heppens at night the wind had died right away and we had to ongine our way towards the lock. What seemed strange to us was why there should be so many boats waiting to enter the Canal at such a late hour. Unbcknown to us, they had heard the gale warning, and wore scoking shelter. The next morning it blew so hard that we were all thankful to be in a decent anchorage, but fed up to have lost one whole day for our homewerd trip. The wind did not moderate for three days and then to the female members of the crew it still seemed to be blowing hard, but we just had to start for home and fill those empty dsks that would be waiting the next Monday morning. Looking back, those next four days of our homeward trip were really quite the best sailing - for the wind was strong but \"Lollipoppet\" could take it and in next to no time we were back in Dover, with only very vivid memorics to really convince us that we had really \"Gone Foreign\"."]},{"year":1957,"month":7,"no":"7","vol":1,"when":"July 1957","span":null,"contents":"Danger to Navigation — the Stumble, Fleetwind National Championship, 'East Coast Delivery' y, Circulation Department. Adlard Coles Limited. e@eeeoneasaceoeseeeoagoeoeeasnd Exchange and Mart. For salc = Pair of Motor car wheels with new tyres, size 3.50 x 18, complete with axle and brakes, suitable for yacht trailer. - B.A.Payne, Baddow. seo peecearneaoneoeenns Hast Coast Delivery by \"Goose! = Step. by g Ae Adam. Problems \"Goose\", 33 tons Thames measurement , Sying at Surlingham near Norwichs too faraway to be convenient for weekend sailing. In any case, she is not really a suitable type of boat for the Norfolk Broads. Solution: Sail her to the Blackwater - obviously! So I had another delivery voyage to undertake, this time with my own boat. She was in reasonably seaworthy condition, but had not yet been sailed that season. As bought, she was described as \"fitted out\", but this could not be taken too literally: she had not been sailed on the sea for 4 years, so she had very littic seagoing gear. IT installed a: stecring compass (a gimbol-mounted P.1l ex R.A.F. compass), three or four useful Admiralty charts, a hand-bearing compass and a 10~fathom lead line. ' This last is now nearly able to find its own way about the Thames Estuary; 1% has explored lots of interesting unmarked channels. You can reach the sea from the Norfolk Broads either at Yarmouth or at Lowestoft. I preferred Lowestoft as there are fewer awkward bridges, although there is a lock, and Oulton Broad is a good non=tidal anchorage where \"Goose\" could be left between woek=cnds. With her previous owner","I sailed her to Oulton Broad one Sunday without mach incident except that the Reedham chain-ferry man had a long-standing grudge against \"Goose's\" previous owner, and tried to obstruct the river when we were drifting down, becaimed but in a ceknot tide. After a few abusive remarks had been exchanged we cleared the chain. We found the \"New\" Cut very shallow at the Reedham ends it was nearly low tide and “Goose's” draught of 3ft. Qin. is high for the Broads. After two attemps we wriggled our way through the soft mud. Next Friday night, Stan Daines and I returned to pick her up from the Oulton Broad yard where I had left her. We slept aboard, and next morning I went to the office to pay the bill. This puzzled them — nobody around the office appoarcd to know I had a boat in the yard! It now scomed too late to pretend I hadn't, however, so they charged me just the same. There was hardly any wind in Lowestoft inner harbour so we tricd the outboard motor. It actually worked after a time, but not for long, so we ghosted down with what little wind there was. Out at sea there was still vory little wind, force l‘to 2 from the 5.H., but the tide was right. Sometimes the wind Icft us completely, and at 1600 hours, 2 hours after leaving harbour, we were only 7 miles along the coast, opposite Covehithe church. Five minutes later we were in the same place, and after another five minutes we were definitely being swept back by the tide. We anchored and scemed almost to leap forward as the anchor dug in3 the tide was sluicing past at 24 knots. I+ was a scorching August day, and there was no wind at all by now. We ate a little - slept a little ~ checked over the rigging a little. Two hours later, there was still a strong tide, but a slight breath of wind as well. It wag no harder work to sail than to stay anchored under these condi tions, so we weighed anchor. At first we made glight progress, but an hour later were still in the same place. As the tide weakened, so did the wind. Never mind, after a day like this there must be a night breeze off tho land. At 2206 hours, the tide had changed and swept us down to Southwold with its brilliant light: 6 flashes in succession, then a few seconds darkness. There was still hardly enough wind to steer by, and wo were beginning to think that something was wrong in the theory of land and sea breeges. But wo were just being impatient: by 2220 hours we had force 1-2 and were making 3 knots most of the time. Southwold light has a red sector covering the inshore shoals, but these are mostly covered by ¢ fathoms or so, and of no danger to us in the fine weather, so wo sailed just inside the red sector, to keep out of the shipping lane. Shipping lanes are most uncomfortable; you never know whether the ship coming straight for you hasn't scen you, or whether it has and is looking to see if you are in distress, so it is much better to keep out of them if you can. The sea was full of phosphorescence. Every breaking wavelet would be fire-crested, and our bow-wave and wake were glowing. Every splash gave a sort of pin-point of light. ooe8 FEE R9KF 9K R0 060408 STOP PRESS. In the Blackwater and ColreDinghy Championships held on Sunday, 7th July 1957, Mr.C.Clarke (Rear Commodore) got second place in the \"All~in Handicap\" Class."]},{"year":1957,"month":8,"no":"8","vol":1,"when":"August 1957","span":null,"contents":"Fleetwind points series, 'East Coast Delivery' log conclusion, A. Adam","note":null,"file":"MSC-NL-1957-08.pdf","imgs":["1957-08-1.jpg","1957-08-2.jpg","1957-08-3.jpg"],"pages":["NAVIGANS?® Monthly Bulletin of the M.A.5.0. Sailing Section. Editors W.d.Hodge (Hon. Sec} ISSUE NO.8 AUGUST 1957. The Treasurer has frequently brought to your attention the noed for prompt payment of annual subscriptions, yet many members remain on the books as unpaid. You all know that the success of any club depends almost entirely on the immediate availability of funds and it is only fair that this responsibility be distributed over the Section as a whole. Your Committee is confident in the continued popularity of the amenities afforded by the Club,.which is only too evident from the recent increase in membership. With full support from all members enabling improvements in both social and sailing aspects, there is every indication that our Club could become one of the best in the district. This is our ain, possible with full support from all members, but impossible without ready cash. Come along with us, therefore, and accept your individual share of the responsibility, thus proving both your loyalty to the Section and your appreciation of the efforts of your Committce. There is another way in which your help will be of direct benefit to the Club, namely in supporting the M.A4.S.C. Football Pool. A consideretl percentage contribution from total funds is allocated to Section - facilities so that subscribing is of double interest to those who are members of our Club, i.e. the possibility of personal success financially and the definite means of cheaper sport and better equipment. ; HRHKKKKKKRKK KEE SATLING NOTES The results of recent Fleetwind Points Series are as follow:- ist. end. 3rd. Fourth Race ELH. Cottam G, Wardell TW. Hallam “Muges\" - \"Tiont\" \"Nutsy May\" Fifth Race 8. Adamson HoH. Cottam , D, Roberts \"Lagonda\" Muges\" \"Bluebell\" Sixth Race C.R. Pavitt TW. Hallam \"Muggs\" . \"Wutsy May\" Members have had some success in various open events. At Meldon Regatta Dick Pavitt won the Fleetwind Class Race in “Diabolo” and Geoff Wardell in \"Lion\" and Eric Cottam in \"Muggs\" were third and fourth respectively. Cliff Clarke in '\"Shamrock’ was second place in the Handicap Race. On the 10th. August Terry Hallam won the Maylandsea Bay Challenge Cup in a breeze strong cnough to dissuade other intending competitors who wished to preserve their gear for the Flectwind East Coast Championship on the succecding day. This availed them nothing for the crews of all fifteen entrics found them- selves swimming before long. The wind is reported to have gusted to force 9 at times. This meocting will be re-sailed on September 15th., and details regarding the new date for the seventh Fleetwind Points Series will be announced later,","ee COMING EVENTS I7the August see eee West Mersea Town Regatta c4th. August eae eos Picnic Cruise to Osca 3ist. August eos ee Blackwater Regatta , 7th. to ld4th. September soe aos Burnham Week CLUB BOATS Mombers using \"Avril\" are requested not to leave the Club Dinghy on \"Avril's' mooring but to return it to the beach for use by other mombers» KEXKKKKHKRKKE RHE The following advertisoment may be of interest to the Section and is published accordingly:- D. EVERARD LIMITED Evelyn House, ~ 62, Oxford Street, 5th. July, 1957 London, W.1. The Secretary> Marconi Sailing Club, Chelmsford, Essexe Dear Sir, We have pleasure in informing you that we have funds available to finanoa the purchase of all types of yachts, boats and other craft and equipment. We are also able to finance mortgages on registered vessels. We should be obliged if you would bring these facilities to the notice of your members, and wo shall be pleased to let you or your members have full particulars upon request. Yours faithfully, for and on behalf of D,. EVERARD LIMITED Sed. D. Everard \" HV.1 DIRECTOR KKRKRKEKE ER ER EEE Hast Coast Delivery by \"Goose\" - Step. { Concl, ) ny oye A. Adam. As night drew on, the wind increased to force 3 and moved round nearly to the North, almost a dead run if wo kopt on course. We passed Orfordness light abeeam at 0125 hours with the sca beginning to get ud. We ought to have set a fore-guy on the boom to stop the risk of accidental gybes, but discussed it and reached no conclusion, so Gidn't set one. Instead we tried \"tacking downwind\", sailing with the wind on one quarter for half and hour, then gybing and sailing on the other querter. But \"Goose! has rather a short keel and stecring a compass course this way is very tiring as she noods continual steadying","in quartoring seas, even if they are small. As we came to the Bawdsey Bank, the tide was running strongly against us again, end progress became slower. \"Tack downwind\" is bad for navigation, and as dawn broke our position was uncertain by several miles. We had cxpected to pick up the Roughs Tower, six miles off Felixstowe, but hedn't seen it in spite of its two light buoys. Our speed downwind and the foul tide, were both almost unknown. (In shallow waters, the Admiralty Tidal Atlas figures for tidal stream seem to be low, probably because they are for ships of 30 fect draught). At dawn, visibility was moderate, but there wore no identifiable marks to be seen, We were in need of a fix, and still more so a fow minutes later when sea fog started for form, leaving us with about 20 yards visibility but with a force 3 breeze. We were sailing too fast for accurate sounding, so we wound down a large reef. We got depths of almost 10 fathoms at first, and decided we must be well cut towards the shipping channel. perhaps even as far south as the fast Swin entrance. Not liking this idea of being in a shipping lane (without a radar reflector!) we steered almost West for a while, sounding steadily. Depths reduced to 4 fathoms, then up to 7. Had we come \"blind\" through Goldmer Gar into the Wallet channel, the only place we could see to explain these soundings? It weuld be too good to be true. It was, of courses we could now hear and roughly locate a reed foghorn (not to mention occasional ships bells being rung by those who had the sense to anchor, and an occasional, safely distant, stcamer siren.) We homed on the reed signel, which was obviously very powerful, and at 0930 hours nearly ran down the Cork Lightship off Harwich. About 8 miles away from where we had hoped we werel But we now had a fix. The wind had gone dowm to force 2 so we set full sail again, and with the tide under us we set course inside the Cork Sand, to vring us out to the Wallet by the Medura Channel. By sounding at reasonable intervals, we should know when we reached the Wallet by the deeper water. Twenty minutes later we saw a can buoy 25 yards aways; this was a useful check that we were on course, and a stroke of luck as visibility was still less than 50 yards. With a little more wind, we were through into the Wallet in another half hour, with several soundings of 44 fathoms. Soon afterwards the fog began to lift, confirming our position as off Walton. Even now the wind was fluky, so we wondered whether we should get to Heybridge Lock by high water, about 4 hours later. But with the tide under us, we should be all right if the wind didn't fail completely. In fact, we kept a good force 3 wind and made it comfortably, in spite of a temporary 60 deviation of the sterring compass when a weary mariner put down 2 steel table-lmife six inches away from it! The resulting apparent shift of wind direction soon excited comment, however, and we corrected our course from one down the Rays'n Channel to the intended one up the Blackwater. \"why do you look so tired?\" \"Because we last woke up at seven ofclock.\" \"That's normal, “Oh yes, but this was Saturday morning.\" Morals Kecp watches, even if the voyage is only 70 miles long."]},{"year":1957,"month":9,"no":"9","vol":1,"when":"September 1957","span":null,"contents":"All Sections Dance, RYA secretary's report, MASC football pool, laying-up supper","note":null,"file":"MSC-NL-1957-09.pdf","imgs":["1957-09-1.jpg","1957-09-2.jpg","1957-09-3.jpg","1957-09-4.jpg","1957-09-5.jpg","1957-09-6.jpg"],"pages":["GAws\" + es Monthiy Bulletin fo the M.A.S.0. Sailing Section Editors Wed. Hodge (Hon, Sec.) Issue No, 9 September? Tne uext Pew weeks will see the clo Season, and che principal social event of the year - the th Up Supper freparations are already in hand for a date in late October Further d Will be annoumced in the next issue, Meanwhile, Mr, Acthur Adam of W our Social Secretary, has charge of all arra:.genents and will do nis onsure 4 pleasant evening. His efforts, however, will be uscless full support of all members, Please do all you can, thercfore, a 4 vu o meke important function a success worthy of our Ciub. - See Stop Press, page 6, A course of lectures for the uninitiated and noviccs pe given by Messrs. Clarke and Wardell during the winter season details later. Meny of you are well acquainted with Dick Favitt, end will be sory wae y op TO hear that due to his forthcomi tions become due. Payment should be made to the Treasurer, Marconi Sailing Club, Room 422, Marconi House, Chelmsford who undertakes in return to issue current membership cards. There are many members who, in spite of repeated notices in this Bulletin, have still to pay the 1957 subscription. M.A.S.C. rules for Sections lay down that all Section accounts be finalised and balanced at the end of cash year, In order that a Balance Sheet can be presented at the appointed time and in as fully comprehensive a manner as possible, the Treasurer urges that those unpaid members remit their poe cr re one with thks minimum of further delay. HHH HH HH HK The Commodore (Mr. E.A, Payne) asks me to inform tha Section that a Tide Table and Calendar has been received from Mr. F. Taylor, Sail- maker of Maldon and that it is proposed to display the calendar in the new Club-house premises when decorations have reached a suitable stage. He alse hopes that as many members as possible will make an effort to lend a hand with the overhauling and decoration of our new headquarters. Those able to assist are invited to contact the Vice~Commodore (Mr. T.W. Hallam) at, Baddow. In this way, it is hoped to co-ordinate all available effort, us making the best possible use of volunteers and reducing time wasted to a minimum, Me Kh Me He IE Be The President and Mrs. Eastwood, together with members of the Committee were entertained by the Commodore at his home at Little Baddow on Boxing Day. XH HR * The second meeting of our Winter Series was held on December 10th. when the Club had the pleasure of the company of Mr. and Mrs. Alan Eckford. Mr. Eckford is already well known to Club members as the designer of the \"Fleetwind'; this time he was introducing some of his later designs, particularly small cruising yeohtsa of hard-chine construction. The plans of the \"Spitfire\" 20ft, cruiser were discussed in detail and the more design ecnscious of us learnt a lot of the technicalities of hard-chine boat design. Mr. Eckford's views on boat design are too controversial to be accepted by everyone, but only the most prejudiced or conservative can fail to be interested by them. He himself admits to being too \"gadget~-minded\" but his gadgets are generally carefully thought out. It is not known","ine) whether we were expected to take seriousiy his proposal to mount in gimbals the helmsman of an offshore racing yacht; even Mr. Eckford appeared, on consideration, to think that this was carrying good ideas too far!! Many desings were discussed in outlines a double outrigger experimental boat was noteworthy. It has been siggested that Mr. Eckford has never accidentally capsized a Fleetwind; a feat nearly as unique as the two nose-over capsizes he claims on \"Speedwind\" at speeds up to 17 knots!! His designs have one very important point in their favour - they can be built by amateurs who would never dare to build a \"traditional\" type of yacht, at a price which Marconi Sailing Club members can afford!!! HOH KH HK HH The Commodore asks that the following letter, received by him from the Assistant Secretary of the Royal National Mission to Deep Sea Fishermen be published as being of general interest to the Section. 5th. December, 1957 — Dear Commodore Payne, I would be most grateful if you would accept yourself and pass to the members of your Club, the appreciation of the Mission for the interest and action taken regarding the PENNANT, The sum which you have so kindly raised on our behalf will be put to excellent use in our work at this time and in attaching our official receipt I extend to you all our regards and best wishes for the Christmas Season. We trust that the winner will enjoy using the PENNANT and once again, thank you all. Yours sincerely, Enel. (Sgd) John G. Lewis ag Receipt ; er &2.10.0d. Assistant Secretary kx % * % Hee The fixtures for the coming Sailing Season have now been finalised and programmes should be available before the next issue of this bulletin. RXR KKK The next Meeting in our Winter Series will be held on Tuesday, ' 21st. January 1958 at the King Williem IV, New Street, Chelmsford, : commencing at 7.30 pom. Commander Rantzen will lecture on \"Navigation Wrinkles\". Make an effort to support the meeting by your presence - a lot of time is given by the Social Secretary in organising the events, which are arranged for your benefit and enjoyment. HK KKK HK Members are once again reminded of the series of lectures at present being run by Messrs. Clarke and Wardell. Various aspects in sailing are being taught and much useful information can be derived. All are welcome to the lectures which are being given on Tuesday 14th. January next and subsequent alternate Tuesdays in the Apprentices' Lecture Room, Building 720. For further information please contact Mr. Clarke at Baddow. XN KRHH HK"]},{"year":1958,"month":2,"no":"2","vol":2,"when":"February 1958","span":null,"contents":"Mona's Cup, Challenge Cup for Ladies' Race, Maldon Little Ship Club Icicle, National Boat Show, balance sheet","note":null,"file":"MSC-NL-1958-02.pdf","imgs":["1958-02-1.jpg","1958-02-2.jpg","1958-02-3.jpg","1958-02-4.jpg","1958-02-5.jpg","1958-02-6.jpg"],"pages":["— \"NAVIGAWN Ss\" Monthly Bulletin of the Sailing Section, M.A.S8.C. Editor:- W.J. Hodge (Hon. Sec. ) Vol.2 Issue 2 February, 1958 Now that we have acquired our new Clubhouse premises our main ambition should be its early renovation and conversion to suitable accommodat-— ion. In this regard members can be of direct assistance in two ways, (a) by early payment of subscriptions, thus enabling access to funds outside the scope of M.A.S.C. assistance and (b) by physical help in the work involved on site. This latter has been dealt with by the Commodore elsewhere and I will only endorse his remarks and urge full response to his appeal. The former however comes directly within my province and I earnestly exhort all members to send me their cheques or cash as soon as possible. Considerable outlay will be expended in the purchase of paint, furniture and other materials necessary for the internal decoration of \"Mamgu\" and it is very essential that we ourselves a tl realise as much cash as possible to meet these costs. Send your remittance to the Hon. Treasurer, Room 422, Marconi House. The Balance Sheet for 1957 is published at the end of this bulletin. DEG EE 20 9G Volunteers are still required for the work of fitting out the barge \"Mamgu\" as a clubhouse and offers of help, if only for a few hours at week-ends, would be welcomed. The work is proceeding apace and the important stage of removing the ballast from under the floorboards has been completed. This really stupendous task of lifting over ten tons of ballast from the hold of the ship on to the quayside was achieved and ti.e highest praise is due to those members who participated in this colossal work. Happily at the moment, the ship appears to be free of rats, but members are implored to leave not a vestige of food, or even sandwich papers on board, in order that rats may not be encouraged. E.A. Payne (Commodore) MONA'S CHALLENGE CUP Miss Mona Clark of the \"Jolly Sailor\" at Heybridge Basin has been _ very closely associated with the Club's activities since its inception and has now very kindly offered to present us with a Challenge Cup which will be held by the winner of an annual all-in handicap race. We are most grateful to Miss Clark for this kind gesture and we lock forward to seeing her fill the trophy so that we can all drink to her good health! CHALLENGE CUP FOR LADIES' RACH The Committee is pleased to acknowledge with many thanks the offer of a trophy from Mrs. Hallam, the wife of our Vice-Commodore, which it is intended to use as a challenge cup for a Ladies' Race to be sailed annually. Mrs. Hallam is well known to all members of the Club and is a frequent visitor to Heybridge and her gesture will be greatly appreciated by all.","CLUBHOUSE WIRELESS We wish to express our thanks to Mr. Fagg of the Baddow Drawing Office and a member of the main M.A.S.C. Committee for his very generous gift of a broadcast receiver which it is proposed to instal in the main saloon of the new clubhouse. The receiver will be invaluable for time checks and for weather reports and members will have a constant cause for gratitude to Mr. Fagg as they listen to the programmes. XXX RH SAILING NEWS The 1958 Sailing Programme has now been distributed. Twelve Flectwind Races have been arranged so that points for the Eastwood Cup may be counted on the best six results of each helmsman during the season. A Cup for helmswomen is being presented to the Club by Mrs. Hallam. The race for this cup will be on June 15th. Gentlemen will be allowed to crew. Two open days have been planned, when it is hoped that many members of the M.A.S.C. and their friends will visit us at Heybridge. Dersk Roberts (Sailing Sec.) Maldon Little Ship Club The Icicles Race was sailed at Maldon at the end of December, all entries being Fleetwinds, altho’ this is an open race. J. Hemmett was first in \"Diabolo\" which members will recall was constructed and sailed by Dick Pavitt. E. Lavington was second in \"Centipede\" and G. Young third in \"Cloelia\", these being Treasurer and Secretary respectively of the Fleetwind Association. POCKET HTT Ke KEI MARRIAGE ANNOUNCEMENT Members of the Sailing Club will wish to offer congratulations and all good wishes for the future to Mr. G.W. Nichols and Miss Cynthia Tindill on the announcement of their forthcoming marriage. 3 Mr. G.W. Nichols was our very able Treasurer in the club's early days, when he sailed his Fleetwind \"Lagonda\", and members will wish to see him sailing again at Heybridge now that he is assured of a crew! SAILING AT CAMBRIDGE UNIVERSITY The Commodore's son, Roger Payne, who is well known to many members of the club, reports that practice for the inter-college championships has already begun. Sailing is done in Fireflies on the River Ouse, about 13 miles to the north-west of Cambridge where the river is rather narrow and lined on one side with trees, In racing during the recent gales, no less than four dinghies overturned in icy waters whilst two dinghies, including Roger's fouled their masts in the overhanging trees whilst rounding a mark in a squall, One of the crew climbed the tree to free the masts and was dismayed when the dinghies sailed away leaving him hanging there!! THE NATIONAL BOAT SHOW The National Boat Show is barely four years old, but is already one of the most popular of the annual exhibitions; in fact, it can hardly grow any bigger, for it alroady fills the whole three floors of the Empire Hall at Olympia, with 200 stands many of which are shared by deveral exhibitors. You can see, and buy, anything from a one-man surfing canoe to a 48' motor yacht or a 14 ton yawl.","One sailing yacht, it is suggested, can be used ss a caravan when on its trailers if you prefer power craft, what about a caravan which can be launched and treated as a motor cruiser? Messrs. Saunders Roe have a high speed boat which climbs out of the water on ladder-like hydrofoils, and if this is not enough, Aero Research show a film of a boat that has an autogyro-type rotor wing, and lifts completely clear of the water when towed at 20 knots. These are said to be popular in America. Fibreglass-reinforced plastics are spreading rapidly through the whole boat industry. At the lower end of the scale are several water- scooter designs; but Halmatic Ltd. are interested in building any size up to 140 feet. Few racing dinghies are as yet made of this material but John Westell's \"5-0-5\" shells are breaking down any prejudices that may remain, You can now have a fibreglass huil moulded in any colour you likes Reeves Ltd. have a range of colour in polyester resin as wide as any paint manufacturer's. Sails even may be in polyester film now: \"Melinex\" (Terylene) film is used, and the results are reported to be better and cheaper than with woven \"Terylene\" cloth. These sails are transparent, so we see boats sailing fast, apparently with no sail set!! The most exciting craft? Undoubtedly the \"Shearwater III\" and \"Jumpahead\" catamarans. Although the \"Shearwater III\" design hes been published for eighteen months, no faster design has yet appeared. The most interesting stand? I would say the Amateur Yacht Research Society; a group that has had much to do with catamaran development, but is also devoted to experiments with unusual rigs, automatic steering, hydrofoils and other possible lines of progress. The most beautiful ship? The 48! \"Sea Clipper\" motor yacht, of steel construction, »Duilt in Holland and finished to a standard surpassing, if possible, even the yacht builders of the Clyde. Arthur Adam (Social Sec.) xX KX KX RR KK FOR SALE Fleetwind \"Muggs\" with two suits of sails, stainless steel rigging, winner of many cups and prizes. Apply:- Mr. E.H. Cottam, Research Laboratories, Great Baddow. Pair of motor car wheels with new tyres, axle and brakes - suitable for trailer. Apply:- Mr. S.A.W, Jolliffe, Research Laboratories, Great Baddow. CHARIVARTA Overheard by the Secretary during a recent office conversation.......\"what is a Fleetwind? A quick attack of indigestion?\" It was recently suggested to the Secretary that a prize be awarded for capsizing. There is no doubt who the winner would be ~ the prize would find a permanent home!? HE HE Ee 9 The following advertiserents are published as being of general interest weoveee","JOHN ARMOUR PRODUCTS & COMPANY LTD. Rairoak Airfield, Chobham, Surrey. Dear Sir, We have recently introduced into the market a Water Repellant Treatment which, on test, has proved extremely successful in the treatment of sails, sail bags, awnings, tentage and all types of fabric material which is subject to extreme weather conditions and we are confident that our Water Repellant would solve many of the problems encountered by the sailing members of your Club. itting \"Mamgu\" in readiness for her role as our new Headquarters, your Committee exhorts those members who have so far been unable to assist, to approach either Mr. Clarke or Mr. Hallam, both of whom are located at Baddow, and who may be able to suggest means whereby their efforts can be utilized, it is realised that not everyone is able to make the journey to Maldon or to Heybridge where \"Memgu\" will eventually, be berthed, but there are other jobs e.g. disposal of redundant equipment and material, in which members could assist \"from a distance\", The Editor has a limited supply of tickets and programmes for the \"Ail Sections Dance\" to be held in the Canteen on Saturday, 29th. March 1958. Those members requiring tickets are invited to ‘phone the Editor (Int. 669 Ext. Chelmsford 3321, extension 257) or call at Room 422 as soon as possible. At the time of going to press, consideration is being given to the Fitting~up Supper. The decisions of the Committee are given at the end of this Bulletin. XXX HR HX SATLING NOTES Blackwater & Colne Dinghy Championship 1958 At the Committee Meeting in Colchester on February 16th. which the Commodore and myself attended, considcrabie time was taken up in discussing the order in which the classes should start. To prevent the faster boats ploughing through the slower ones, it was decided that Cats should go firs? at i1 A.M, followed at five minute intervals by Hornets, Snipes, Sprites, Graduates, Fiectwinds (11.25 A.M.), Maylandsea Bay 0.D., Bleven Plus, Brightlingsea 0.D., G.F.14, Wivenhoe 0.D. and finally the handicap race starting at. 11.55 A.M. The winning helmsman in each of these races will compete in the race for the Champion Helmsman starting at 3 p.m. Craft for this race will be either Sprites or Fleetwinds, depending on the weather on July 13th. Fleetwinds will be raced if it is a calm day. Will owners of Fleetwinds please let me know if they are prepared to lend their boats for this race. Crew Contacts It was suggested at the last Club Committee Meeting that the Sailing Secretary could provide a useful service in arranging contacts between helmsmen requiring crews and members wishing to sail. Will those interested in this proposal please ‘phone the Sailing Secretary during the week at Baddow, Ext. 333. Transport to '\"Mamgu\" In the past weeks, some members have been available for work on \"Mamgu\" but for lack of transport have been unable to offer their services. So as not to lose this manpower, will anyone able to give a lift to Maldon, or requiring a lift to Maldon please contact the Sailing Secretary at Baddow. Derek Roberts, (Sailing Secretary)","—a a ee (2) MEMBERSHIP OF THE R.Y.A. The Duke of Edinburgh, President of the Royal Yachting Association, took the chair at the annual general meeting, which was held at Caxton Hall, Westminster. Mentioning that this occasion marked the end of his second year of office, the chairman said that within this period 105 yacht clubs were \"recognised\" and that 2,369 members had joined the association. Of these, 754 had joined since the new year. The total membership of the R.Y.A. now stood at 831 clubs and 5,212 individual members. \"At first sight\" continued the Duke of Edinburgh, \"the increase in membership looks quite satisfactory, but as there are probably 220,000 people who mess about in boats in these islands alone, it means that less than 2.5% are supporting the national authority. Some of the cthers.... are subscribing less than sixpence each annually by way of their club's R.Y.A. subscription.\" Turning presently to the rapidly increasing popularity of cata~- marans, the chairman said this was a type in which he was particularly interested and he was sure it was their duty to assist catamaran develop- ment with all its teething troubles, of which there would doubtless be many. He expected the R.Y.A. would have a catamaran committee before long. In presenting the Hon. Treasurer's report, Mr. H.K. Andreae was able to report that building on the foundations so surely laid by the late Sir Arthur Young, the association had reached a wholesome position in its finances. Last year, incomee exceeded expenditure by £3,000. The general reserve account now held £20,000. All the same, the association might be incurring mighty legal expenses presently - in defence of amenities eround the coasts ~ and a further increase in membership was desirable on this head alone, WINTER MEDTINGS A talk entitled \"Navigation Wrinkles\" given by Commander Rantzen on January 21st. was much enjoyed by members who turned up despite the dirty weather. Mr. Feesey will lecture on \"Yachting Reminiscences\" at the King William IV at 7.30 p.m. on Tuesday 18th. March 1958. Members are asked to support these meetings which are arranged at considerable trouble by the Committee. SO ee FITTING-UP SUPPER It has now been decided that this function, second only to the Laying-up Supper in social importance shall be held on Friday, April 18th. at the \"Jolly Sailor\" Heybridge from 7.30 p.m. to 11.30 p.m. A Buffet Supper has been arranged on the lines popular in past years and a film show is to be organised as light relief. Transport will be arranged if necessary, and in order that we may find out the true needs of transport, members wishing to make use of public transport are asked to complete the form attached to this bulletin and return it to the Editor in Reom 422, Marconi House, Chelmsford, Essex by 21st. March latest. The price of tickets for the function will be 4/6d. each plus 2/6d. each for coach accommodation. »* All members are earnestly exhorted to support the Supper, and indicate ticket requirements on the form attached for that purpose.","(3) MEDWAY WEEK PRELIMINARY NOTICE 1958 Monday, 9th. June to Sunday, 15th. June, at Upnor Royal Engineer Yacht Club Medway Yacht Club Royal Naval Sailing Ass'n Medway Cruising Club (Nore Command) Sheppey Yacht Club Yacht owners are cordially invited by these five clubs to attend Medw
