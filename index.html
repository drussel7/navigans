ex ss 20th. F. Garrett WJ. Hodge Octr. 3rd. Ge Wardell FR. Sims 18th. A. Durham Ss Dates marked The Officer of the Day is responsible for providing a time-keeper, WD. Meals oe oe a oe sk oak se ok ook dn 18' Sailing Dinghy, Bermuda Rig, with new Sails and Rudder is available FREE for the coming season in return for maintenance, Paint etc. will be supplicd by the oymer. Apply:- Mr. %0. Agar, \"“Middleford\", Danbury, \"phone Danbury 206 Ly or Gt. Baddow, Bxt.337 ' The following circular letter has been received from Messrs. Hawkins and Tipson, Rope makers of Loncon E,0.3 and is published for general information, - Dear Sir, \"YavLow't Terylene Yacht Rope We have now had an opportunity to study the results of the National Boat Show, and one very obvious fact is that many new Yacht Clubs are flour- ishing in areas where there is no Yacht Chandler or Dealer to supply their requirements. In order to assist us in giving the finest service available to all sailing people, we would be particularly grateful if you would advise us on the enclosed stamped and addressed postcard, your nearest and most suitable store, so that we can arrange for our MARLO Terylene Ropes to be held in stock or for samples to be held. Yours faithfully, for HAVKINS & TIMPSON LIMITED Note from Editor: This has been done and Messrs, Hiscocks nominated, V.d0H. me et uk ae ae x 8s","My Wen In order to achieve our aims of holding the Fitting-up Supper on board \"Mangu\", there will be two working days during the coming month, Sunday April 5th. and Sunday April 12th, Much remains still to be done if we are to hold this function on board, and we look to those who have not supported us in the past to take this last opportunity of doing so. THE ART OF SATLING - Anon This coming season, some of you, we hope many of you, will be sailing in small boats for the first time. If you bear in mind these few points, most of them, I fear, \"don'ts\", both you and the ower who is taking you out should have a pleasant: days Firstly, getting abourd, If the boat is riding out on a mooring, and a dinghy trip is involved, try to avoid plastering too much mud over the dinghy, sit where you are asked, keeping your weight as centrally in the dinghy as possible, and above all, SIT STILL, Most small dinghies are barely safe at the best of times and fatalities have occurred where overleaded dinghies have capsized. Qn reaching the boat and getting abowrd, step straight up from the centre of the dingh on to the boat. If you put any weight on the side of the Ginghy, you will either capsize it or drive it away from the boat, leaving your= self horizontal with your feet in the dinghy and your hands on the boat. You will not remain long in that position$$ If the owner asks you to put the rowlocks in t e dinghy, please make certain they are securely tied to some part of the dinghy's frame, so that they will not get lost should they be jerked out, First thing on getting aboard - be sure that the soles of your footwear are clean, The banks of the River Blackwater have an abundance of evil mud and, whilst it is fairly easy to remove from shoes, boots and feet, it is the very Gevil once it gets into the boat, The best thing by far is to leave shore-going shoes ashore or in the dinghy and cither take a clean pair of plimsoles to wear aboard or sail bare-footeds ve feet will usually provide the surest grip on decks and floorboards. : At all costs, avoid going aboard in hard-soled shoes, or rubbers with grit embedded in the soles, as these are a most effective means of removing deek canvas and vamish, Once aboard, do as you are asked, even if you camot see why, No owner will mind answering questions when jobs are completed, but if you are asked to do anything, do it quickly and then find out why it has to be done. Never make a sudden movement aboard but always be 1eady to move smoothly and quickly. Above all, never fool about in a boat. Comedy can turn to tragedy all too quickly, I do not imagine there can be any owners who object to smoking aboard, but see that matches, ash and cigarette ends go overboard and not in the bilges, Likewise, toffee papers. It is a dirty tedious job cleaning out the bilges of a boat, so help the owner all you can by keeping papers, ash, breaderumbs etc, out of the bilges. Never smoke whilst handling sails as they are easily burnt. This applies particularly to Terylene, If you get your hands dirty handling the anchor or the engine, wash them over the side before touching the sails. They get dirty all too easily and a sail of any size is a brute to wash. Finally, don't forget to thank the ower who has had the pleasure(?) of your companys Offers of help with work on the bpat will seldom be refused as very few owners can find the time to do all the jobs necessary to keep a bout in tip-top condition.","4 \"ANCHORING & MOORING\" Here is an extract from the Section on Some Legal Aspects of Yachting in \"Cruising and Osean Racing\", one of the Lonsdale Inibrary series. The writer, George Corderoy of the Inner Temple, Barrister=at~bav, is an authority on the subject. On the subject of anchoring and moorings he says: \"The mariner has no right to any particular berth, If, when he can berth elsewhere he berths too close to empty moorings, or even a nuisance (supra) he will be liable for consequential damage to them, But where there is no other berth except in proximity to the nuisance, the owner thereof would have no action for damage to ite What happens in the like circumstances in the case of empty moorings is a moot point. Tt can be argued that the owmer of the moorings leaves them (as something of a nuisance) subject to damage in case of necessity; but the point is un- decided. But berthing close to empty moorings without damaging them does no legal wrong, for a vessel cannot claim a berth except by occupying it. And all the berth any berthed vessel can claim is a clear berth, i.e. that there should be suck space left for swinging to the anchor that in ordinary circum- stances the two vessels cannot come together. If that space is not left, I apprehend it is a foul berth (The Northampton, 1853, I. Spinks, 152, per Dre Lushington, at po.160). If, therefore, a vessel leaves a dinghy on the moorings, all that is Claimed is a clear berth for the dinghy, and the vessel on returning is not entitled to moor on its moorings if it will thereby give another vessel a foul berth, If the returmming vessel is unable to bring up without ground tackle suited to the locality or, if it discovers too late that the berth is foul, or negligence in failing to keep a proper look~out; and in either case will be liable for consequential damage; though, of course, no liability arises until damege has been done; thus a vessel might bring up in a foul berth, in order to bring up, and then shift to a proper berth before any damage is done = an un=-seaman=like proceeding, When a vessel has brought up, it has not thereby acquired a right to its berth in all circumstances, Thus a change of wind may make it necessary to shift so as to leave room for other vessels to tack, then not to shift would be to obstruct navigation. Or the weather may make it likely that the vessel will break adrift. If it stays om and takes the risk, when it could without greater risk have changed its berth, then it may be liable for damage done to other vessels. Moorings are only an elaborated anchoring; the fact that a vessel is at moorings docs not entitle it to stay there any more than if it were at anchor. To use another's moorings is, technically, a trespass to chattels; the likelihood of the mariner being sued for the mere trespass (apart from damage to the tackle) depending = as do all problems - on the manner of all concerned; but equally, technically, you may give up the mooring ond insist on your right to remain in the berth on your own tackle, for you cannot be asked to shift from a clear berth solely in order that someone else may avoid giving you a foul berths The practical thing for the owner of moorings to do is to have them in the waters of some local harbour authority and get the harbour-master, (whose orders mariners must obey) to do what he can to keep the moorings unoccupied and fit to give a clear berth. Any berth must be shifted at the order of the harbour-master.\" Heat"]},{"year":1959,"month":5,"no":"5","vol":3,"when":"May 1959","span":null,"contents":"Mamgu, monthly working day, MLSC picnic at Osea pier, 'To Stop Leeway'","note":null,"file":"MSC-NL-1959-05.pdf","imgs":["1959-05-1.jpg","1959-05-2.jpg"],"pages":["NAVIGANS\" hess: Cale, Monthly Bulletin of the Sailing Sectien, M.A.S.C. ce Editor:~ WJ. Hodge (Hone Sec ) Vole3 Issue 5 May, 1959 COMMITTEE NOTES Notwithstandingnthe numerous last-minite hitches which threatened to jeopardise its success, the Fitting-out Supper was a Miracle of organis- ation, both socially and financially. Some sixty people were present on this occasion - a record number = and there is a rumour that members would like to see more such events in the social life of the Club. \"Namgu\" is now well established es a centre for week-end activity - the general disorder and uahygienic conditions prove the point. There is no objection, yet, to members using the barge but please keep it tidy. A lot of very hard work has gone in re-decorating \"Mamgu\" and your Committee is determined, and rightly so, to ensure that the effects of this hard work are not destroyed at the hands of a few thoughtless people. One last point, the monthly working day. This will be on the 47th. May 1959. There has been a marked slacking-off in the response to these working days, yet plenty remains to be done to get the barge suitably launched as our Club-house. At the last Annual General Meeting, members, were generally in agreement to an established time for such work and this bulletin has advertised monthly the appointed day in that month. Do pleasd& come along and give us a hand ~ we re.lly need it. W.J.H. SATLING NOTES The Maldon Little Ship Club has invited the Marconi Sailing Club to meet on the beach below Osea Pier at 11230 aeme on Monday 18th. May 1959 (Whit-Monéay) for a game of rounders (or some such other games as may be decided) a picnic and a general get-together. It is hoped that as many members as possible will bring their boats along and make this first joint picnic a success. High weter at Heybridge is at 9.29 aem, so you will have ample time to get away. WeD.Re ODD JOTTINGS Members may be interested to hear that the Marconi Club gained a mention in this year's \"Enterprise Year Book\", Don Freeman, also a member of the Thorpe Bay Yacht Club having launched his new dinghy \"Enter 1\" at Easter. Don is sponsor or the \"Enterprise\" at Thorpe Bay Club and has been allotted Fleet Number 27; the fleet hopes to have a suitable trophy for amnual competition later in the yeare The main \"Enterprise\" events in the area during the season are as Pollow:= Parkstone Yacht Club August. 17th - 21st. Nationai Championships Alexandra Y.C. Southend May 9the — 10the Open Event Maylandsea Bay Y.C. May 23rd. -— 2th. Open Event Burnham=on=Crouch S.C. June 6th = 7the Area Championships. 1959 AeGeM.e & Dinner is at the Piccadilly Hotel, London on Saturday December 5th, 1959. Alan Smethurst hopes to be sailing with the Club again this season in \"Varne\" F.W.13., despite the threat of the movement of his factory to Swindon. As no water seems to be available near Swindon, he expects to make the journey to Heybridge most weekendse","2° Many members of the Company who have maintained great interest in sailing, claim they are unable to afford such expensive hobbies, and. had the wind taken from their sails when the offer of a sailing dinghy, free, for maintenance, appeared in last month's issue of \"Navigans\". Perhaps the thought of maintenance frightened them, anyway they have now gone back to their hobby of marbles. TO STOP LEEWAY (A brief review of the usual methods) by \"Barnacle\" There are four main ways of stopping a boat from going sideways, viz. Fixed keel, Fixed. bilge keels, leeboards and centreplate. Each method has its own peculiar advantages and. disadvantages, but if correctly designed, all can be effective and leakproof. The Americans have proved that beamy, shallow- draught centreboards can win ogean races and they do not fall apart after their first seasone Nor are these races won by designing specially for a low rating. First, let us consider some of the disadvantages of the various methods. Twin bilge keels and leeboards both require the hull to be strenghened at rather awkward points. With careful design, this can be the onlt disadvantage with bilge keels but with a large heavy boat, it may prove almost insuperable. Lee beards: unfortunately, are applicable only to certain types of huliis and they do not seem to be very good on small boat@ Their only other disudvantages are their liability to damage on coming alongside and the extra work involved in coming aboute wo?” Centreboards have three main snags. They are not easy to maintain, they may get jammed in their case, and the casé and tackle obstruct the cabin. The first point is true. They are an extra worry at fitting-out time. Also, “ww they may get jammed up by mud and stones, but a well-designed boat will have a removable panel in the case through which the plate can be easily freed. A plate which jams up through getting bent or through failure of the lowering mechanism has been badly designed and carelessly handled or maintained. With careful design there is no need for the case to obstruct the cabin. It is often possible to keep it below the cabin sole and if it does project up, it can have a table built on to it. A surprisingly large number of otherwise sane owners say they wouldn't have a centreboarder beacuse of the obstruction in the cabin, and yet, when you go aboard their boats, keeled over at 30° at low tide, you find the keel of the mast end a fixed table obstructing the centre of the cabinl: New the snags with a keel boat. The major snag is that they will not take the ground upright but have to be propped up against a quay or on legs and if they fall over they mat stave in the bilge or fill and sink when the tide comes ine Secondly, they have a limited cruising range. There are many swatch- ways on the East Coast which are impassible for deep boats and though they can visit many of the small ports at high tide, they must leave with the ebb or go aground. Thirdly, they are awkward to slip as they must have a cradle specially built up for them. eS One great advantage can be the extra stowage space and space for bilge water below the cabin sole, but on boats of comparable size, this is obviously offset by the increased displacement and increased wetted area. There are of course boats which have more than their fair share of disadvantages — \"Sheal draught\" cruisers which have not much room below decks, make excessive: leeway and still fall well over cn going aground and the various types of centreboarders with an embryonic keel which, although they make less leeway, still fall over on taking the ground and have the added disadvantages of the centreplate. All these types need care in handling on a falling tide as, if they do go aground, they must be kedged or towed off immediately. One great disadvattage of a centreboarder is the early warning given of shoal water. Unless the bank is very steep, or the mud very soft, there is not much excuse for getting a centreboarder stranded. high and dry! A boat with bilge keels increases its draught as it keels over so, if they do touch on a lee shore they will often float clear once the kedge is laid out and the sails lowered. : RK Ok OK ok OR ok Kok TATL=PIECE Overheard on the Sea-wall at Heybridge one blustery day ese. \"Wot does FW. stand fer mate?\" \"Flippin. wet, cock\""]},{"year":1959,"month":6,"no":"6","vol":3,"when":"June 1959","span":null,"contents":"Tidiness, 'What Constitutes a Cruiser'","note":null,"file":"MSC-NL-1959-06.pdf","imgs":["1959-06-1.jpg","1959-06-2.jpg"],"pages":["'NAVIGANS\" Monthly Bulletin of the Sailing Section, MeAS.0. Editor:- Wod. Hodge (Hon. Sec.) Vol.3 Issue 6 ; June, 1959 COMMITTEE NOTES Some people pride themselves on tidiness of person and environment and yet have no conscience in the matter of maintaining order in \"Mamgu\". All that can be said in excuse of such conduct is that they may be under some illusion that the barge is staffed with personnel charged with her cleanliness. Let me now dispel from your minds any such notion - most if not all of the work in keep=- ing \"Mamgu\" up te the standards of suitable clubhouse accommodatien has been done, and is being done, by the Committee and a few members in their leisure hours. If, as it seems, appeals to better nature have no effect on those members who wilfully leave dirty milk bottles and unconsumed food around, then we shall have one course of action nly = to identify the culprits and withdraw their keys. Now we don’t want to ds this, so please make an effort to co-operate vee With us in our aims ‘to eensider the comfort of the many tidy rather than the few zareless members. W.J.He SATLING NOTES Support for Single Hand and Novice Races is inadequate to provide an interesting event. On the other hand, the \"Down the River\" picnic trips are being well supported, Another of these outings could be held in place of the race scheduled for June 20th. in the Club programme. Will members please give their opinion and likelihood of support to the Sailing Secretary, (now Me. Se Adamson, Central Division - Internal No. 713) or to any other Committee Member. PERSONAL W.D. Roberts The Club is considerably poorer by the loss of our very able Sailing Secretary. Mr Roberts has served in vhis capacity for two years and spared no effort in his endeavours to promote the interests of sailing. His ability was evident from the commencement of his membership, -~for within four months of joining, he was elected to the office of Sailing oretary, and has since been solely responsible for many of the facilities now enjoyed. Tho very happy liaison with the Club Secretary is gratefully acknowledged and aun good wishes go with him. into his new sphere of life. A. Durham Following oné year of office as bo'sun to \"Avril\" and another as Committee member, we have lost the services of Mr. Durham, who has now left the employment of the Marconi Company. . We wish him well in his new job and look forward to seeing him at Heybridge whenever possible. S. Adamson Consequent upon the retirement of Mr. W.D. Roberts from the office of Sailing Secretary, Mr. S. Adamson has been elected to office for the remaining five months of the Sailing Year. Mr. Adamson has worked very hard in the interests of the Club for many years and we hope that members will give him the same support enjoyed by his predecessore i \"WHAT CONSTITUTES A CRUISER?\" by ‘Barnacle’ Thirty years ago, the division between cruisers (including ocean racers) and day boats and dinghies was obvious. Now however, with more and more people","2 taking to the water at week-ends, many of them trying to get a boat as cheaply as possible, the difference is not nearly so marked - in fact some of the boats effer- ed to-day as \"cruisers\" are hardly good day boats. Let us briefly review a few of the requirements of the cruiser. Firstly, it must be self-sufficient, carrying tools and materials for running repairs and either buoyancy materials or a dinghy capable of saving the crew in an extreme emergency. It should not be necessxry to mention that the hull must be basically SEAworthy - not just DITCHworthy and strong enough to take the inevitable knock in harbour. A boat which can be holed by a day tripper in @ roaming boat can hardly be strong enough for the rough and tumble of cruising. Secondly, a cruiser must have space to sleep the crew - 6'6\" x 2' per person. On an ocean race, there may be more crew than bunks, but then, there will always be at least one man on watch. The next essential is adequate space and facilities for preparing and eating HOT nourishing meals. When cruising, a tin of self-heating soup and a packet of biscuits does NOT constitute a meal. At least one stove should be capable of use whilst sailing in the worst of conditions as this is when a hot meal is most likely to be needed. Next, a cruiser should have ample stowage space for food, water, spare clothing, charts, tools, ropes and all the spare sailing gear. A fixed cabin (or even a deck!) does not automatically make a boat S suitable for cruising - in fact, one of the best equipped small cruisers sailing Pe from Maldon is a 13' three quarter decked dinghy. a beamy seawaorthy hull witha “=” snug gunter rig, a small inboard engine, and numerous lockers, clips and shelves Bor the gear and a canvas cover to sleep under. When cruising in a boat of this type, it is essential to keep everything in its place and to keep as much of the gear as possible ia polythene bags, as once all clothes and bedding get soaked, a holiday cruise can become absolute misery. A boat with even a very small cabin (or semi-permanent cenvas hood over the fore end of the cockpit) offers the tremen- dous advantage that the bunks and stoves can be always under cover. However, if the boat starts slipping heavy water, it will very soon reach any bedding not LEY and wrapped in a water-proof cover. A fully-decked hull, with an adequate bolkhead between the cabin and the cockpit is really the only type of boat which can be sailed continuously with any assurance of comfort for the watch below. One other point which it should not really be necessary to mention = a cruiser should carry adequate facilities for navigatiom. One all too often sees so-called cruisers without even a compass aboard. If a sudden fog descends, you don't need to be further away than Stone to be well and truly lost. oe Ge Ok WR Ok oe OK OK kk ok Ok ko sel WANTED GLASSPAPERERS & POLISHERS ~ evenings andweek-ends. Good healthy exercise in the fresh air! A fine way of spending an evening or week-end. No previous experience necessary. Glasspaper, polish and cups of tea provided. Apply:- JA. Scarlett, Room 109, M.W.T. Research Laboratories, Gt. Baddow. Internal Noe 272, External No. \"Extension 20\""]},{"year":1959,"month":7,"no":"7","vol":3,"when":"July 1959","span":null,"contents":"Officer of the day, club dinghy, MASC football pool","note":null,"file":"MSC-NL-1959-07.pdf","imgs":["1959-07-1.jpg","1959-07-2.jpg"],"pages":["NAVIGAWNS\" Monthly Bulletin of the Sailing Section, MeASCe. Editor:~ WJ. Hodge (Hon. Sec. ) Vol.3 Issue 7 July, 1959 COMMITTEE NOTES Our very able bo'sun, Mr. Peter Darney has been elected to fill the vacancy caused by the retirement of the Sailing Secretary, Mr. WD. Roberts. Mr. Darney is well known to the Section and should prove: invaluable in work on the Committee. Wed oHe OF FICER-OF~THE-DAY At the beginning of the season, the Sailing Secretary compiled a list of events for the forthcoming season, as shown in the Sailing Programme distributed to those members who are fully paid for the current year. He also made a list of members who undertook to accept duty as Officer-of~the- Day for each occasion = some members electing to serve on more than one event. This list was published in the April issue of \"Navigans\" and distri- buted to every member, After an enjoyable week-end on the sea and at the Club it is surely the proper. thing on the following Monday to consult these lists so that members can familiarise themselves with the coming events and at the same time, see if they are shceduled for duty. If they find that they are unable to fulfil their obligations, it is only right that they find a substitute and inform the Sailing Secretary accordingly. It is impossible to run the Club efficiently unless every member plays his part and honours his commitments. Swely it is not much to ask of heir annual subscriptions to the Sectior. Expenditure on behalf of the Club is high and income is very limited, so that every shilling counts. If you have not already done so, please therefore send along your cash or cheque to the Hon. Treasurer, Room 7880, Marconi House, as soon as possible. Members are reminded again that facilities exist within the M.A.S.Co for financial assistance in the purchase of boats. For details, please contact Mr. R. Bolt, General Secretary of M.A.S.C., Vistoria Road, Chelmsford Essex, Internal 'phone number 779. WedeHe NAVIGATION LIGHTS Members of the Club, especially those who sail cruisers after dark, will be glad to learn that a ten-second occulting navigation light has been installed on the roof of the Blackwater Clubhouse. This project was organised by the joint Racing Committee of which our Club is representative and it fulfils a long-felt want. Maintenance is, for the present, being undertaken by the Blackwater Sailing Club, but our own Club contributed to the capital outlay. DINGHY NAVIGATION Passengers seated on the aft thwart of a dinghy, and therefore facing the direction of travel, can be of great sergice to the oarsman, while being rowed out to a mooring for instance, if they press their hands together, as if in prayer, and point to the best direction to row, in order to reach the desired destination with the least effort and in the shortest time. This saves the oarsman having to crane his neck to see where he is going and as wind, waves, tide and avoidance of obstructions have to be watched, the job is not as simple as might at first be imagined. Usually passengers like to feel they are helping the perspiring oarsman and, if they are young, it helps to keep them quiet - even if they do not always indicate the best course? EAP, te tte tee te etetest SATLING NOTES BLACKWATER & COLNE DINGHY CHAMPIONSHIPS The Blackwater & Colne Dinghy : Championships are well known as the event of the year on the Blackwater, With over one hundred boats, representative of a dozen classes, all in sight the whole time, the event is interesting to spectators and at times, positively hair-raising to competitors, With the morning weather forecast giving wind force 6, an exciting race was assured!! For the Marconi Club the first casualties occurred before 10 am, ~ two boats disebled on the way to the venue, Another having arrived at Stone, decided that his ancient sails were unequal to the strain, Consequently, the Marconi Club was left with only one entrant. The course took such toll that no class was able to provide the twelve boats required to determine the \"cock of the river\" by the time~honoured method of all class winners sailing later in identical boats. The officers decided","that all finalists would use their own boats on Portsmouth handicap figures. The highlight of the final, from a scratch start, was a Hornet running with spinnaker in force 6 wind, beating the catamaran three quarters of the way round the course to come in only seconds behind the \"cat\" = a decisive (on handicap) and worthy victors The ~ reigning champion, Stevens of Maylandsea, retired half way through the first race to conserve his Flying Dutchman for the F,D, world championshipse Analysis of performance of the small classes is interesting, particularly in view of the decision which our Fleet- winds have bee given end the glowing claims of super stability in the Enterprise. CLASS STARTERS FINISHERS GRADUATE eNWH ENTERPRISE ELEVEN PLUS PIEELWIND S.A. Here are some racing results of past events in this season:- April 11th, ist. Dinghy Race Abandoned Ran on July 3rd. April 25th, 2nd, Dinghy Race Cancelled May 10th. 3rd. Dinghy Race ist. F, We 380 Ge Mayo 2nd, = 167 Uaso6FrpeEytw?2lae Partridge 3rd. F. We bp) Elkins 4th, Solo Roberts F.W.137 Adamson, ( retired) May 2th. th, Dinghy Race ist. Fe We1 50 Harris 2nd. FeW.133 Elkins 3rd, E.167 Partridge ith, FN, 380 Mayo 5th. Foie 137 Adamson June 13th, 5th Dinghy Race ist. Fe We 150 Harris 2nd. Fo We 380 Mayo 3rde Fo We137 Adamson 4the Fe We1 33 Elkins 5th, — GP/1 849 Goulden Partriase’(retired) June 27th, 6th, Dinghy Race ist. F.We 150 Harris 2nd, FW. 380 M FLW. 133 Pratt } Fo We 137 Adamson) retired July 18th. 7th. Dinghy Race lst. FW. 150 Harris 2nd. B.We 133 Elkins: 3rd. FeWe 134 Scales the E167 Partridge FW. 137 Adamson (retired) July 3rd. Ist. Dinghy Race ist. Fo We 150 Harris 2ndo FoWe1 34 Scales 3rd. F.W. 380 Mayo the PF. We 133, Pratt Fy We 137 Adamson (retired) The \"Fleetwinds President's Cup\".is included in the dinghy races, therefore lst., 2nd, 3rd, etc. in the Cup will be the FW ee 9 Coke the 3rd, Dinghy Race *Meetwind Cup woulid be:= Ist. Fel. 380 G. Mayo 2nd, By We 1 33 K. Elkins. Fo Wo1 37 S. Adamson (retired) DF. Ce ee","wo) CRUISING IN A RACING DINGHY by \"Barnacle\" In experiences hands, the smallest of racing dinghies can be used for cruising, provided the owner is prepared to put up with certain inconven- iences, chief of which is the need to put ashore to sleep and often to eat a good meal. To be satisfactory as a cruiser, the boat must have ample buoyancy and sufficient space in which to lash all the gear securely. Cruising in a racing dinghy differs from normal cruising in that the cruise must be planned on a day-to-day basis and a careful watch kept on the weather. Also, more precautions must be taken. It is as well to keep the gear carried at a minimum and to stow as much as possible in the centre of the boat, round the plate case, using the toe straps to tie it in. It is also well to plan the cruise so that nights can be spent at Youth Hostels, boarding houses or hotels, according to the depth of one's pockets, but arrange for alternative ports of call in case wind or tide misbehave, and do not try to do too much in any one day = a long beat in a rough sea is very wearying and if you do capsize (T.W.eH. to note!) you may be too tired to right the boat. It is ofsen good policy to use an undersize suit of sails ~ the Enterprise has a Special cruising rig which is smaller than the usual racing rig - and do not be afraid to reef - you won't lose any points if you take another hour to get there, but you may lose your life or your boat, if you are not careful. Unless the weather is exceptionally settled, it is wise to wear personal buoyancy all the time and tie the end of a sheet around your waist( after making sure that it will not pull away from the sail or boom). Compass, charts, tide tables, waterproof torches, a good anchor and warps must be added to the boat's normal gear, and it is a good idea to carry a couple of large Thermos flasks in clips in the aft end of the cockpit. A trapeze and a good self-bailer will make life easier for the crusiyig dinghy owner. A boat with a large open cockpit can be improved by fitting canvas aprons over as much of it as practicable. Personal gear can be limited to a complete change of clothing and toilet kit, but take a good suit of oilskins. If you are a smoker, be sure your cigarettes are well wrapped up and carry lots of boxes of matches. It is advisable to keep cigarettes and matches in small quantities sealed in a large number of Pdythene bags, then, if one packet does get damaged, you will not lose many. Incidentally, the striking surfaces and contents of a box of safety matches will fit nicely into an \"Ilford\" 35 mm screw top film can. It must be realised that cruising in a racing dinghy is no sport for novices. You must be master of your boat and always remember that the Club launch is not. following you as a rescue boat and that if you do get into difficulties, some- body will probably be put to a great deal of trouble and expense to rescue you. Such occurences do much to give \"sailing\" a bad name. Fortunately for M.S.C. members, the Blackwater & Colne Estuary is a first class area for dinghy cruising and when you feel certain you can handle your boat, there are the Orwell, Stour, Deben, Alde, Crouch, Roach and Thames which can all be reached with only short sea passages. Finally, before you start, plan your cruise thoroughly. Check over the boat and all gear, andmake sure that all is sound and well stowed. Study the charts and tite-tables and work out times of tides and reasonable courses to steer beforehand, not forgetting to work out all possible alternatives to suit all weather conditions and possible mishapse Do not be too venturesome for a first cruise. One last word. Be sure that you are flying a triangular burgee (unless your Club has honoured you with Flag rank) and do not set out on a cruise with your racing flag nailed at the masthead. we ok oe oe ook OK ek ok Kk ok"]},{"year":1959,"month":9,"no":"9","vol":3,"when":"September 1959","span":null,"contents":"Fleetwind compared with Enterprise, 'Is Your Cruiser Properly Equipped?', results","note":null,"file":"MSC-NL-1959-09.pdf","imgs":["1959-09-1.jpg","1959-09-2.jpg","1959-09-3.jpg","1959-09-4.jpg"],"pages":["= oe \"NAVIGANs\" Monthly Bulletin of the Sailing Section, MA.S.C. Editor:~ Wed. Hodge (Hon. Sec. ) Vol.3 Issue 9 September, 1959 SATLING NOTES Sincere thanks to the anonymous member at Baddow who unobtrusively took the launching trolley away, did a rather difficult repair, and returned it the following Saturday morning. It seems to me that he is the type to fill one of the Committee positions regretably falling vacant!! ee es Examples of my experience of spares service for FLEETWINDS over the past year eseeo New Mast - 1 week, boom - 2 days, halyards - days. When stays. were urgently required I rang Eckford at 11,30 Monday morning and they had arrived before I left home at 8.10 Tuesday morning. For the benefit of ‘the doubting Thomases, I would add, the same week!! tee t tee t et tette st A note to Race officers and assistants. Trouble has been experienced with the guns, due to burring caused by use of metal rods as extractors. Will some volunteer bring us a bit of 3\" dowelling or TUFNOL. eeee Ladies Race. It is proposed that this race be sailed on October 3rd, the same day as the team race with the M.L.5.C. Probable time 2.30 or 3. Forward objections or alternatives, please. tet EE tHe tet He eegeye The last year has seen a big increase in the number of larger boats and the family type boats. Are we doing all we can to introduce youngsters to the pleasures of racing dinghy sailing? A reminder... the FLEETWIND is still the club's first \"one design\" class. let us build up our ENTERPRISE fleet (now 3) by all means, but I would like to hear less unqualified remarks of\"the “Enterprise is better than the Fieetwind\" type. Let all judge the boats on their merits. The Enterprise has more room - yes!, AT THE COST OF TORTURING THE CREW ON A FOUR INCH SIDE DECK, \"It is more wearing to sail, owing to its lower initial stability\" - quoted comment of an Enterprise owner. The Fleetwind's box-like stern, often ridiculed (shared incidentally with the GePoth) greatly assists stability when running in a strong wind, since we have learned to sit aft when required, The Enterprise has not got this safety feature. (See report on recent Steeplestone event in last month's issue of the yachting magazines) A warning to prospective boat buyers ~ beware the experts! In no other field have I found them less reliable - choose your boat by first crewing in the various types and trusting in your own judgement. SoAe WOO oR Ka a ok a ak ak ak PERSONAL G. Mayo Once again the Club is faced with the loss of a good servant, in the person of Geoff Mayo - our Social Secretary. His term of office has been brief but he has nevertheless given yeoman service and shown in a very practical manner his keen interest in all our activities, His successor has not been appointed at the date of this Bulletin and we shall indeed find it difficult to replace the efficiency and personality which we have enjoyed under Geoff's regime. Good luck to him in his new sphere. WJ oH.","2 IS YOUR CRUISER PROPERLY EQUIPPED? by \"Barnacle\" Can you go aborrd and lay your hand on a good powerful torch - matches. - a imife to cut free the rope round the propeller = a fire extinguisher - a life belt - a heaving line - a fender - a brace and a drill - a hammer = an adjustable wrench ~ a splint for a broken arm = a tube of antiseptic - some plaster - a distress flare - a chisel or a spare shackle? If not, WHY NOT? Your life or the safety of your boat may one day depend on any one or all of these items. Or, if you have them all aboard, are they easily \"got at\"? Are the tools sharp? Are the batteries fairly new? Have you swung your compass since you installed that nice new engine? Have you replaced the rusty shroud? If not, have you got a length of wire and some bulldog clips aboard to make a temporary repair when ih breaks? Have you. got some spare sail-cloth, needle and thread aboard? They don't cost much, but it will cost you quite a lot if the sailmaker has to replace an entire panel of your jib, just because you couldn't patch a small tear when it started. How many pointers has your dinghy? Or do you like chasing a dinghy whose pointer has broken a hundred yards off a lee shore? Has the dinghy got the yacht's name and port of registry on it? Where are the spare dinghy paddles? i % How many enchors have you got2 What will you do if you are riding out a gale to main and kedge and the boat upwind drags down over your anchors. and gives you a foul berth? Have you enough warps aboard and a third anchor to hold you clear? Have you sufficient emergency rations aboard to last out a three day gale, either hove to or holed up in some desolate creek? Are all the charts of the area neatly stowed away in the dry and have they been corrected up to date? Being really ppssimistic (the mot juste! ~ Editor) have you a fiver handy to settle the salvage claim on the spot? Or will you have to make a deferred (and probably increased) payment? Have you got enough spare clothes aboard to lend a set to the dinghy sailor you picked up after he had capsized (you see Terry, we have your interests at heart - Editor)? Ave your pump inlets well filtered and easy of access? Or perhaps you like dismantling choked pumps when the boat is trying to throw you over- board? And then, when you've given up the pump as hopeless, have you got a bucket you can bale with? And has it got a good lanyard on the handle so om that you don't lose it when you drop it over the side? Is your first aid kit adequate? Can you cope with a scalded leg? A squashed finger?, a headache?, sea~sickness (not that much can be done about that, prevention here is better than cure), indigestion? » or any other common ailments? Can you give a patient artificial respiration? Are your liferail stanchions well secured? The rudder pintles sound? Have you replaced that cracked deadlight? Have you got a tin of grease handy for the winches and the sail slides? If, as I hope you will be able to) you can give the right answer to all these questions, have you got that dozen cans of beer in the bilges and ensured that that the gin, whisky and rum bottles are not empty? (I feel we should run a contest awarding points to correct answers to each of the questions, such as is done in certain papers of the national press. The aim? To find she perfect sailor. Editor) ee NOTA BENE I am askec to request 211 members using the yachting magazines circulated under the good »ffices of our Commodore, to kindly ensure that the copies are passed on to thcse interested and eventually returned to Mr. E.A. Payne, Baddow. Wed oH.","3 SOME POINTS TO CONSIDER ON BUYING A SMALL CRUISER by \"Barnacle\" Maybe some of you are planning to visit the Boat Show with a view to buying a small cruiser. Be careful what you buy. You are going to spend something oyer £200. Be sure you get value for your money and get a boat in which you can cruise in comfort without partially re-building it or, if you have any skill with tools, and any spare time, get a hull, spars and sails and do the cabin interior yourself, Some firms produce small cruisers with a superb finish - varnished all over. Avoid these like the plague. A varnished interior is useless on a small cruiser as it will make the cabin look smaller than it is and whatever boat you buy, you will find you would like a larger cabin. Also, once the initial high gloss has gone from the varnish, you will find the cabin will be a miserable gloomy place in which to live, even for one night. A pastel shade of enamel is a far better finish as it will make the cabin look much bigger, warmer and lighter. White is not good as it is cold and soon gets grubby, showing all the dirt. Blue also tends to be cold but is reputed not to attract flies and other insects. If you want to see the grain and colour of any timber inside the boat, use a Wax polish and you can touch it up any time and not have to leave it for a day to dry. Whilst on the subject of apparent size, get a boat with the minimum of bulkheads. <A bridge deck between cabin and cockpit is good for keeping the cabin dry but the only other bulkhead needed is a small one near the bowe Any other bulkheads will divide the precious cabin space into smaller units and will make the accommodation look more cramped than it really is. You need onlt glance at two otherwise identical hulls, one with a bulkhead or partial bulkhead by the mast, and one with the bulkhead about 3 ft. from the stem, to realise the vast difference in the apparent amount of room in the hull. Curtains can be used when required for screening off pa#t of the hull. Be sure adequate provision has been made for carrying fresh water, for cooking and for toilet facilities. One gimballed Stcue (GRAS a, Primus) just inside the aft end of the cabin with a shelf near on which a saucepan and kettle can be stood is the minimum to be asked of a small cruiser. Be sure the stove is not mounted too high and that it has s sheet of asbestos above it, for otherwise your cabin top will soon be filthy. A plastic bucket under a’ small plywood locker is the best form of toilet for a miniature cruiser. Bunks should be at least 6'6\" long and 22\" wide, though they may taper to as kow as 10\" at the foot. Be sure that some arrangement has heen made to prevent you slipping off the bunk when the boat rolls. Incidentally, 3' head- room is adequate for sitting in comfort. Obviously, you will not be able to stand up in a small cruiser and since 3' is more than adequate for crawling about there is really no need for an excessively high cabin top. Get a boat with the floorbo,rds raised high enough to stow tinned food and the inevitable bilge water underneath; it is most unpleasant to put your - foot in cold water on getting out of your nice warm sleeping bage Ample storage space is a necessity in a cruiser but remember that one vast locker or innumerable small lockers are both bad - three or four medium sized lockers will enable you to keep food seperate from clothing etc. and will alse be fairly easy to keep clean. Small shelves between the frames of the boat with 3\" perspex fronts are handy for stowing odds and ends but be sure the corners of the shelves are cut away so they will not trap water. Some form of table is also highly desirable. It may be hinged to the side of the boat over one of the buhks or it may be stowed out of the way by clipping up under the deck. Adequate ventilation of the cabin is another essential and be sure the ventilators are fitted with water traps. Some form of extractor vent over the stove is another good feature. Avoid large cabin windows for they easily get covered in spray and dirt and weaken the cabin sides unduly. Next month I hope to be able to mention some of the points to watch on the outside of the boate","4 SATLING NOTES Here are the results overall the racing season 1959. EASTWOOD CUP iste wbBsEtog6aOeb,2s) Harris 180 points 2nd. Adamson 168 points 3rd, Mayo 15. points Ath. Scales 153 points 5th. Elkins 108 points 6th. Pratt 67 points 7th. H
